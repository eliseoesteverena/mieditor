/* Orden: adelante/atrás intercambia z con el vecino; frente/fondo lo lleva al extremo */
function orderOp(el, op) {
  const piece = el.closest('.piece');
  const list = topLevel(piece);
  const i = list.indexOf(el);
  if (i < 0) return;
  const swap = (a, b) => { const t = zOf(a); a.style.zIndex = zOf(b); b.style.zIndex = t; };
  if (op === 'up' && i < list.length - 1) swap(el, list[i + 1]);
  if (op === 'down' && i > 0) swap(el, list[i - 1]);
  if (op === 'front') el.style.zIndex = Math.max(...list.map(zOf)) + 10;
  if (op === 'back') el.style.zIndex = Math.min(...list.map(zOf)) - 10;
}

/* Duplica un elemento de primer nivel, desplazado 24 px, en la misma posición visual */
function duplicateEl(el) {
  const piece = el.closest('.piece');
  const r = rectIn(el);
  const clone = el.cloneNode(true);
  clone.classList.remove('selected', 'editing');
  clone.removeAttribute('contenteditable');
  clone.removeAttribute('id');   // evita ids duplicados (la foto original tiene id)
  clone.classList.add('drag');
  clone.dataset.dx = 0;
  clone.dataset.dy = 0;
  clone.dataset.rot = parseFloat(el.dataset.rot) || 0;
  clone.dataset.locked = '0';
  clone.dataset.origin = 'user';
  clone.dataset.uid = newUid();
  clone.querySelectorAll('.drag').forEach(n => { n.dataset.uid = newUid(); n.dataset.origin = 'user'; });
  const cx = r.x + r.w / 2 + 24;
  const cy = r.y + r.h / 2 + 24;
  clone.style.position = 'absolute';
  clone.style.bottom = 'auto';
  clone.style.width = el.offsetWidth + 'px';
  clone.style.left = (cx - el.offsetWidth / 2) + 'px';
  clone.style.top = (cy - el.offsetHeight / 2) + 'px';
  clone.style.zIndex = nextZ(piece);
  applyT(clone);
  piece.appendChild(clone);
  select(clone);
}

/* Refresca el panel de la pieza según el elemento seleccionado */
function refreshPanel(card) {
  const piece = card.querySelector('.piece');
  const side = card.querySelector('.side');
  const el = selected && piece.contains(selected) ? selected : null;
  const locked = isLocked(el);
  const q = s => side.querySelector(s);
  const off = !el || locked;

  // Propiedades
  q('.sel-name').textContent = el ? elName(el) + (locked ? ' (bloqueado)' : '') : 'Ninguno (seleccioná un elemento de esta pieza)';
  ['.sz-r', '.sz-n', '.tc-t', '.tc-p', '.fg-t', '.fg-p'].forEach(s => q(s).disabled = !el);
  q('.del').disabled = off;
  if (el) {
    const cs = getComputedStyle(el);
    const fs = Math.max(12, Math.min(200, Math.round(parseFloat(cs.fontSize))));
    q('.sz-r').value = fs;
    q('.sz-n').value = fs;
    q('.tc-t').value = cs.color;
    q('.tc-p').value = toHex6(cs.color) || '#141210';
    q('.fg-t').value = el.style.background || '';
    q('.fg-p').value = toHex6(el.style.backgroundColor) || '#ffffff';
    q('.tc-t').classList.remove('invalid');
    q('.fg-t').classList.remove('invalid');
  }
  const pcs = getComputedStyle(piece).backgroundColor;
  q('.pz-t').value = piece.style.background || pcs;
  q('.pz-p').value = toHex6(pcs) || '#f7f5f0';

  // Organizar
  const ph = el && el.classList.contains('photo') && !locked ? el : null;
  q('.zm-r').disabled = !ph;
  q('.zm-n').disabled = !ph;
  q('.img-reset').disabled = !ph;
  q('.img-mode').textContent = 'Modo imagen: ' + (imageMode ? 'ON' : 'OFF');
  if (ph) { q('.zm-r').value = q('.zm-n').value = (+ph.dataset.imgZ || 1); }
  side.querySelectorAll('[data-al]').forEach(b => b.disabled = off);
  side.querySelectorAll('[data-ord]').forEach(b => b.disabled = !el || el.classList.contains('pc-sticker'));
  ['.w-n', '.h-n', '.x-n', '.y-n', '.rot-n'].forEach(s => q(s).disabled = off);
  if (el) {
    const r = rectIn(el);
    q('.w-n').value = el.offsetWidth;
    q('.h-n').value = el.offsetHeight;
    q('.x-n').value = Math.round(r.x);
    q('.y-n').value = Math.round(r.y);
    q('.rot-n').value = parseFloat(el.dataset.rot) || 0;
  } else {
    ['.w-n', '.h-n', '.x-n', '.y-n', '.rot-n'].forEach(s => q(s).value = '');
  }

  // Texto: alineación / interlineado / interletrado
  const isTxt = !!(el && el.dataset.f);
  side.querySelectorAll('.txt-block button, .txt-block input').forEach(x => { x.disabled = !isTxt || locked; });
  if (isTxt) {
    const cs = getComputedStyle(el), fs = parseFloat(cs.fontSize) || 16;
    const lh = cs.lineHeight === 'normal' ? 1.2 : parseFloat(cs.lineHeight) / fs;
    const ls = cs.letterSpacing === 'normal' ? 0 : parseFloat(cs.letterSpacing) / fs * 100;
    q('.lh-r').value = q('.lh-n').value = r2(lh);
    q('.ls-r').value = q('.ls-n').value = Math.round(ls * 10) / 10;
    let a = el.style.textAlign || cs.textAlign;
    a = a === 'start' ? 'left' : a === 'end' ? 'right' : a;
    side.querySelectorAll('[data-ta]').forEach(b => b.classList.toggle('on', b.dataset.ta === a));
  } else {
    side.querySelectorAll('[data-ta]').forEach(b => b.classList.remove('on'));
  }

  // Barra de acciones (móvil)
  const edTarget = editTargetOf(el);
  q('.sb-name').textContent = el ? elName(el) + (locked ? ' · bloqueado' : '') : 'Pieza · tocá un elemento';
  const bEdit = q('[data-q="edit"]'), bPhoto = q('[data-q="photo"]');
  bEdit.hidden = !edTarget;
  bPhoto.hidden = !(el && el.classList.contains('photo'));
  bEdit.disabled = off;
  bPhoto.disabled = off;
  q('[data-q="dup"]').disabled = !el || el.classList.contains('pc-sticker');
  q('[data-q="lock"]').disabled = !el;
  q('[data-q="lock"] small').textContent = locked ? 'Desbloquear' : 'Bloquear';
  q('[data-q="del"]').disabled = off;

  // Elementos
  renderList(card);
}

function bindPanel(card) {
  const piece = card.querySelector('.piece');
  const side = card.querySelector('.side');
  const q = s => side.querySelector(s);
  const cur = () => (selected && piece.contains(selected) ? selected : null);
  const editable = () => { const el = cur(); return el && !isLocked(el) ? el : null; };

  /* Barra de acciones inferior (móvil) */
  const toggleOpen = () => {
    card.dataset.sheet = '1';
    card.dataset.open = card.dataset.open === '1' ? '0' : '1';
    refreshAll();
  };
  q('.sb-grab').addEventListener('click', toggleOpen);
  q('[data-q="more"]').addEventListener('click', toggleOpen);
  q('.sb-x').addEventListener('click', () => {
    card.dataset.sheet = '0';
    card.dataset.open = '0';
    select(null);
  });
  q('[data-q="edit"]').addEventListener('click', () => {
    const t = editTargetOf(editable());
    if (t) startEdit(t);
  });
  q('[data-q="photo"]').addEventListener('click', () => {
    const p = editable();
    if (p) pickPhoto(p);
  });
  q('[data-q="dup"]').addEventListener('click', () => {
    const el = cur();
    if (el && !el.classList.contains('pc-sticker')) { duplicateEl(el); refreshAll(); }
  });
  q('[data-q="lock"]').addEventListener('click', () => {
    const el = cur();
    if (!el) return;
    el.dataset.locked = isLocked(el) ? '0' : '1';
    refreshAll();
  });
  q('[data-q="del"]').addEventListener('click', () => {
    const el = editable();
    if (el) deleteEl(el);
  });

  /* Pestañas */
  side.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => showTab(side, t.dataset.tab)));

  /* Propiedades */
  const setSize = v => {
    const t = cur();
    if (!t) return;
    v = Math.max(12, Math.min(200, Number(v) || 12));
    t.style.fontSize = v + 'px';
    q('.sz-r').value = v;
    q('.sz-n').value = v;
  };
  q('.sz-r').addEventListener('input', e => setSize(e.target.value));
  q('.sz-n').addEventListener('input', e => setSize(e.target.value));
  bindColor(q('.tc-t'), q('.tc-p'), 'color', cur);
  bindColor(q('.fg-t'), q('.fg-p'), 'background', cur);
  bindColor(q('.pz-t'), q('.pz-p'), 'background', () => piece);
  q('.del').addEventListener('click', () => {
    const t = cur();
    if (t && !isLocked(t)) deleteEl(t);
  });

  /* Texto: alineación, interlineado e interletrado */
  const textSel = () => { const el = editable(); return el && el.dataset.f ? el : null; };
  side.querySelectorAll('[data-ta]').forEach(b => b.addEventListener('click', () => {
    const t = textSel();
    if (!t) return;
    setAlign(t, b.dataset.ta);
    refreshAll();
  }));
  const setLH = v => {
    const t = textSel();
    if (!t) return;
    v = clampNum(Number(v) || 1, 0.5, 4);
    t.style.lineHeight = String(r2(v));
    q('.lh-r').value = v; q('.lh-n').value = v;
    updateBox();
  };
  q('.lh-r').addEventListener('input', e => setLH(e.target.value));
  q('.lh-n').addEventListener('input', e => setLH(e.target.value));
  const setLS = v => {
    const t = textSel();
    if (!t) return;
    v = clampNum(Number(v) || 0, -10, 50);
    t.style.letterSpacing = (Math.round(v * 10) / 1000) + 'em';
    q('.ls-r').value = v; q('.ls-n').value = v;
    updateBox();
  };
  q('.ls-r').addEventListener('input', e => setLS(e.target.value));
  q('.ls-n').addEventListener('input', e => setLS(e.target.value));
  q('.txt-reset').addEventListener('click', () => {
    const t = textSel();
    if (!t) return;
    setAlign(t, '');
    t.style.lineHeight = '';
    t.style.letterSpacing = '';
    refreshAll();
  });

  /* Imagen de la foto */
  const photoSel = () => { const el = cur(); return el && el.classList.contains('photo') && !isLocked(el) ? el : null; };
  const setZoom = v => {
    const p = photoSel();
    if (!p) return;
    v = Math.min(3, Math.max(1, Number(v) || 1));
    p.dataset.imgZ = v;
    applyImg(p);
    q('.zm-r').value = v;
    q('.zm-n').value = v;
  };
  q('.zm-r').addEventListener('input', e => setZoom(e.target.value));
  q('.zm-n').addEventListener('input', e => setZoom(e.target.value));
  q('.img-mode').addEventListener('click', () => { imageMode = !imageMode; refreshAll(); });
  q('.img-reset').addEventListener('click', () => {
    const p = photoSel();
    if (!p) return;
    p.dataset.imgZ = 1; p.dataset.imgX = 0; p.dataset.imgY = 0;
    applyImg(p);
    refreshAll();
  });

  /* Organizar: alinear respecto de la pieza */
  side.querySelectorAll('[data-al]').forEach(b => b.addEventListener('click', () => {
    const el = editable();
    if (!el) return;
    const pw = piece.offsetWidth, ph = piece.offsetHeight;
    const r = rectIn(el);
    let tx = r.x, ty = r.y;
    switch (b.dataset.al) {
      case 'left': tx = 0; break;
      case 'right': tx = pw - r.w; break;
      case 'hcenter': tx = (pw - r.w) / 2; break;
      case 'top': ty = 0; break;
      case 'bottom': ty = ph - r.h; break;
      case 'vcenter': ty = (ph - r.h) / 2; break;
    }
    moveBy(el, tx - r.x, ty - r.y);
    refreshAll();
  }));

  /* Organizar: orden */
  side.querySelectorAll('[data-ord]').forEach(b => b.addEventListener('click', () => {
    const el = cur();
    if (!el || el.classList.contains('pc-sticker')) return;
    orderOp(el, b.dataset.ord);
    refreshAll();
  }));

  /* Organizar: avanzado */
  const wN = q('.w-n'), hN = q('.h-n'), xN = q('.x-n'), yN = q('.y-n'), rN = q('.rot-n'), ratio = q('.ratio-r');
  wN.addEventListener('input', () => {
    const el = editable(); if (!el) return;
    const ow = el.offsetWidth || 1, oh = el.offsetHeight || 1;
    const nw = Math.max(1, +wN.value || 1);
    el.style.width = nw + 'px';
    if (ratio.checked) el.style.height = Math.round(oh * nw / ow) + 'px';
    hN.value = el.offsetHeight;
  });
  hN.addEventListener('input', () => {
    const el = editable(); if (!el) return;
    const ow = el.offsetWidth || 1, oh = el.offsetHeight || 1;
    const nh = Math.max(1, +hN.value || 1);
    el.style.height = nh + 'px';
    if (ratio.checked) el.style.width = Math.round(ow * nh / oh) + 'px';
    wN.value = el.offsetWidth;
  });
  xN.addEventListener('input', () => {
    const el = editable(); if (!el) return;
    const r = rectIn(el);
    moveBy(el, (+xN.value || 0) - r.x, 0);
  });
  yN.addEventListener('input', () => {
    const el = editable(); if (!el) return;
    const r = rectIn(el);
    moveBy(el, 0, (+yN.value || 0) - r.y);
  });
  rN.addEventListener('input', () => {
    const el = editable(); if (!el) return;
    el.dataset.rot = +rN.value || 0;
    applyT(el);
  });
}

/* ---------- Estado adicional ---------- */
let resizeState = null, panState = null, imageMode = false, press = null, lastTap = null;

/* Quitar un elemento (no se puede si está bloqueado) */
function deleteEl(el) {
  if (isLocked(el)) return;
  const piece = el.closest('.piece');
  flushAll();                      // lo anterior queda como su propia entrada
  el.remove();
  if (selected === el) select(null);
  else refreshAll();
  commitNow(piece);                // la eliminación es una entrada propia
  const h = HIST.get(piece);
  const at = h ? h.idx : -1;
  toast('Elemento eliminado', 'Deshacer', () => { if (h && h.idx === at) undo(piece); });
}

/* ---------- Edición (mouse y táctil) ---------- */
function startEdit(el) {
  if (!el || !el.closest('.piece') || isLocked(el.closest('.drag'))) return;
  if (isTouch()) { openTextBar(el); return; }
  el.contentEditable = 'true';
  el.classList.add('editing');
  el.focus({ preventScroll: true });
  const range = document.createRange();
  range.selectNodeContents(el);
  range.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

/* Doble toque en un texto para editarlo (los dispositivos táctiles no tienen dblclick) */
document.addEventListener('pointerdown', e => {
  press = { x: e.clientX, y: e.clientY, type: e.pointerType, el: e.target.closest('[data-f]') };
  dtEdit = null;
});
document.addEventListener('click', () => {
  if (!dtEdit) return;
  const el = dtEdit;
  dtEdit = null;
  startEdit(el);
});
document.addEventListener('pointerup', e => {
  if (press && press.type === 'touch' && press.el && Math.hypot(e.clientX - press.x, e.clientY - press.y) < 8) {
    const now = Date.now();
    if (lastTap && lastTap.el === press.el && now - lastTap.t < 350) {
      lastTap = null;
      dtEdit = press.el;
    } else {
      lastTap = { el: press.el, t: now };
    }
  } else {
    lastTap = null;
  }
  press = null;
});

/* ---------- Tiradores de tamaño ---------- */
const HANDLES = { nw: [0, 0], n: [50, 0], ne: [100, 0], e: [100, 50], se: [100, 100], s: [50, 100], sw: [0, 100], w: [0, 50] };
const CURSORS = { nw: 'nwse-resize', se: 'nwse-resize', ne: 'nesw-resize', sw: 'nesw-resize', n: 'ns-resize', s: 'ns-resize', e: 'ew-resize', w: 'ew-resize' };

function ensureBox(piece) {
  let box = piece.querySelector('.rs-box');
  if (!box) {
    box = document.createElement('div');
    box.className = 'rs-box';
    Object.entries(HANDLES).forEach(([h, [px, py]]) => {
      const d = document.createElement('div');
      d.className = 'rs-h';
      d.dataset.h = h;
      d.style.left = px + '%';
      d.style.top = py + '%';
      d.style.cursor = CURSORS[h];
      box.appendChild(d);
    });
    const mv = document.createElement('div');
    mv.className = 'rs-mv';
    mv.title = 'Mover';
    mv.setAttribute('aria-label', 'Mover elemento');
    mv.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg>';
    box.appendChild(mv);
    piece.appendChild(box);
  }
  return box;
}

/* Muestra la caja con tiradores sobre el elemento seleccionado (si no está bloqueado) */
function updateBox() {
  document.querySelectorAll('.piece').forEach(piece => {
    const box = ensureBox(piece);
    piece.classList.toggle('has-sel', !!(selected && piece.contains(selected) && !isLocked(selected)));
    const show = selected && piece.contains(selected) && !isLocked(selected);
    box.classList.toggle('is-photo', !!(show && selected.classList.contains('photo')));   // las fotos muestran también los tiradores de los lados
    box.classList.toggle('on', !!show);
    if (!show) return;
    const r = rectIn(selected);
    Object.assign(box.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
    const mv = box.querySelector('.rs-mv');
    if (mv) {
      const cs = getComputedStyle(mv), inv = parseFloat(piece.style.getPropertyValue('--inv')) || 1;
      const need = (parseFloat(cs.getPropertyValue('--mv')) + parseFloat(cs.getPropertyValue('--gap'))) * inv;
      const fitsTop = r.y - need >= 0, fitsBottom = r.y + r.h + need <= piece.offsetHeight;
      mv.classList.toggle('below', !fitsTop && fitsBottom);
      mv.classList.toggle('inside', !fitsTop && !fitsBottom);
    }
  });
}

document.addEventListener('pointerdown', e => {
  const h = e.target.closest('.rs-h');
  if (!h || !selected || isLocked(selected)) return;
  e.stopPropagation();
  e.preventDefault();
  const el = selected;
  if (getComputedStyle(el).display === 'inline') el.style.display = 'block';
  const hd = h.dataset.h;
  resizeState = {
    el, h: hd,
    s: scaleOf(el.closest('.piece')),
    x: e.clientX, y: e.clientY,
    w0: el.offsetWidth, h0: el.offsetHeight,
    dx0: parseFloat(el.dataset.dx) || 0,
    dy0: parseFloat(el.dataset.dy) || 0,
    ratio: el.offsetWidth / (el.offsetHeight || 1),
    keep: hd.length === 2 || e.shiftKey
  };
}, true);

/* Ícono de mover: mantener apretado y arrastrar mueve el elemento seleccionado */
document.addEventListener('pointerdown', e => {
  const m = e.target.closest('.rs-mv');
  if (!m || !selected || isLocked(selected) || gesture) return;
  e.stopPropagation();
  e.preventDefault();
  startDrag(selected, e);
}, true);

/* ---------- Ajuste de imagen dentro del marco ---------- */
/* Encuadre de la imagen dentro del marco. La imagen se dibuja con background-size / background-position
   (no moviendo el div con transform): así el desplazamiento nunca destapa el fondo del marco y, con el
   límite de clampImg, la imagen siempre cubre toda el área aunque cambie el tamaño del marco. */
function applyImg(photo) {
  clampImg(photo);
  const img = photo.querySelector('.ph-img');
  if (!img) return;
  const z = Math.max(1, numOr(photo.dataset.imgZ, 1));
  const x = numOr(photo.dataset.imgX), y = numOr(photo.dataset.imgY);
  const iw = +img.dataset.iw, ih = +img.dataset.ih;
  const W = photo.clientWidth, H = photo.clientHeight;
  if (iw && ih && W && H) {
    const k = Math.max(W / iw, H / ih), dw = iw * k * z, dh = ih * k * z;
    img.style.transform = '';
    img.style.backgroundSize = r2(dw) + 'px ' + r2(dh) + 'px';
    img.style.backgroundPosition = r2((W - dw) / 2 + x) + 'px ' + r2((H - dh) / 2 + y) + 'px';
  } else {
    // sin medidas (marco oculto o imagen sin tamaño conocido): se usa "cubrir" y un transform como respaldo
    img.style.backgroundSize = '';
    img.style.backgroundPosition = '';
    img.style.transform = (z !== 1 || x || y) ? `translate(${x}px, ${y}px) scale(${z})` : '';
  }
}

/* Recalcula el encuadre de todas las fotos (al mostrar una pieza oculta, cambiar la escala, etc.) */
function refreshPhotos() { document.querySelectorAll('.photo').forEach(applyImg); }

/* Modo imagen: arrastrar dentro de la foto mueve la imagen, no el marco */
document.addEventListener('pointerdown', e => {
  if (!imageMode) return;
  const photo = e.target.closest('.photo');
  if (!photo || !photo.closest('.piece') || isLocked(photo) || e.target.closest('.rs-box')) return;
  e.stopPropagation();
  e.preventDefault();
  select(photo);
  panState = {
    el: photo,
    s: scaleOf(photo.closest('.piece')),
    x: e.clientX, y: e.clientY,
    bx: parseFloat(photo.dataset.imgX) || 0,
    by: parseFloat(photo.dataset.imgY) || 0
  };
}, true);

/* ---------- Movimiento: tiradores, encuadre de imagen y caja ---------- */
document.addEventListener('pointermove', e => {
  if (resizeState) {
    const st = resizeState;
    const dX = (e.clientX - st.x) / st.s;
    const dY = (e.clientY - st.y) / st.s;
    const hd = st.h;
    let w = st.w0, h = st.h0;
    if (hd.includes('e')) w = st.w0 + dX;
    if (hd.includes('w')) w = st.w0 - dX;
    if (hd.includes('s')) h = st.h0 + dY;
    if (hd.includes('n')) h = st.h0 - dY;
    if (st.keep && (hd.length === 2 || hd === 'e' || hd === 'w')) h = w / st.ratio;
    w = Math.max(20, Math.round(w));
    h = Math.max(20, Math.round(h));
    st.el.style.width = w + 'px';
    st.el.style.height = h + 'px';
    // Al tirar desde el lado izquierdo o superior, el borde opuesto queda fijo
    if (hd.includes('w')) st.el.dataset.dx = st.dx0 + (st.w0 - w);
    if (hd.includes('n')) st.el.dataset.dy = st.dy0 + (st.h0 - h);
    applyT(st.el);
    if (st.el.classList.contains('photo')) applyImg(st.el);   // el marco cambia y la foto se recorta/amplía para seguir cubriéndolo
    updateBox();
    return;
  }
  if (panState) {
    const p = panState;
    p.el.dataset.imgX = p.bx + (e.clientX - p.x) / p.s;
    p.el.dataset.imgY = p.by + (e.clientY - p.y) / p.s;
    applyImg(p.el);
    return;
  }
  if (dragState) updateBox();
});

document.addEventListener('pointerup', () => {
  if (resizeState) { resizeState = null; refreshAll(); }
  if (panState) { panState = null; refreshAll(); }
});

/* ---------- Menú contextual ---------- */
const ctxMenu = document.createElement('div');
ctxMenu.id = 'ctx-menu';
ctxMenu.className = 'ctx-menu';
document.body.appendChild(ctxMenu);

function openCtx(el, x, y) {
  select(el);
  const lk = isLocked(el);
  const sub = !!el.parentElement.closest('.drag'); // sticker dentro de su foto
  ctxMenu.innerHTML = `
    <button data-c="dup" ${sub ? 'disabled' : ''}>Duplicar</button>
    <button data-c="lock">${lk ? 'Desbloquear' : 'Bloquear'}</button>
    <hr>
    <button data-c="front" ${sub ? 'disabled' : ''}>Traer al frente</button>
    <button data-c="up" ${sub ? 'disabled' : ''}>Subir un nivel</button>
    <button data-c="down" ${sub ? 'disabled' : ''}>Bajar un nivel</button>
    <button data-c="back" ${sub ? 'disabled' : ''}>Enviar al fondo</button>
    <hr>
    <button data-c="del" ${lk ? 'disabled' : ''}>Eliminar</button>`;
  ctxMenu.style.left = Math.min(x, window.innerWidth - 200) + 'px';
  ctxMenu.style.top = Math.min(y, window.innerHeight - 280) + 'px';
  ctxMenu.classList.add('open');
}

document.addEventListener('contextmenu', e => {
  if (!e.target.closest('.piece')) return;
  e.preventDefault();
  if (lastPtr === 'touch') return;   // en táctil se usa la barra de acciones inferior
  const el = e.target.closest('.drag');
  if (el && !e.target.closest('.rs-box')) openCtx(el, e.clientX, e.clientY);
  else ctxMenu.classList.remove('open');
});

ctxMenu.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || !selected) return;
  const el = selected;
  const c = b.dataset.c;
  if (c === 'dup') duplicateEl(el);
  if (c === 'lock') el.dataset.locked = isLocked(el) ? '0' : '1';
  if (c === 'front') orderOp(el, 'front');
  if (c === 'up') orderOp(el, 'up');
  if (c === 'down') orderOp(el, 'down');
  if (c === 'back') orderOp(el, 'back');
  if (c === 'del') deleteEl(el);
  ctxMenu.classList.remove('open');
  refreshAll();
});

document.addEventListener('pointerdown', e => {
  if (!e.target.closest('#ctx-menu')) ctxMenu.classList.remove('open');
});
window.addEventListener('scroll', () => ctxMenu.classList.remove('open'), true);

/* ---------- Teclado: Supr, flechas, Ctrl+D, Esc ---------- */
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.closest && t.closest('input, textarea, select, [contenteditable="true"]')) return;
  const mod = e.ctrlKey || e.metaKey;
  const k = (e.key || '').toLowerCase();
  if (mod && (k === 'z' || k === 'y')) {
    e.preventDefault();
    const p = activePiece();
    if (p) { if (k === 'y' || e.shiftKey) redo(p); else undo(p); }
    return;
  }
  if (!k.startsWith('arrow')) flushAll();   // cada acción discreta queda como su propia entrada
  if (e.key === 'Escape') {
    ctxMenu.classList.remove('open');
    if (selected) select(null);
    return;
  }
  if (!selected || isLocked(selected)) return;
  const step = e.shiftKey ? 10 : 1;
  if (e.key === 'Delete' || e.key === 'Backspace') {
    e.preventDefault();
    deleteEl(selected);
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault();
    const d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
    moveBy(selected, d[0], d[1]);
    refreshAll();
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') {
    e.preventDefault();
    duplicateEl(selected);
    refreshAll();
  }
});

/* ========== MÓVIL: toques, pellizco, hoja inferior, avisos ========== */

/* Toque corto (casi sin movimiento) selecciona; si el navegador toma el gesto (scroll) se cancela */
document.addEventListener('pointerup', e => {
  if (tapC && e.pointerId === tapC.id) {
    if (Math.hypot(e.clientX - tapC.x, e.clientY - tapC.y) < 10) select(tapC.el);
    tapC = null;
  }
});

/* Pellizco con dos dedos (con un elemento seleccionado): zoom de la vista sobre el punto pellizcado.
   Mover los dos dedos a la vez desplaza la vista. Ya no escala ni gira el elemento. */
const VZ_MAX = 4;
function viewApply(piece, z, mx, my, u, v) {   // (mx,my) = punto en pantalla; (u,v) = punto de la pieza que debe quedar bajo él
  const stage = piece.closest('.stage'), r = stage.getBoundingClientRect();
  z = Math.min(VZ_MAX, Math.max(1, z));
  if (z < 1.04) z = 1;
  const s = (scaleOf(piece) / (parseFloat(piece.dataset.vz) || 1)) * z, ml = Math.max(0, (stage.clientWidth - 1080 * s) / 2);
  piece.dataset.vz = z;
  piece.dataset.vx = mx - u * s - (r.left + stage.clientLeft) - ml;
  piece.dataset.vy = my - v * s - (r.top + stage.clientTop);
  fitPreviews();
  updateBox();
}
document.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'touch') return;
  const stage = e.target.closest && e.target.closest('.stage'), piece = stage && stage.querySelector('.piece');
  if (!piece || piece.classList.contains('is-editing')) return;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (touches.size === 2) {
    dragState = null; resizeState = null; panState = null; tapC = null;
    const [a, b] = [...touches.values()], pr = piece.getBoundingClientRect(), s = scaleOf(piece);
    gesture = { piece, d0: Math.hypot(b.x - a.x, b.y - a.y) || 1, z0: parseFloat(piece.dataset.vz) || 1,
                u: ((a.x + b.x) / 2 - pr.left) / s, v: ((a.y + b.y) / 2 - pr.top) / s };
    e.stopPropagation();
  }
}, true);

document.addEventListener('pointermove', e => {
  if (touches.has(e.pointerId)) touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!gesture || touches.size < 2) return;
  const g = gesture, [a, b] = [...touches.values()];
  viewApply(g.piece, g.z0 * Math.hypot(b.x - a.x, b.y - a.y) / g.d0, (a.x + b.x) / 2, (a.y + b.y) / 2, g.u, g.v);
});

/* Con dos dedos sobre la pieza el navegador no debe hacer scroll ni zoom de página */
document.addEventListener('touchmove', e => {
  if ((gesture || e.touches.length >= 2) && e.cancelable && e.target.closest && e.target.closest('.stage')) e.preventDefault();
}, { passive: false });

/* Escritorio: Shift + rueda = zoom de la vista sobre el cursor */
document.addEventListener('wheel', e => {
  if (!e.shiftKey) return;
  const stage = e.target.closest && e.target.closest('.stage');
  const piece = stage && stage.querySelector('.piece');
  if (!piece || piece.classList.contains('is-editing')) return;
  e.preventDefault();
  const pr = piece.getBoundingClientRect(), s = scaleOf(piece);
  viewApply(piece, (parseFloat(piece.dataset.vz) || 1) * Math.exp(-(e.deltaY || e.deltaX) * 0.0015),
            e.clientX, e.clientY, (e.clientX - pr.left) / s, (e.clientY - pr.top) / s);
}, { passive: false });

function endTouch(e) {
  if (!touches.delete(e.pointerId)) return;
  if (gesture && touches.size < 2) { gesture = null; refreshAll(); }
}
document.addEventListener('pointerup', endTouch);
document.addEventListener('pointercancel', e => {
  endTouch(e);
  if (tapC && e.pointerId === tapC.id) tapC = null;
  if (dragState || resizeState || panState) { clearAllGuides(); dragState = null; resizeState = null; panState = null; refreshAll(); }
});

/* Texto o valor editable según el elemento seleccionado (el sticker edita su valor) */
function editTargetOf(el) {
  if (!el) return null;
  if (el.dataset.f) return el;
  if (el.classList.contains('pc-sticker')) return el.querySelector('b[data-f]');
  return null;
}

/* Cambiar la foto de un marco puntual (sirve también para copias duplicadas) */
function pickPhoto(photo) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.addEventListener('change', () => {
    const f = inp.files && inp.files[0];
    if (f) loadImageInto(photo, f);
  });
  inp.click();
}

/* Hoja inferior: visible en pantallas angostas cuando hay selección o se abrió con "Ajustes" */
function updateSheet() {
  const narrow = isNarrow();
  let on = false, open = false;
  document.querySelectorAll('.card').forEach(card => {
    const side = card.querySelector('.side');
    const piece = card.querySelector('.piece');
    if (!side || !piece) return;
    const has = !!selected && piece.contains(selected);
    const show = narrow && card.classList.contains('current') && (has || card.dataset.sheet === '1');
    const exp = show && card.dataset.open === '1';
    side.classList.toggle('sheet-on', show);
    side.classList.toggle('sheet-open', exp);
    on = on || show;
    open = open || exp;
  });
  document.body.classList.toggle('has-sheet', on);
  document.body.classList.toggle('sheet-expanded', open);
}

/* Cambio de formato (móvil muestra una pieza a la vez) */
const RATIO_H = { '4x5': 1350, '3x4': 1440, '1x1': 1080, '9x16': 1920 };
const RATIO_BY_H = { 1350: '4x5', 1440: '3x4', 1080: '1x1', 1920: '9x16' };
const PAGES = [];                 // páginas: { uid, stack, idx }; la actual usa el historial vivo (HIST)
let CURPG = null, pageSeq = 1;
const RATIO_META = { '4x5': ['Feed Portrait', '4:5 · 1080 × 1350 px · Post clásico'], '3x4': ['Feed Tall', '3:4 · 1080 × 1440 px · Máximo espacio feed'],
                     '1x1': ['Feed Square', '1:1 · 1080 × 1080 px · Cuadrado'], '9x16': ['Stories / Reels', '9:16 · 1080 × 1920 px · Zona segura central'] };
const RATIO_GUIDE = { '4x5': 'left:80px;top:80px;right:80px;bottom:80px', '3x4': 'left:80px;top:80px;right:80px;bottom:80px',
                      '1x1': 'left:64px;top:64px;right:64px;bottom:64px', '9x16': 'left:80px;top:250px;right:80px;bottom:340px' };
const ratioOf = piece => piece.id.replace('post-', '');

function ratioInner(el, fmt) {
  el.querySelectorAll('.photo-ph span').forEach(sp => { if (/^Foto \d+:\d+$/.test(sp.textContent)) sp.textContent = 'Foto ' + fmt.replace('x', ':'); });
  const g = el.querySelector('.guide');
  if (g) g.style.cssText = RATIO_GUIDE[fmt];
}

/* Solo cambia el DOM de la proporción (clase, id, textos, guía); no mueve elementos. También lo usa Deshacer/Rehacer. */
function applyRatioDom(piece, fmt) {
  const card = piece.closest('.card');
  Object.keys(RATIO_H).forEach(k => piece.classList.remove('p-' + k));
  piece.classList.add('p-' + fmt);
  piece.id = 'post-' + fmt;
  card.dataset.fmt = fmt;
  card.querySelectorAll('[data-jpg]').forEach(b => { b.dataset.jpg = piece.id; });
  card.querySelectorAll('[data-svg]').forEach(b => { b.dataset.svg = piece.id; });
  const m = RATIO_META[fmt], tag = card.querySelector('.card-meta .tag'), txt = card.querySelector('.meta-txt');
  if (tag) tag.textContent = m[0];
  if (txt) txt.textContent = m[1];
  ratioInner(piece, fmt);
  document.querySelectorAll('.fmt-bar button, .ratio-list button[data-rt]').forEach(b => {
    const on = (b.dataset.fmt || b.dataset.rt) === fmt;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', on);
  });
}

/* Elementos absolutos: los de la mitad inferior conservan su distancia al borde inferior; los de arriba no se mueven.
   El ancla se recuerda (mientras el elemento no se toque) para que volver a la proporción anterior los deje donde estaban. */
function shiftForHeight(piece, H, d) {
  piece.querySelectorAll('.drag').forEach(el => {
    if (el.parentElement !== piece || el.style.position !== 'absolute') return;
    const top = parseFloat(el.style.top);
    if (!Number.isFinite(top)) return;
    const c = top + numOr(el.dataset.dy) + el.offsetHeight / 2, st = el.dataset.anc;
    const anc = st && Math.abs(parseFloat(st.slice(2)) - top) < 0.6 ? st[0] : (c > H / 2 ? 'b' : 't');
    const nt = Math.round((anc === 'b' ? top + d : top) * 100) / 100;
    el.style.top = nt + 'px';
    el.dataset.anc = anc + ':' + nt;
  });
}

function setRatio(fmt, o = {}) {
  const piece = document.querySelector('.piece'), cur = ratioOf(piece);
  if (!RATIO_H[fmt] || fmt === cur) return;
  select(null);
  if (o.shift !== false) {
    const d = RATIO_H[fmt] - RATIO_H[cur];
    shiftForHeight(piece, RATIO_H[cur], d);
    PAGES.forEach(pg => {                                   // el resto de páginas se reubica igual (fuera de pantalla)
      if (pg === CURPG || !pg.stack) return;
      const snap = pg.stack[pg.idx], host = document.createElement('div');
      host.className = 'piece p-' + cur;
      host.style.cssText = 'position:fixed;left:-20000px;top:0;visibility:hidden';
      host.innerHTML = snap.html;
      document.body.appendChild(host);
      shiftForHeight(host, RATIO_H[cur], d);
      ratioInner(host, fmt);
      pg.stack = [{ html: host.innerHTML, bg: snap.bg, ratio: fmt }];
      pg.idx = 0;
      host.remove();
    });
  }
  applyRatioDom(piece, fmt);
  const h = HIST.get(piece);
  if (h) {                                                  // cambiar de proporción reinicia el historial de deshacer
    clearTimeout(h.timer); h.timer = null; h.obs.takeRecords();
    h.stack = [snapOf(piece)]; h.idx = 0;
    if (CURPG) { CURPG.stack = h.stack; CURPG.idx = 0; }
  }
  fitPreviews();
  refreshAll();
  if (typeof updateHistUI === 'function') updateHistUI();
  if (typeof renderPages === 'function') renderPages();
  if (o.shift !== false) markDirty();                       // el proyecto guarda su proporción (takeRecords() de arriba descarta el aviso del observador)
}

function setCurrent(fmt) {
  const c = document.querySelector('.card');
  c.classList.add('current');
  c.dataset.sheet = '0';
  c.dataset.open = '0';
  if (fmt && fmt !== c.dataset.fmt) setRatio(fmt);
  else { select(null); fitPreviews(); }
}

/* Aviso con acción (por ejemplo, Deshacer) */
let toastTimer = null;
function toast(msg, label, action) {
  const t = document.getElementById('toast');
  t.innerHTML = '';
  const sp = document.createElement('span');
  sp.textContent = msg;
  t.appendChild(sp);
  if (label) {
    const b = document.createElement('button');
    b.textContent = label;
    b.addEventListener('click', () => { t.classList.remove('on'); action(); });
    t.appendChild(b);
  }
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 6000);
}

function setBusy(on) { document.getElementById('busy').classList.toggle('on', on); }

/* Resultado del JPG en táctil: vista previa + compartir (un toque nuevo, así no caduca el gesto) */
const resultBox = document.getElementById('result');
let resultUrl = null, resultBlob = null, resultName = '', resultFile = null;

const RESULT_HINT = 'Si tu navegador lo permite, mantené presionada la imagen para guardarla. También podés usar los botones.';
function showResult(blob, name, note) {
  if (resultUrl) URL.revokeObjectURL(resultUrl);
  resultBlob = blob;
  resultName = name;
  resultUrl = URL.createObjectURL(blob);
  resultBox.querySelector('img').src = resultUrl;
  resultBox.querySelector('.hint').textContent = note || RESULT_HINT;
  let canShare = false;
  try {
    resultFile = new File([blob], name, { type: 'image/jpeg' });
    canShare = !!(navigator.canShare && navigator.canShare({ files: [resultFile] }));
  } catch (_) { resultFile = null; }
  resultBox.querySelector('[data-r="share"]').hidden = !canShare;
  resultBox.classList.add('on');
}

function closeResult() {
  resultBox.classList.remove('on');
  if (resultUrl) { URL.revokeObjectURL(resultUrl); resultUrl = null; }
}

resultBox.addEventListener('click', e => {
  if (e.target === resultBox) return closeResult();
  const b = e.target.closest('[data-r]');
  if (!b) return;
  if (b.dataset.r === 'close') closeResult();
  if (b.dataset.r === 'download' && resultBlob) download(resultBlob, resultName);
  if (b.dataset.r === 'share' && resultFile) navigator.share({ files: [resultFile], title: resultName }).catch(() => {});
});

/* ========== GUÍAS DE ALINEACIÓN E IMÁN ========== */
/* Al empezar a arrastrar se guardan las cajas de todo lo demás (otros elementos, la pieza y los márgenes
   seguros), todas en coordenadas de la pieza. En cada movimiento se comparan las 3 líneas verticales
   (borde izquierdo, centro, borde derecho) y las 3 horizontales del elemento arrastrado contra las de
   cada una de esas cajas. Si una pareja queda a menos de SNAP px de pantalla, se corrige la posición
   para que coincidan y se dibuja la línea. Sirve para bordes y centros, estén pegados o lejos. */
const SNAP_FINE = 6, SNAP_TOUCH = 10;      // distancia (px de pantalla) a la que el elemento se "pega"
const snapOn = () => { const c = document.getElementById('snap-on'); return !c || c.checked; };

function snapTargets(el) {
  const piece = el.closest('.piece');
  const W = piece.offsetWidth, H = piece.offsetHeight;
  const t = [{ x: 0, y: 0, w: W, h: H }];                              // la pieza: bordes y centro
  const g = piece.querySelector('.guide');                             // márgenes seguros: solo sus bordes
  if (g) {
    const l = parseFloat(g.style.left) || 0, tp = parseFloat(g.style.top) || 0;
    const r = parseFloat(g.style.right) || 0, b = parseFloat(g.style.bottom) || 0;
    t.push({ x: l, y: tp, w: W - l - r, h: H - tp - b, edges: true });
  }
  piece.querySelectorAll('.drag').forEach(o => {
    if (o === el || el.contains(o)) return;                            // ni él mismo ni lo que viaja con él
    const r = rectIn(o);
    if (r.w > 1 && r.h > 1) t.push(r);
  });
  return t;
}

function snapRect(m, targets, T) {
  const lines = (r, edgesOnly) => ({
    x: edgesOnly ? [r.x, r.x + r.w] : [r.x, r.x + r.w / 2, r.x + r.w],
    y: edgesOnly ? [r.y, r.y + r.h] : [r.y, r.y + r.h / 2, r.y + r.h]
  });
  const me = lines(m);
  let bx = null, by = null;
  for (const t of targets) {
    const tl = lines(t, t.edges);
    for (const a of me.x) for (const b of tl.x) { const d = b - a; if (Math.abs(d) <= T && (bx === null || Math.abs(d) < Math.abs(bx))) bx = d; }
    for (const a of me.y) for (const b of tl.y) { const d = b - a; if (Math.abs(d) <= T && (by === null || Math.abs(d) < Math.abs(by))) by = d; }
  }
  const sx = bx || 0, sy = by || 0;
  const r = { x: m.x + sx, y: m.y + sy, w: m.w, h: m.h };
  const mr = lines(r);
  const gx = new Map(), gy = new Map();
  const add = (map, pos, from, to) => {
    const k = Math.round(pos * 2) / 2;
    const o = map.get(k);
    if (o) { o.from = Math.min(o.from, from); o.to = Math.max(o.to, to); } else map.set(k, { pos: k, from, to });
  };
  for (const t of targets) {
    const tl = lines(t, t.edges);
    for (const a of mr.x) for (const b of tl.x) if (Math.abs(a - b) < 0.6) add(gx, b, Math.min(r.y, t.y), Math.max(r.y + r.h, t.y + t.h));
    for (const a of mr.y) for (const b of tl.y) if (Math.abs(a - b) < 0.6) add(gy, b, Math.min(r.x, t.x), Math.max(r.x + r.w, t.x + t.w));
  }
  return { sx, sy, guides: { x: [...gx.values()], y: [...gy.values()] } };
}

function drawGuides(piece, g) {
  let L = piece.querySelector('.snap-layer');
  if (!L) {
    L = document.createElement('div');
    L.className = 'snap-layer';
    piece.appendChild(L);
  }
  const n = v => Math.round(v * 10) / 10;
  L.innerHTML =
    g.x.map(l => `<div class="sg v" style="left:${n(l.pos)}px;top:${n(l.from)}px;height:${n(l.to - l.from)}px"></div>`).join('') +
    g.y.map(l => `<div class="sg h" style="top:${n(l.pos)}px;left:${n(l.from)}px;width:${n(l.to - l.from)}px"></div>`).join('');
}

function clearGuides(piece) {
  const L = piece && piece.querySelector('.snap-layer');
  if (L && L.firstChild) L.innerHTML = '';
}
function clearAllGuides() { document.querySelectorAll('.piece').forEach(clearGuides); }

/* ========== PROYECTO: modelo de datos, esquema JSON y guardado ========== */
/* Un proyecto = el diseño completo (las 4 piezas, sus elementos, las imágenes que usan y la biblioteca
   de decorativos propios). PROJECT_SCHEMA es la fuente de verdad del formato: valida todo lo que se
   abre o se importa, y también lo que se guarda. El guardado pasa por Store, una capa mínima sobre
   localStorage con forma de colección ("projects"), para poder cambiarla por una base de datos sin
   tocar el resto. */
const PROJECT_SCHEMA = /*SCHEMA_START*/{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:instagram-post-editor:schema:project:v1",

        else if (s.additionalProperties === false) bad('propiedad no permitida "' + k + '"');
        else if (s.additionalProperties && typeof s.additionalProperties === 'object') {
          if (!check(d[k], s.additionalProperties, path + '/' + k, errs)) ok = false;
        }
      });
    }
    const branches = s.oneOf || s.anyOf;
    if (branches) {
      const res = branches.map(b => { const e = []; return { ok: check(d, b, path, e), e, b }; });
      const n = res.filter(r => r.ok).length;
      const passes = s.oneOf ? n === 1 : n >= 1;
      if (!passes) {
        ok = false;
        if (n > 1) errs.push((path || '/') + ': coincide con más de una variante');
        else {
          // si hay un discriminador (type / mode) que coincide, se informan los errores de esa variante
          const disc = res.find(r => {
            const p = (r.b.$ref ? resolve(r.b.$ref) : r.b).properties || {};
            return ['type', 'mode'].some(k => p[k] && 'const' in p[k] && d && d[k] === p[k].const);
          });
          if (disc) errs.push(...disc.e); else errs.push((path || '/') + ': no coincide con ninguna variante permitida');
        }
      }
    }
    return ok;
  }
  const errors = [];
  check(data, schema, '', errors);
  return errors;
}
/*VALIDATOR_END*/

const SCHEMA_VERSION = 1;
const FORMAT_INFO = { '4x5': 'feed-portrait', '3x4': 'feed-tall', '1x1': 'feed-square', '9x16': 'story' };
const TEMPLATE_HTML = {};            // id de pieza → HTML original de la plantilla
const IMG_META = {};                 // id de imagen → { w, h, mime }

let lastSig = '', saveTimer = null, BOOTED = false;

const rid = (n = 10) => { const a = new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(b => (b % 36).toString(36)).join(''); };
const newProjectId = () => 'prj_' + rid(12);
const newImgId = () => 'img_' + rid(10);
const newLibId = () => 'lib_' + rid(8);
const nowISO = () => new Date().toISOString();
const r2 = v => Math.round(v * 100) / 100;
const numOr = (v, d = 0) => { const n = parseFloat(v); return Number.isFinite(n) ? n : d; };
const clampNum = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const slug = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
  .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'diseno';

const Store = {
  P: 'igp:',
  ok() { try { const k = this.P + 'probe'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch (_) { return false; } },
  index() { try { const a = JSON.parse(localStorage.getItem(this.P + 'index') || '[]'); return Array.isArray(a) ? a : []; } catch (_) { return []; } },
  list() { return this.index().slice().sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt))); },
  get(id) { const raw = localStorage.getItem(this.P + 'project:' + id); return raw ? JSON.parse(raw) : null; },
  put(p) {
    const raw = JSON.stringify(p);
    localStorage.setItem(this.P + 'project:' + p.id, raw);
    const idx = this.index().filter(x => x.id !== p.id);
    idx.push({ id: p.id, name: p.name, updatedAt: p.updatedAt, bytes: raw.length });
    localStorage.setItem(this.P + 'index', JSON.stringify(idx));

  },
  remove(id) {
    localStorage.removeItem(this.P + 'project:' + id);
    localStorage.setItem(this.P + 'index', JSON.stringify(this.index().filter(x => x.id !== id)));
    if (this.current() === id) localStorage.removeItem(this.P + 'current');
  },
  current() { try { return localStorage.getItem(this.P + 'current'); } catch (_) { return null; } },
  setCurrent(id) { try { localStorage.setItem(this.P + 'current', id); } catch (_) { /* sin almacenamiento */ } }
};

function migrateProject(p) {
  // Punto de enganche para versiones futuras: aquí se convertiría un proyecto de schemaVersion N a N+1.
  return p;
}

function checkIntegrity(p) {
  const errs = [];
  if (new Set(p.pieces.map(x => x.id)).size !== p.pieces.length) errs.push('hay piezas repetidas');
  p.pieces.forEach(pc => {
    const ids = new Set(), photos = new Set();
    pc.elements.forEach(e => {
      if (ids.has(e.id)) errs.push(`pieza ${pc.id}: id de elemento repetido "${e.id}"`);
      ids.add(e.id);
      if (e.type === 'photo') photos.add(e.id);
    });
    pc.elements.forEach(e => {
      if (e.type === 'sticker' && e.layout.mode === 'attached' && !photos.has(e.layout.parentId))
        errs.push(`pieza ${pc.id}: el sticker "${e.id}" apunta a una foto que no existe`);
      if (e.type === 'photo' && e.image && !p.images[e.image.ref])
        errs.push(`pieza ${pc.id}: la foto "${e.id}" usa una imagen que no está en "images"`);
    });
  });
  return errs;
}

function validateProject(p) {
  const errs = schemaValidate(p, PROJECT_SCHEMA);
  return errs.length ? errs : checkIntegrity(p);
}

/* ---------- Estilo de texto: alineación, interlineado e interletrado ---------- */
const JC = { left: 'flex-start', center: 'center', right: 'flex-end', justify: 'flex-start' };

function setAlign(el, a) {
  el.style.textAlign = a || '';
  el.style.justifyContent = a ? JC[a] : '';   // las cajas flex (etiqueta, botón) alinean con justify-content
}

function applyTextStyle(el, st) {
  st = st || {};
  const s = el.style;
  s.fontSize = st.fontSize != null ? st.fontSize + 'px' : '';
  s.color = st.color || '';
  s.background = st.background || '';
  s.lineHeight = st.lineHeight != null ? String(st.lineHeight) : '';
  s.letterSpacing = st.letterSpacing != null ? st.letterSpacing + 'em' : '';
  s.fontFamily = st.fontFamily ? IGFont.stack(st.fontFamily) : '';
  if (st.fontFamily) IGFont.ensure(st.fontFamily).then(() => { try { fitPreviews(); } catch (_) {} });
  s.fontWeight = st.fontWeight != null ? String(st.fontWeight) : '';
  s.fontStyle = st.fontStyle || '';
  s.textDecoration = st.textDecoration || '';
  s.textTransform = st.textTransform || '';
  setAlign(el, st.textAlign);
  applyFx(el, st);
}

function bgOf(el) {
  const s = el.style;
  return s.backgroundImage && s.backgroundImage !== 'none' ? s.background : s.backgroundColor;
}

function readTextStyle(el) {
  const s = el.style, st = {};
  const fs = parseFloat(s.fontSize);
  if (s.fontSize && Number.isFinite(fs)) st.fontSize = r2(fs);
  if (s.color) st.color = s.color;
  const bg = bgOf(el);
  if (bg) st.background = bg;
  if (s.textAlign) st.textAlign = s.textAlign;
  if (s.lineHeight && /^[\d.]+$/.test(s.lineHeight)) st.lineHeight = r2(parseFloat(s.lineHeight));
  if (/em$/.test(s.letterSpacing)) st.letterSpacing = Math.round(parseFloat(s.letterSpacing) * 1000) / 1000;
  const ff = (s.fontFamily || '').split(',')[0].replace(/["']/g, '').trim();
  if (/^[A-Za-z0-9 ]{1,60}$/.test(ff)) st.fontFamily = ff;
  if (/^\d+$/.test(s.fontWeight)) st.fontWeight = Math.min(900, Math.max(100, +s.fontWeight));
  if (s.fontStyle === 'italic') st.fontStyle = 'italic';
  const dl = (/underline/.test(s.textDecoration) ? 'underline' : '') + (/line-through/.test(s.textDecoration) ? (/underline/.test(s.textDecoration) ? ' ' : '') + 'line-through' : '');
  if (dl) st.textDecoration = dl;
  if (s.textTransform && s.textTransform !== 'none') st.textTransform = s.textTransform;
  readFx(el, st, !!el.dataset.f);
  return st;
}

/* ---------- Efectos de caja: trazo, redondeado, sombra, espaciado interno (y sombra de texto) ----------
   Se guardan solo los que el usuario cambió (estilo en línea); lo demás sigue siendo el CSS de la marca. */
function parseShadow(v) {                       // "rgb(0, 0, 0) 3px 3px 6px 0px" → { x, y, b, c } (una sola sombra, sin inset)
  if (!v || v === 'none' || /inset/.test(v)) return null;
  const cm = v.match(/rgba?\([^)]*\)|#[0-9a-f]{3,8}\b/gi);
  if (!cm || cm.length !== 1) return null;
  const n = v.replace(cm[0], ' ').match(/-?[\d.]+/g) || [];
  if (n.length < 2) return null;
  return { x: +n[0], y: +n[1], b: n[2] != null ? +n[2] : 0, c: cm[0] };
}
const fmtShadow = o => r2(o.x) + 'px ' + r2(o.y) + 'px ' + r2(Math.max(0, o.b)) + 'px ' + o.c;

function readFx(el, st, withText) {
  const s = el.style;
  if (s.borderTopWidth !== '') { const w = parseFloat(s.borderTopWidth); if (Number.isFinite(w)) st.borderWidth = clampNum(r2(w), 0, 100); }
  if (s.borderTopColor) st.borderColor = s.borderTopColor;
  if (/px$/.test(s.borderTopLeftRadius)) st.borderRadius = clampNum(r2(parseFloat(s.borderTopLeftRadius)), 0, 1000);
  if (s.boxShadow === 'none') st.boxShadow = 'none';
  else { const p = parseShadow(s.boxShadow); if (p) st.boxShadow = fmtShadow(p); }
  if (/px$/.test(s.paddingTop)) st.padding = clampNum(r2(parseFloat(s.paddingTop)), 0, 400);
  if (withText) {
    if (s.textShadow === 'none') st.textShadow = 'none';
    else { const p = parseShadow(s.textShadow); if (p) st.textShadow = fmtShadow(p); }
  }
  return st;
}

function applyFx(el, st) {
  st = st || {};
  const s = el.style;
  s.borderStyle = st.borderWidth != null ? 'solid' : '';
  s.borderWidth = st.borderWidth != null ? st.borderWidth + 'px' : '';
  s.borderColor = st.borderColor || '';
  s.borderRadius = st.borderRadius != null ? st.borderRadius + 'px' : '';
  s.boxShadow = st.boxShadow || '';
  s.padding = st.padding != null ? st.padding + 'px' : '';
  s.textShadow = st.textShadow || '';
}

/* ---------- Fotos: imagen, encuadre y ajuste al marco ---------- */
function bindPhotoImage(photo, id) {
  const im = photo.querySelector('.ph-img');
  const m = IMG_META[id] || {};
  im.dataset.srcId = id;
  if (m.w) { im.dataset.iw = m.w; im.dataset.ih = m.h; }
  im.style.backgroundImage = `url("${IMGS[id]}")`;
  photo.classList.add('has-img');
}

function setPhotoImage(photo, dataUrl, meta) {
  if (!photo) return;
  const id = newImgId();
  IMGS[id] = dataUrl;
  IMG_META[id] = meta || { w: 0, h: 0, mime: (dataUrl.match(/^data:([^;]+)/) || [])[1] || 'image/jpeg' };
  bindPhotoImage(photo, id);
  photo.dataset.imgZ = 1;
  photo.dataset.imgX = 0;
  photo.dataset.imgY = 0;
  applyImg(photo);
}

/* La imagen siempre cubre el marco: se limita el desplazamiento según el tamaño actual del marco y el zoom */
function clampImg(photo) {
  const im = photo.querySelector('.ph-img');
  if (!im) return;
  const iw = +im.dataset.iw, ih = +im.dataset.ih;
  const W = photo.clientWidth, H = photo.clientHeight;
  if (!iw || !ih || !W || !H) return;
  const z = Math.max(1, numOr(photo.dataset.imgZ, 1));
  const k = Math.max(W / iw, H / ih);              // escala "cubrir"
  const maxX = Math.max(0, (iw * k * z - W) / 2);
  const maxY = Math.max(0, (ih * k * z - H) / 2);
  photo.dataset.imgX = clampNum(numOr(photo.dataset.imgX), -maxX, maxX);
  photo.dataset.imgY = clampNum(numOr(photo.dataset.imgY), -maxY, maxY);
}

async function importImageFile(file) {
  if (!file || !/^image\//.test(file.type)) throw new Error('El archivo no es una imagen');
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch (_) {
    bmp = await new Promise((res, rej) => {
      const u = URL.createObjectURL(file), im = new Image();
      im.onload = () => { URL.revokeObjectURL(u); res(im); };
      im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('No se pudo leer la imagen')); };
      im.src = u;
    });
  }
  const sw = bmp.width || bmp.naturalWidth, sh = bmp.height || bmp.naturalHeight;
  const k = Math.min(1, MAX_IMG_SIDE / Math.max(sw, sh));
  const w = Math.max(1, Math.round(sw * k)), h = Math.max(1, Math.round(sh * k));
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.drawImage(bmp, 0, 0, w, h);
  let mime = 'image/jpeg', dataUrl = null;
  if (file.type === 'image/png') {
    const png = cv.toDataURL('image/png');
    if (png.length < 1500000) { dataUrl = png; mime = 'image/png'; }
  }
  if (!dataUrl) {
    ctx.globalCompositeOperation = 'destination-over';   // fondo blanco detrás (JPG no tiene transparencia)
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, w, h);
    dataUrl = cv.toDataURL('image/jpeg', 0.86);
  }
  if (bmp.close) bmp.close();
  return { dataUrl, meta: { w, h, mime } };
}

async function loadImageInto(photo, file) {
  try {
    const { dataUrl, meta } = await importImageFile(file);
    setPhotoImage(photo, dataUrl, meta);
    hideToast();
  } catch (err) {
    toast('No se pudo cargar la imagen: ' + err.message);
  }
}

/* ---------- Serialización: DOM → proyecto ---------- */
function sizeOf(v) { const n = parseFloat(v); return v && Number.isFinite(n) && n > 0 ? r2(n) : null; }

function serializeElement(el, used) {
  const uid = el.dataset.uid;
  if (!uid) return null;
  const dx = numOr(el.dataset.dx), dy = numOr(el.dataset.dy);
  const isSticker = el.classList.contains('pc-sticker');
  const parentPhoto = isSticker && el.parentElement ? el.parentElement.closest('.photo') : null;
  let layout;
  if (isSticker && parentPhoto) layout = { mode: 'attached', parentId: parentPhoto.dataset.uid, dx: r2(dx), dy: r2(dy) };
  else if (el.style.position === 'absolute' || isSticker) layout = { mode: 'absolute', x: r2(numOr(el.style.left) + dx), y: r2(numOr(el.style.top) + dy) };
  else layout = { mode: 'flow', dx: r2(dx), dy: r2(dy) };
  const common = {
    id: uid,
    origin: el.dataset.origin === 'user' ? 'user' : 'template',
    layout,
    size: { width: sizeOf(el.style.width), height: sizeOf(el.style.height) },
    rotation: r2(numOr(el.dataset.rot)),
    z: Math.round(zOf(el)),
    locked: isLocked(el)
  };
  if (el.classList.contains('photo')) {
    const im = el.querySelector('.ph-img');
    const ref = im && im.dataset.srcId;
    let image = null;
    if (ref && IMGS[ref]) {
      image = { ref, zoom: r2(clampNum(numOr(el.dataset.imgZ, 1), 1, 3)), panX: r2(numOr(el.dataset.imgX)), panY: r2(numOr(el.dataset.imgY)) };
      used.add(ref);
    }
    const style = {};
    const bg = bgOf(el);
    if (bg) style.background = bg;
    readFx(el, style, false);
    return { ...common, type: 'photo', image, style };
  }
  if (isSticker) {
    const lab = el.querySelector('[data-f="datoLabel"]'), val = el.querySelector('[data-f="datoValor"]');
    const st = readTextStyle(el);
    delete st.textAlign; delete st.lineHeight; delete st.letterSpacing;
    return { ...common, type: 'sticker', label: lab ? lab.textContent : '', value: val ? val.textContent : '', style: st };
  }
  if (el.classList.contains('deco')) {
    const dst = {}, dbg = bgOf(el);
    if (dbg) dst.background = dbg;
    readFx(el, dst, false);
    const deco = { ...common, type: 'decoration', name: el.dataset.name || 'Decorativo', html: el.innerHTML };
    if (Object.keys(dst).length) deco.style = dst;
    return deco;
  }
  if (el.dataset.f && TEXT_ROLES[el.dataset.f]) {
    return { ...common, type: 'text', role: el.dataset.f, text: el.textContent, style: readTextStyle(el) };
  }
  return null;
}

function serializeProject() {
  const used = new Set();
  const fmt = document.querySelector('.card').dataset.fmt;
  const pieces = PAGES.map(pg => {
    let piece = document.querySelector('.piece'), host = null;
    if (pg !== CURPG) {                                     // página fuera de pantalla: se lee desde su instantánea
      const snap = pg.stack[pg.idx];
      host = piece = document.createElement('div');
      host.className = 'piece p-' + fmt;
      host.style.cssText = 'position:fixed;left:-20000px;top:0;visibility:hidden';
      host.innerHTML = snap.html;
      host.style.background = snap.bg;
      document.body.appendChild(host);
    }
    const elements = [...piece.querySelectorAll('.drag')]
      .map(el => serializeElement(el, used))
      .filter(Boolean)
      .sort((a, b) => a.z - b.z);
    const out = { id: pg.uid, format: FORMAT_INFO[fmt], width: 1080, height: RATIO_H[fmt], background: piece.style.background || null, elements };
    if (host) host.remove();
    return out;
  });
  const images = {};
  used.forEach(id => {
    const m = IMG_META[id] || {};
    images[id] = { mime: m.mime || 'image/jpeg', width: Math.max(1, m.w || 1), height: Math.max(1, m.h || 1), dataUrl: IMGS[id] };
  });
  return {
    schemaVersion: SCHEMA_VERSION,
    id: PROJECT.id,
    name: PROJECT.name || DEFAULT_NAME,
    createdAt: PROJECT.createdAt || nowISO(),
    updatedAt: PROJECT.updatedAt || nowISO(),
    settings: { snapEnabled: snapOn(), exportScale: document.getElementById('hi-res').checked ? 2 : 1 },
    library: {
      decorations: LIBRARY.slice(BUILTIN_LIB).map(d => ({ id: d.id, name: d.name || 'Decorativo', width: d.w, height: d.h, html: d.html }))
    },
    images,
    pieces
  };
}

const sigOf = p => JSON.stringify({ ...p, updatedAt: 0, images: Object.keys(p.images) });

function resetPiece(piece) {

function templateKey(el) {
  if (el.dataset.f) return el.dataset.f;
  if (el.classList.contains('photo')) return 'photo';

}

function applyElementData(el, e) {
  el.classList.add('drag');
  el.dataset.uid = e.id;
  el.dataset.origin = e.origin;
  el.dataset.locked = e.locked ? '1' : '0';
  el.dataset.rot = e.rotation;
  el.style.zIndex = e.z;
  const L = e.layout;
  if (L.mode === 'absolute') {
    el.style.position = 'absolute';
    el.style.left = L.x + 'px';
    el.style.top = L.y + 'px';
    if (e.type === 'sticker') el.style.bottom = 'auto';
    el.dataset.dx = 0;
    el.dataset.dy = 0;
  } else {
    el.dataset.dx = L.dx;
    el.dataset.dy = L.dy;
  }
  el.style.width = e.size.width != null ? e.size.width + 'px' : '';
  el.style.height = e.size.height != null ? e.size.height + 'px' : '';
  applyT(el);
  if (e.type === 'text') {
    el.textContent = e.text;
    applyTextStyle(el, e.style);
  } else if (e.type === 'photo') {
    const im = el.querySelector('.ph-img');
    if (e.image && IMGS[e.image.ref]) {
      bindPhotoImage(el, e.image.ref);
      el.dataset.imgZ = e.image.zoom;
      el.dataset.imgX = e.image.panX;
      el.dataset.imgY = e.image.panY;
    } else if (im) {
      el.classList.remove('has-img');
      im.style.backgroundImage = '';
      delete im.dataset.srcId;
    }
    el.style.background = e.style.background || '';
    applyFx(el, e.style);
    applyImg(el);
  } else if (e.type === 'sticker') {
    const lab = el.querySelector('[data-f="datoLabel"]'), val = el.querySelector('[data-f="datoValor"]');
    if (lab) lab.textContent = e.label;
    if (val) val.textContent = e.value;
    const s = el.style, st = e.style || {};
    s.fontSize = st.fontSize != null ? st.fontSize + 'px' : '';
    s.color = st.color || '';
    s.background = st.background || '';
    applyFx(el, st);
  } else if (e.type === 'decoration') {
    el.dataset.name = e.name;
    el.innerHTML = sanitize(e.html);
    el.style.background = (e.style && e.style.background) || '';
    applyFx(el, e.style);
  }
}

function createUserElement(piece, e) {
  let el;
  if (e.type === 'text') el = makeTextEl(e.role);
  else if (e.type === 'photo') el = makePhotoEl();
  else if (e.type === 'sticker') el = makeStickerEl();
  else el = makeDecoEl(e.name);
  let parent = piece, data = e;
  if (e.type === 'sticker' && e.layout.mode === 'attached') {
    const ph = [...piece.querySelectorAll('.photo')].find(x => x.dataset.uid === e.layout.parentId);
    if (ph) parent = ph;
    else data = { ...e, layout: { mode: 'absolute', x: 40, y: 40 } };   // la foto ya no está: queda libre
  }
  parent.appendChild(el);
  applyElementData(el, data);
  return el;
}

function applyPiece(piece, pj) {
  resetPiece(piece);
  piece.style.background = pj.background || '';
  const tmpl = new Map();
  piece.querySelectorAll('.drag').forEach(el => tmpl.set(templateKey(el), el));
  // 1) elementos de la plantilla; los que el proyecto no trae se consideran eliminados
  pj.elements.filter(e => e.origin === 'template').forEach(e => {
    const k = e.type === 'text' ? e.role : e.type;
    const el = tmpl.get(k);
    if (el) { applyElementData(el, e); tmpl.delete(k); }
  });
  tmpl.forEach(el => el.remove());
  // 2) elementos del usuario; los stickers al final (pueden pegarse a una foto del usuario)
  const users = pj.elements.filter(e => e.origin === 'user');
  users.filter(e => e.type !== 'sticker').concat(users.filter(e => e.type === 'sticker'))
    .forEach(e => createUserElement(piece, e));
}

function applyProject(p) {
  select(null);
  if (textEl) closeTextBar();
  PROJECT = { id: p.id, name: p.name, createdAt: p.createdAt, updatedAt: p.updatedAt };
  Object.keys(IMGS).forEach(k => delete IMGS[k]);
  Object.keys(IMG_META).forEach(k => delete IMG_META[k]);
  Object.entries(p.images).forEach(([id, im]) => {
    IMGS[id] = im.dataUrl;
    IMG_META[id] = { w: im.width, h: im.height, mime: im.mime };
  });
  LIBRARY.length = BUILTIN_LIB;
  p.library.decorations.forEach(d => LIBRARY.push({ id: d.id, name: d.name, w: d.width, h: d.height, html: sanitize(d.html) }));
  renderAllLibs();
  document.getElementById('snap-on').checked = !!p.settings.snapEnabled;
  document.getElementById('hi-res').checked = p.settings.exportScale === 2;
  const legacy = new Set(p.pieces.map(x => x.height)).size > 1;       // formato antiguo: una pieza por proporción
  const list = legacy ? [p.pieces.find(x => x.id === '4x5') || p.pieces[0]] : p.pieces;
  const piece0 = document.querySelector('.piece');
  PAGES.length = 0;
  setRatio(RATIO_BY_H[list[0].height], { shift: false });
  for (let k = list.length - 1; k >= 0; k--) {                         // la primera página queda visible
    applyPiece(piece0, list[k]);
    PAGES.unshift({ uid: list[k].id, stack: [snapOf(piece0)], idx: 0 });
  }
  CURPG = PAGES[0];
  pageSeq = Math.max(pageSeq, ...list.map(x => +((/^pg(\d+)$/.exec(x.id) || [0, 0])[1])));
  if (legacy) toast('Este proyecto tenía ' + p.pieces.length + ' piezas: se cargó la 4:5.');
  p.pieces.forEach(pc => pc.elements.forEach(e => {
    const m = /^u(\d+)$/.exec(e.id);
    if (m) uidSeq = Math.max(uidSeq, +m[1]);
  }));
  document.getElementById('proj-name').value = PROJECT.name;
  fitPreviews();
  lastSig = sigOf(serializeProject());
}

/* ---------- Añadir elementos ---------- */
function placeCentered(piece, el) {
  const n = parseInt(piece.dataset.addN, 10) || 0;
  piece.dataset.addN = (n + 1) % 6;                     // cada alta se corre un poco para no tapar la anterior
  const W = piece.offsetWidth, H = piece.offsetHeight;
  el.style.left = Math.round((W - el.offsetWidth) / 2 + n * 28) + 'px';
  el.style.top = Math.round((H - el.offsetHeight) / 2 + n * 28) + 'px';
}

function addElementTo(piece, kind, opts) {
  opts = opts || {};
  flushAll();
  const base = { id: newUid(), origin: 'user', rotation: 0, z: nextZ(piece), locked: false };
  let data;
  if (TEXT_ROLES[kind]) {
    const d = TEXT_ROLES[kind];
    data = { ...base, type: 'text', role: kind, text: d.text, style: {}, layout: { mode: 'absolute', x: 0, y: 0 }, size: { width: d.w, height: null } };
  } else if (kind === 'photo') {
    data = { ...base, type: 'photo', image: null, style: {}, layout: { mode: 'absolute', x: 0, y: 0 }, size: { width: 600, height: 450 } };
  } else return null;
  const el = createUserElement(piece, data);
  if (data.layout.mode !== 'attached') placeCentered(piece, el);
  select(el);
  if (kind === 'photo' && !opts.noPick) pickPhoto(el);   // al agregar una foto se abre el selector de archivos
  return el;
}

function addElement(card, kind) {
  const piece = card.querySelector('.piece');
  return addElementTo(piece, kind);
}

function showTab(side, name) {
  side.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.tab === name));
  side.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.dataset.pane === name));
}

function renderAddGrids() {
  document.querySelectorAll('.card').forEach(card => {
    const grid = card.querySelector('.add-grid');
    if (!grid || grid.children.length) return;

(function () {
  const m = document.getElementById('deco-modal'), ta = document.getElementById('deco-code'), msg = document.getElementById('deco-msg');

  window.openDecoModal = () => { opener = document.activeElement; say(''); m.classList.add('on'); ta.focus(); };
  document.getElementById('deco-add').addEventListener('click', () => {

    LIBRARY.push({ id: newLibId(), name: 'Personalizado ' + (LIBRARY.length - 3), w: 160, h: 160, html: sanitize(raw) });

  m.addEventListener('pointerdown', e => { if (e.target === m) close(); });
  document.addEventListener('keydown', e => {
    if (!m.classList.contains('on')) return;
    if (e.key === 'Escape') { e.stopPropagation(); close(); }
    if (e.key === 'Tab') {
      const f = Array.from(m.querySelectorAll('textarea, button')).filter(x => !x.disabled);
      const i = f.indexOf(document.activeElement);
      if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
    }
  }, true);
})();

/* ---------- Capas: arrastrar para reordenar (reutiliza orderOp: mismo cambio de z que ▲ ▼) ---------- */
document.addEventListener('pointerdown', e => {
  const grip = e.target.closest && e.target.closest('.el-row .grip');
  if (!grip || e.button > 0) return;
  e.preventDefault();
  const row = grip.closest('.el-row'), list = row.parentNode;
  const rows = Array.from(list.querySelectorAll('.el-row:not(.sub)'));
  const from = rows.indexOf(row);
  const top0 = list.getBoundingClientRect().top, startY = e.clientY - top0;
  const mids = rows.map(r => { const b = r.getBoundingClientRect(); return b.top - top0 + b.height / 2; });
  const panel = list.closest('.dock-panel') || list;
  let to = from;
  row.classList.add('dragging');
  const mark = () => rows.forEach((r, i) => {
    r.classList.toggle('drop-before', i === to && to < from);
    r.classList.toggle('drop-after', i === to && to > from);
  });
  const move = ev => {
    const pr = panel.getBoundingClientRect();
    if (ev.clientY < pr.top + 28) panel.scrollTop -= 10;
    else if (ev.clientY > pr.bottom - 28) panel.scrollTop += 10;
    const py = ev.clientY - list.getBoundingClientRect().top;
    row.style.transform = 'translateY(' + (py - startY) + 'px)';
    to = mids.reduce((best, m, i) => Math.abs(m - py) < Math.abs(mids[best] - py) ? i : best, 0);
    mark();
  };
  const end = ev => {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', end);
    document.removeEventListener('pointercancel', end);
    row.classList.remove('dragging');
    row.style.transform = '';
    rows.forEach(r => r.classList.remove('drop-before', 'drop-after'));
    if (ev.type === 'pointerup' && to !== from && row._el) {
      for (let i = 0; i < Math.abs(to - from); i++) orderOp(row._el, to < from ? 'up' : 'down');
      refreshAll();
    }
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);
});

/* ---------- Guardado ---------- */
function setSaveStatus(kind, msg) {
  const el = document.getElementById('save-status');
  if (!el) return;
  el.className = 'save-status ' + kind;
  el.textContent = msg + (kind === 'ok' && msg === 'Guardado' ? ' · ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '');
}

function stripImages(p) {
  return { ...p, images: {}, pieces: p.pieces.map(pc => ({ ...pc, elements: pc.elements.map(e => e.type === 'photo' ? { ...e, image: null } : e) })) };
}

function scheduleSave(ms) {
  if (!BOOTED) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveNow(false, false), ms == null ? AUTOSAVE_MS : ms);
}
const markDirty = () => scheduleSave();

/* urgent: no esperar a que termine un gesto en curso · always: guardar aunque no haya cambios */
function saveNow(urgent, always) {
  clearTimeout(saveTimer);
  saveTimer = null;
  if (!BOOTED) return;
  if (!urgent && busyInteracting()) { scheduleSave(500); return; }
  let p;
  try { p = serializeProject(); } catch (e) { console.error(e); setSaveStatus('err', 'Error al preparar el guardado'); return; }
  const sig = sigOf(p);
  if (sig === lastSig && !always) return;
  p.updatedAt = nowISO();
  const errs = validateProject(p);          // nunca se guarda algo que después no se pueda abrir
  if (errs.length) { console.error('Proyecto inválido, no se guarda:', errs); setSaveStatus('err', 'No se guardó: datos inválidos (ver consola)'); return; }
  try {
    const n = Store.put(p);
    Store.setCurrent(p.id);
    PROJECT.updatedAt = p.updatedAt;
    lastSig = sig;
    setSaveStatus(n > QUOTA_WARN ? 'warn' : 'ok', n > QUOTA_WARN ? 'Guardado (cerca del límite de almacenamiento)' : 'Guardado');
  } catch (err) {
    try {
      Store.put(stripImages(p));
      Store.setCurrent(p.id);
      lastSig = '';
      setSaveStatus('warn', 'Guardado sin las fotos: almacenamiento lleno');
    } catch (e2) {
      setSaveStatus('err', 'No se pudo guardar: almacenamiento lleno');
    }
  }
}

window.addEventListener('pagehide', () => saveNow(true, false));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(true, false); });

/* ---------- Operaciones sobre proyectos ---------- */
function tryOpenProject(id) {
  let p;
  try { p = Store.get(id); } catch (e) { setSaveStatus('err', 'No se pudo leer el proyecto guardado'); return false; }
  if (!p) return false;
  p = migrateProject(p);
  const errs = validateProject(p);
  if (errs.length) { console.warn('Proyecto inválido', id, errs); return false; }
  applyProject(p);
  return true;
}

function refreshAfterLoad() {
  initHistory();
  fitPreviews();
  refreshAll();
}

function openProject(id) {
  saveNow(true, false);
  if (tryOpenProject(id)) {
    Store.setCurrent(id);
    refreshAfterLoad();
    setSaveStatus('ok', 'Proyecto abierto');
    return true;
  }
  setSaveStatus('err', 'No se pudo abrir ese proyecto (datos inválidos)');
  return false;
}

function newProject() {
  saveNow(true, false);
  select(null);
  if (textEl) closeTextBar();
  PAGES.length = 0; CURPG = null; pageSeq = 1;
  document.querySelectorAll('.piece').forEach(resetPiece);
  LIBRARY.length = BUILTIN_LIB;
  renderAllLibs();
  Object.keys(IMGS).forEach(k => delete IMGS[k]);
  Object.keys(IMG_META).forEach(k => delete IMG_META[k]);
  document.getElementById('snap-on').checked = true;
  document.getElementById('hi-res').checked = false;
  const t = nowISO();
  PROJECT = { id: newProjectId(), name: DEFAULT_NAME, createdAt: t, updatedAt: t };
  document.getElementById('proj-name').value = PROJECT.name;
  lastSig = '';
  refreshAfterLoad();
  saveNow(true, true);
}

function duplicateProject(id) {
  const p = Store.get(id);
  if (!p) return;
  const t = nowISO();
  p.id = newProjectId();
  p.name = (p.name + ' (copia)').slice(0, 120);
  p.createdAt = t;
  p.updatedAt = t;
  Store.put(p);
}

function deleteProject(id) {
  Store.remove(id);
  if (PROJECT.id === id) {
    const rest = Store.list();
    if (rest.length && openProject(rest[0].id)) return;
    newProject();
  }
}

function exportProjectJson() {
  saveNow(true, false);
  const p = serializeProject();
  p.updatedAt = nowISO();
  download(new Blob([JSON.stringify(p, null, 2)], { type: 'application/json' }), slug(p.name) + '.igproject.json');
}

async function importProjectFile(file) {
  const msg = document.getElementById('proj-msg');
  msg.textContent = '';
  let p;
  try { p = JSON.parse(await file.text()); } catch (_) { msg.textContent = 'El archivo no es un JSON válido.'; return; }
  p = migrateProject(p);
  const errs = (p && typeof p === 'object') ? validateProject(p) : ['el contenido no es un objeto'];
  if (errs.length) {
    msg.textContent = 'No se importó: el proyecto no cumple el esquema. ' + errs.slice(0, 5).join(' · ') + (errs.length > 5 ? ` · (+${errs.length - 5} más)` : '');
    return;
  }
  if (Store.index().some(x => x.id === p.id)) { p.id = newProjectId(); p.name = (p.name + ' (importado)').slice(0, 120); }
  try { Store.put(p); } catch (_) { msg.textContent = 'No se pudo guardar el proyecto importado: almacenamiento lleno.'; return; }
  if (openProject(p.id)) closeProjectsDialog();
}

document.getElementById('proj-open').addEventListener('click', openProjectsDialog);
projDlg.addEventListener('click', e => {

document.getElementById('proj-name').addEventListener('input', e => {
