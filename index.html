document.getElementById('hi-res').addEventListener('change', markDirty);

/* ---------- Arranque ---------- */
function bootProject() {
  const storage = Store.ok();
  let opened = false, failed = false;
  if (storage) {
    const cur = Store.current();
    if (cur) { opened = tryOpenProject(cur); failed = !opened; }
  }
  if (!opened) {
    const t = nowISO();
    PROJECT = { id: newProjectId(), name: DEFAULT_NAME, createdAt: t, updatedAt: t };
    document.getElementById('proj-name').value = PROJECT.name;
  }
  BOOTED = true;
  if (!storage) setSaveStatus('warn', 'Sin guardado: el navegador bloquea el almacenamiento');
  else if (!opened) {
    saveNow(true, true);
    if (failed) setSaveStatus('warn', 'No se pudo abrir el último proyecto: se creó uno nuevo (el anterior sigue en "Proyectos")');
  } else setSaveStatus('ok', 'Proyecto abierto');
}


/* ========== HISTORIAL (deshacer / rehacer) ========== */
/* Cada pieza guarda su propia lista de "fotos" de estado. Un MutationObserver detecta cualquier cambio
   (mover, escalar, texto, colores, orden, altas y bajas…) y guarda una entrada nueva cuando pasa un momento
   sin cambios o cuando empieza la siguiente interacción. Las imágenes se guardan una sola vez en IMGS
   para no repetir megas en cada entrada. */
const HIST = new Map();            // pieza → { stack, idx, timer, restoring, obs }
const IMGS = {};
const MAX_HIST = 100;
const COMMIT_MS = 500;
let uidSeq = 0, lastPiece = null, histUiTimer = null;
const newUid = () => 'u' + (++uidSeq);

/* Estado de una pieza sin lo transitorio (selección, edición, tiradores) ni los datos de imagen */
function snapOf(piece) {
  const c = piece.cloneNode(true);
  c.querySelectorAll('.rs-box, .snap-layer').forEach(n => n.remove());
  c.querySelectorAll('.selected, .editing').forEach(n => n.classList.remove('selected', 'editing'));
  c.querySelectorAll('[contenteditable]').forEach(n => n.removeAttribute('contenteditable'));
  c.querySelectorAll('.ph-img').forEach(n => n.style.removeProperty('background-image'));
  return { html: c.innerHTML, bg: piece.style.background || '', ratio: ratioOf(piece) };
}

function sameSnap(a, b) { return a.html === b.html && a.bg === b.bg && a.ratio === b.ratio; }

function busyInteracting() {
  return !!(dragState || resizeState || panState || gesture || document.body.classList.contains('editing'));
}

function queueCommit(piece, delay = COMMIT_MS) {
  const h = HIST.get(piece);
  if (!h) return;
  clearTimeout(h.timer);
  h.timer = setTimeout(() => commitNow(piece), delay);
}

function commitNow(piece) {
  const h = HIST.get(piece);
  if (!h || h.restoring) return;
  clearTimeout(h.timer);
  h.timer = null;
  if (busyInteracting()) { queueCommit(piece, 300); return; }   // se reintenta cuando termine el gesto
  const snap = snapOf(piece);
  if (sameSnap(snap, h.stack[h.idx])) { scheduleHistUI(); return; }
  h.stack.splice(h.idx + 1);          // una acción nueva descarta lo que se podía rehacer
  h.stack.push(snap);
  if (h.stack.length > MAX_HIST) h.stack.shift();
  h.idx = h.stack.length - 1;
  hideToast();
  updateHistUI();
}

function flushAll() {
  HIST.forEach((h, piece) => { if (h.timer) commitNow(piece); });
}

function restore(piece, snap) {
  const h = HIST.get(piece);
  if (textEl) closeTextBar();
  h.restoring = true;
  const uid = selected && piece.contains(selected) ? selected.dataset.uid : null;
  if (snap.ratio && ratioOf(piece) !== snap.ratio) applyRatioDom(piece, snap.ratio);
  piece.innerHTML = snap.html;
  piece.style.background = snap.bg;
  fitPreviews();
  piece.querySelectorAll('.ph-img[data-src-id]').forEach(n => {
    const u = IMGS[n.dataset.srcId];
    if (u) n.style.backgroundImage = `url("${u}")`;
  });
  h.obs.takeRecords();                // los cambios de la restauración no cuentan como acción
  h.restoring = false;
  dragState = null; resizeState = null; panState = null; gesture = null; tapC = null; dtEdit = null;
  touches.clear();
  const again = uid ? piece.querySelector(`[data-uid="${uid}"]`) : null;
  if (again) select(again);
  else if (selected && !selected.isConnected) select(null);
  else refreshAll();
  updateHistUI();
}

function undo(piece) {
  if (!piece) return false;
  flushAll();
  const h = HIST.get(piece);
  if (!h || h.idx <= 0) return false;
  h.idx--;
  restore(piece, h.stack[h.idx]);
  hideToast();
  return true;
}

function redo(piece) {
  if (!piece) return false;
  flushAll();
  const h = HIST.get(piece);
  if (!h || h.idx >= h.stack.length - 1) return false;
  h.idx++;
  restore(piece, h.stack[h.idx]);
  hideToast();
  return true;
}

function isDirty(piece, h) {
  return !!h.timer && !sameSnap(snapOf(piece), h.stack[h.idx]);
}

function scheduleHistUI() {
  clearTimeout(histUiTimer);
  histUiTimer = setTimeout(updateHistUI, 150);
}

function updateHistUI() {
  const apply = (piece, u, r) => {
    const h = HIST.get(piece);
    if (!h || !u || !r) return;
    const dirty = isDirty(piece, h);
    u.disabled = !(h.idx > 0 || dirty);
    r.disabled = dirty || h.idx >= h.stack.length - 1;
  };
  document.querySelectorAll('.card').forEach(card =>
    apply(card.querySelector('.piece'), card.querySelector('.h-undo'), card.querySelector('.h-redo')));
  const cp = document.querySelector('.card.current .piece');
  if (cp) apply(cp, document.getElementById('h-undo-m'), document.getElementById('h-redo-m'));
}

/* Pieza sobre la que actúan los atajos de teclado */
function activePiece() {
  if (selected) return selected.closest('.piece');
  return document.querySelector('.card.current .piece') || lastPiece || document.querySelector('.piece');
}

function initHistory() {
  HIST.forEach(h => { if (h.obs) h.obs.disconnect(); clearTimeout(h.timer); });
  HIST.clear();
  document.querySelectorAll('.piece').forEach(piece => {
    const h = { stack: [snapOf(piece)], idx: 0, timer: null, restoring: false, obs: null };
    h.obs = new MutationObserver(() => {
      if (h.restoring) return;
      queueCommit(piece);
      scheduleHistUI();
      markDirty();
    });
    h.obs.observe(piece, { subtree: true, childList: true, attributes: true, characterData: true });
    HIST.set(piece, h);
  });
  updateHistUI();
}

/* Al empezar cualquier interacción se guarda lo pendiente: cada acción queda separada de la siguiente */
document.addEventListener('pointerdown', e => {
  const t = e.target;
  if (t && t.closest) {
    const c = t.closest('.card');
    const p = t.closest('.piece') || (c && c.querySelector('.piece'));
    if (p) lastPiece = p;
  }
  flushAll();
}, true);

document.getElementById('h-undo-m').addEventListener('click', () => undo(document.querySelector('.card.current .piece')));
document.getElementById('h-redo-m').addEventListener('click', () => redo(document.querySelector('.card.current .piece')));

function hideToast() { document.getElementById('toast').classList.remove('on'); }

/* ========== EDICIÓN DE TEXTO EN TÁCTIL: barra fija arriba ========== */
/* Editar el texto "en el lugar" obligaba al navegador a enfocar algo dentro de la pieza y a desplazar
   la página para dejar el cursor por encima del teclado: toda la pieza se corría hacia arriba.
   Ahora el texto se escribe en una barra fija arriba y la pieza se actualiza en vivo sin moverse. */
const textBar = document.getElementById('text-bar');
const textInput = document.getElementById('text-input');
let textEl = null, textScrollY = 0;

/* Mantiene la barra pegada al borde superior de la zona visible (por si el teclado desplaza el viewport) */
function pinTextBar() {
  const vv = window.visualViewport;
  if (!vv || !textBar.classList.contains('on')) return;
  textBar.style.top = vv.offsetTop + 'px';
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', pinTextBar);
  window.visualViewport.addEventListener('scroll', pinTextBar);
}

function openTextBar(el) {
  if (textEl) closeTextBar();
  const piece = el.closest('.piece');
  if (!piece) return;
  textEl = el;
  textScrollY = window.scrollY;
  textInput.value = el.innerText != null ? el.innerText : el.textContent;   // innerText conserva los saltos de línea
  piece.classList.add('is-editing');
  document.body.classList.add('editing');
  textBar.classList.add('on');
  fitTextInput();
  pinTextBar();
  textInput.focus({ preventScroll: true });
  const n = textInput.value.length;
  try { textInput.setSelectionRange(n, n); } catch (_) {}
  updateSheet();
}

function closeTextBar() {
  if (!textEl) return;
  const piece = textEl.closest('.piece');
  textEl = null;
  textBar.classList.remove('on');
  textBar.style.top = '';
  textInput.blur();
  document.body.classList.remove('editing');
  if (piece) piece.classList.remove('is-editing');
  refreshAll();
  if (piece) commitNow(piece);        // el texto editado es una entrada de historial
  const y = textScrollY;
  setTimeout(() => { if (Math.abs(window.scrollY - y) > 2) window.scrollTo(0, y); fitPreviews(); }, 80);
}

/* El cuadro crece con el contenido (hasta el 30 % de la pantalla) */
function fitTextInput() {
  textInput.style.height = 'auto';
  textInput.style.height = Math.min(textInput.scrollHeight + 2, window.innerHeight * 0.3) + 'px';
}
textInput.addEventListener('input', () => {
  if (!textEl) return;
  textEl.textContent = textInput.value;      // Enter inserta un salto de línea; se cierra con "Listo"
  fitTextInput();
});
textInput.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); closeTextBar(); }
});
document.getElementById('text-done').addEventListener('click', closeTextBar);

/* Init */
fillContent();
{ const html = document.querySelector('.piece').innerHTML; Object.keys(RATIO_H).forEach(k => { TEMPLATE_HTML[k] = html; }); }
initDraggable();
renderAddGrids();
renderAllLibs();
bootProject();      // abre el último proyecto guardado o crea uno nuevo
initHistory();
document.querySelectorAll('.fmt-bar button[data-fmt]').forEach(b => b.addEventListener('click', () => setCurrent(b.dataset.fmt)));
setCurrent();          // respeta la proporción del proyecto abierto (antes forzaba 4:5 en cada carga)
let lastVw = window.innerWidth;
window.addEventListener('resize', () => {
  if (document.body.classList.contains('editing')) return;   // el teclado cambia el alto: no re-escalar
  if (isNarrow() && window.innerWidth === lastVw) return;    // barras del navegador al hacer scroll
  lastVw = window.innerWidth;
  fitPreviews();
  updateSheet();
});
onMq(mqNarrow, () => { fitPreviews(); updateSheet(); });
window.addEventListener('load', fitPreviews);
document.fonts?.ready.then(fitPreviews);
fitPreviews();
</script>

<script>
/* ===== Efectos de caja: Trazo, Sombra y Espaciado interno =====
   Mismos controles que el resto de propiedades (rango + número, selector de color). Lo guardado vive en el
   estilo en línea del elemento (ver readFx / applyFx). */
const FXUI = (function () {
  const HEX0 = '#141210', SHADOW0 = 'rgba(0, 0, 0, 0.35)';
  const RESET = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v5h5"/></svg>';
  const num = (v, d = 0) => { const n = parseFloat(v); return Number.isFinite(n) ? n : d; };
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const ANG = new WeakMap();                    // el → { box: {a, d}, text: {a, d} } (el ángulo se pierde al redondear x/y)
  const mk = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
  const idle = (inp, v) => { if (document.activeElement !== inp) inp.value = v; };

  function ranged(box, label, o) {              // box: contenedor ya creado (.fld o .row)
    const r = box.querySelector('[type=range]'), n = box.querySelector('[type=number]');
    r.min = o.min; r.max = o.max; r.step = 1;
    n.min = o.min; n.max = o.nmax != null ? o.nmax : o.max; n.step = 1;
    r.setAttribute('aria-label', label); n.setAttribute('aria-label', label);
    return { r, n, el: box, set(v) { idle(r, v); idle(n, v); } };
  }
  const slider = (label, o) => {
    const f = mk('div', 'fld', '<span></span><div class="row"><input type="range"><input type="number"></div>');
    f.querySelector('span').textContent = label;
    return ranged(f, label, o);
  };
  const line = (label, o) => {
    const d = mk('div', 'row fx-line', '<span class="fx-l"></span><input type="range"><input type="number">');
    d.querySelector('.fx-l').textContent = label;
    return ranged(d, label, o);
  };
  const colorField = (cls, ph) => mk('div', 'fld', '<span>Color</span><div class="row"><input type="color" class="' + cls + '-p" value="#000000"><input type="text" class="' + cls + '-t" placeholder="' + ph + '"></div>');
  const bindNum = (c, fn) => { const h = e => fn(num(e.target.value)); c.r.addEventListener('input', h); c.n.addEventListener('input', h); };
  const clearBtn = title => { const b = mk('button', 'btn btn-sm', RESET); b.type = 'button'; b.title = title; b.setAttribute('aria-label', title); return b; };

  function miniTabs(items, foot) {              // pestañas anidadas (mismo estilo que las del panel)
    const d = mk('div', 'fxtabs'), row = mk('div', 'subtabs-row'), strip = mk('div', 'subtabs');
    strip.setAttribute('role', 'tablist');
    row.appendChild(strip);
    if (foot) { const f = mk('span', 'sub-end'); f.appendChild(foot); row.appendChild(f); }
    d.appendChild(row);
    const subs = items.map(([label, nodes]) => {
      const b = mk('button'); b.type = 'button'; b.textContent = label; b.setAttribute('role', 'tab');
      const p = mk('div', 'sub'); nodes.forEach(n => p.appendChild(n));
      strip.appendChild(b); d.appendChild(p);
      return { b, p };
    });
    const pick = i => subs.forEach((x, j) => { x.b.classList.toggle('on', i === j); x.p.classList.toggle('on', i === j); x.b.setAttribute('aria-selected', i === j ? 'true' : 'false'); });
    subs.forEach((x, i) => x.b.addEventListener('click', () => pick(i)));
    pick(0);
    return d;
  }

  function build(card) {
    const piece = card.querySelector('.piece');
    const cur = () => (selected && piece.contains(selected) && !isLocked(selected) ? selected : null);
    const touch = () => { try { updateBox(); } catch (_) {} };

    /* ---- Trazo ---- */
    const sw = slider('Grosor (px)', { min: 0, max: 40, nmax: 100 });
    const sr = slider('Redondeado (px)', { min: 0, max: 200, nmax: 1000 });
    const sc = colorField('st', '#141210 o rgba(20, 18, 16, 0.5)');
    const sct = sc.querySelector('[type=text]'), scp = sc.querySelector('[type=color]');
    bindNum(sw, v => {
      const el = cur(); if (!el) return;
      v = clamp(Math.round(v), 0, 100);
      const had = parseFloat(getComputedStyle(el).borderTopWidth) > 0, s = el.style;
      s.borderStyle = 'solid'; s.borderWidth = v + 'px';
      if (v > 0 && !had && !s.borderTopColor) s.borderColor = HEX0;     // sin trazo previo: arranca con el color de la marca
      sw.set(v); touch();
    });
    bindNum(sr, v => { const el = cur(); if (!el) return; v = clamp(Math.round(v), 0, 1000); el.style.borderRadius = v + 'px'; sr.set(v); touch(); });
    const setStrokeColor = v => {
      const el = cur(); if (!el) return;
      el.style.borderColor = v;
      if (!(parseFloat(getComputedStyle(el).borderTopWidth) > 0)) { el.style.borderStyle = 'solid'; el.style.borderWidth = '4px'; sw.set(4); }   // elegir color sin trazo: lo hace visible
      touch();
    };
    sct.addEventListener('input', () => {
      const v = sct.value.trim();
      if (!v || !CSS.supports('color', v)) { sct.classList.toggle('invalid', !!v); return; }
      sct.classList.remove('invalid'); setStrokeColor(v);
      const hx = toHex6(v); if (hx) scp.value = hx;
    });
    scp.addEventListener('input', () => { sct.value = scp.value; sct.classList.remove('invalid'); setStrokeColor(scp.value); });
    const strokeClear = clearBtn('Quitar trazo');
    strokeClear.addEventListener('click', () => {
      const el = cur(); if (!el) return;
      el.style.borderStyle = 'solid'; el.style.borderWidth = '0px'; sw.set(0); touch();
    });

    /* ---- Sombra (de caja y de texto: mismo modelo color / dirección / difuminado) ---- */
    function shadowCtl(kind) {
      const prop = kind === 'box' ? 'boxShadow' : 'textShadow', pre = kind === 'box' ? 'sh' : 'ts';
      const C = colorField(pre, SHADOW0), t = C.querySelector('[type=text]'), p = C.querySelector('[type=color]');
      const A = line('Ángulo (°)', { min: 0, max: 360 }), D = line('Distancia (px)', { min: 0, max: 80, nmax: 300 }), B = slider('Difuminado (px)', { min: 0, max: 80, nmax: 300 });
      const stack = mk('div', 'fx-stack'); stack.appendChild(A.el); stack.appendChild(D.el);
      const clear = clearBtn(kind === 'box' ? 'Quitar sombra' : 'Quitar sombra del texto');
      const rad = a => a * Math.PI / 180;
      function state(el) {
        const sh = parseShadow(getComputedStyle(el)[prop]), m = (ANG.get(el) || {})[kind];
        if (!sh) return { has: false, c: SHADOW0, ang: m ? m.a : 45, dist: 0, b: 0 };
        let dist = Math.hypot(sh.x, sh.y), ang = (Math.atan2(sh.y, sh.x) * 180 / Math.PI + 360) % 360;
        if (m && Math.round(m.d * Math.cos(rad(m.a))) === Math.round(sh.x) && Math.round(m.d * Math.sin(rad(m.a))) === Math.round(sh.y)) { ang = m.a; dist = m.d; }
        else if (!dist) ang = m ? m.a : 45;
        return { has: true, c: sh.c, ang: Math.round(ang), dist: Math.round(dist * 10) / 10, b: sh.b };
      }
      function change(patch) {
        const el = cur(); if (!el) return;
        let st = state(el);
        if (!st.has) st = { c: SHADOW0, ang: st.ang, dist: 8, b: 10 };          // primera vez: arranca con una sombra visible
        st = Object.assign(st, patch);
        el.style[prop] = fmtShadow({ x: Math.round(st.dist * Math.cos(rad(st.ang))), y: Math.round(st.dist * Math.sin(rad(st.ang))), b: st.b, c: st.c });
        const m = ANG.get(el) || {}; m[kind] = { a: st.ang, d: st.dist }; ANG.set(el, m);
        show(st); touch();
      }
      function show(st) {
        idle(t, st.c); p.value = toHex6(st.c) || '#000000';
        A.set(st.ang); D.set(st.dist); B.set(st.b);
      }
      bindNum(A, v => change({ ang: clamp(Math.round(v), 0, 360) }));
      bindNum(D, v => change({ dist: clamp(v, 0, 300) }));
      bindNum(B, v => change({ b: clamp(v, 0, 300) }));
      t.addEventListener('input', () => {
        const v = t.value.trim();
        if (!v || !CSS.supports('color', v)) { t.classList.toggle('invalid', !!v); return; }
        t.classList.remove('invalid'); change({ c: v });
      });
      p.addEventListener('input', () => { t.value = p.value; t.classList.remove('invalid'); change({ c: p.value }); });
      clear.addEventListener('click', () => {
        const el = cur(); if (!el) return;
        el.style[prop] = 'none'; const m = ANG.get(el); if (m) delete m[kind];
        show(state(el)); touch();
      });
      return { C, stack, B, clear, sync(el) { show(state(el)); } };
    }
    const box = shadowCtl('box'), txt = shadowCtl('text');

    /* ---- Espaciado interno (pestaña dentro de "Fondo") ---- */
    const pd = slider('Espaciado interno (px)', { min: 0, max: 120, nmax: 400 });
    bindNum(pd, v => { const el = cur(); if (!el) return; v = clamp(Math.round(v), 0, 400); el.style.padding = v + 'px'; pd.set(v); touch(); });
    card._fxPad = pd.el;

    function sync() {
      const el = cur(); if (!el) return;
      const cs = getComputedStyle(el), w = parseFloat(cs.borderTopWidth) || 0;
      sw.set(w); sr.set(Math.round(parseFloat(cs.borderTopLeftRadius) || 0)); pd.set(Math.round(parseFloat(cs.paddingTop) || 0));
      const col = w > 0 ? cs.borderTopColor : (el.style.borderTopColor || HEX0);
      idle(sct, col); scp.value = toHex6(col) || HEX0;
      box.sync(el);
      if (el.dataset.f) txt.sync(el);
    }

    return {
      stroke: [['Grosor', [sw.el]], ['Color', [sc]], ['Redondeado', [sr.el]]],
      shadow: [['Color', [box.C]], ['Dirección', [box.stack]], ['Difuminado', [box.B.el]]],
      tshadow: miniTabs([['Color', [txt.C]], ['Dirección', [txt.stack]], ['Difuminado', [txt.B.el]]], txt.clear),
      strokeClear, shadowClear: box.clear, sync
    };
  }
  return { build };
})();
</script>

                  ['1x1', '1:1', 'Cuadrado', '1080 × 1080', 14, 14], ['9x16', '9:16', 'Stories / Reels', '1080 × 1920', 9, 16]];
  function buildRatio(card, done) {
    const d = document.createElement('div');
    d.className = 'ratio-list';
    d.setAttribute('role', 'listbox');
    d.setAttribute('aria-label', 'Relación de aspecto');
    d.innerHTML = RATIOS.map(r => '<button type="button" role="option" data-rt="' + r[0] + '" class="' + (card.dataset.fmt === r[0] ? 'on' : '') + '" aria-selected="' + (card.dataset.fmt === r[0]) + '">' +
      '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="' + (12 - r[4] / 2) + '" y="' + (12 - r[5] / 2) + '" width="' + r[4] + '" height="' + r[5] + '" rx="2"/></svg>' +
      '<span class="rt-l"><b>' + r[1] + ' · ' + r[2] + '</b><small>' + r[3] + ' px</small></span></button>').join('');

      const b = e.target.closest('button[data-rt]');
      if (!b) return;

      if (typeof scheduleHistUI === 'function') scheduleHistUI();

    return d;
  }

  function ctxOf(card) {
    const piece = card.querySelector('.piece');
    const el = selected && piece.contains(selected) ? selected : null;
    if (!el) return { sig: 'none', tools: ['add', 'pagebg', 'deco', 'layers', 'ratio'] };
    const locked = isLocked(el), photo = el.classList.contains('photo'), st = el.classList.contains('pc-sticker'), txt = !!el.dataset.f;
    let t, k;
    if (locked) { k = 'L'; t = ['lock', 'dup']; }
    else if (photo) { k = 'P'; t = ['swap', 'zoom', 'stroke', 'shadow', 'order', 'arrange', 'dup', 'lock', 'del']; }
    else if (st) { k = 'S'; t = ['edit', 'color', 'bg', 'stroke', 'shadow', 'arrange', 'lock', 'del']; }
    else if (txt) { k = 'T'; t = ['edit', 'font', 'format', 'size', 'color', 'bg', 'stroke', 'align', 'spacing', 'order', 'arrange', 'dup', 'lock', 'del']; }
    else { k = 'O'; t = ['color', 'bg', 'stroke', 'shadow', 'order', 'arrange', 'dup', 'lock', 'del']; }
    return { sig: k + (el.dataset.uid || ''), tools: ['close'].concat(t), locked };
  }

  document.querySelectorAll('.card').forEach(card => {
    const side = card.querySelector('.side');
    if (!side) return;
    const q = s => side.querySelector(s);
    const dock = document.createElement('div');
    dock.className = 'dock';
    dock.innerHTML = '<div class="dock-panel"><div class="dock-body"></div></div><div class="dock-tools" role="toolbar" aria-label="Herramientas"></div>';

    const body = dock.querySelector('.dock-body'), bar = dock.querySelector('.dock-tools');
    const box = (name, nodes, cls) => {
      const d = document.createElement('div');
      d.className = 'tool ' + (cls || '');
      d.dataset.tool = name;
      nodes.filter(Boolean).forEach(n => d.appendChild(n));
      body.appendChild(d);
    };
    const fld = s => q(s) && q(s).closest('.fld');
    const blk = s => q(s) && q(s).closest('.side-block');
    /* Herramienta con pestañas internas (barra deslizable): mismos nodos, repartidos en sub-paneles */
    const tabbed = (name, tabs, foot) => {
      const d = document.createElement('div');
      d.className = 'tool';
      d.dataset.tool = name;
      const strip = document.createElement('div');
      strip.className = 'subtabs';
      strip.setAttribute('role', 'tablist');
      const subs = tabs.map(([label, nodes, cls, act]) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = label;
        b.setAttribute('role', 'tab');
        if (act) b.classList.add('act');
        const p = document.createElement('div');
        p.className = 'sub ' + (cls || '');
        nodes.filter(Boolean).forEach(n => p.appendChild(n));
        strip.appendChild(b);
        return { b, p, act };
      });
      const pick = i => subs.forEach((x, j) => {
        x.b.classList.toggle('on', i === j);
        x.p.classList.toggle('on', i === j);
        x.b.setAttribute('aria-selected', i === j ? 'true' : 'false');
      });
      subs.forEach((x, i) => x.b.addEventListener('click', () => (x.act ? x.act() : pick(i))));
      const row = document.createElement('div');
      row.className = 'subtabs-row';
      row.appendChild(strip);
      if (foot) {
        const f = document.createElement('span');
        f.className = 'sub-end ' + (foot.cls || '');
        foot.nodes.filter(Boolean).forEach(n => f.appendChild(n));
        row.appendChild(f);
      }
      d.appendChild(row);
      subs.forEach(x => { if (!x.act) d.appendChild(x.p); });
      body.appendChild(d);
      pick(0);
      d._pick = pick;
      return d;
    };
    const AL = {
      left: '<path d="M4 4v16"/><rect x="7" y="7" width="12" height="4" rx="1"/><rect x="7" y="13" width="8" height="4" rx="1"/>',
      hcenter: '<path d="M12 4v16"/><rect x="5" y="7" width="14" height="4" rx="1"/><rect x="8" y="13" width="8" height="4" rx="1"/>',
      right: '<path d="M20 4v16"/><rect x="5" y="7" width="12" height="4" rx="1"/><rect x="9" y="13" width="8" height="4" rx="1"/>',
      top: '<path d="M4 4h16"/><rect x="7" y="7" width="4" height="12" rx="1"/><rect x="13" y="7" width="4" height="8" rx="1"/>',
      vcenter: '<path d="M4 12h16"/><rect x="7" y="5" width="4" height="14" rx="1"/><rect x="13" y="8" width="4" height="8" rx="1"/>',
      bottom: '<path d="M4 20h16"/><rect x="7" y="5" width="4" height="12" rx="1"/><rect x="13" y="9" width="4" height="8" rx="1"/>'
    };
    side.querySelectorAll('[data-al]').forEach(b => {
      const t = b.textContent.trim();
      b.title = t; b.setAttribute('aria-label', t);
      b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + AL[b.dataset.al] + '</svg>';
    });
    const rs = q('.txt-reset');
    if (rs) { const t = rs.textContent.trim(); rs.title = t; rs.setAttribute('aria-label', t); rs.innerHTML = svg('reset'); }
    const fx = FXUI.build(card);
    box('size', [fld('.sz-r')]);
    const colorTool = tabbed('color', [['Color', [fld('.tc-p')]], ['Sombra', [fx.tshadow]]]);   // "Sombra" (de texto) solo se ve en textos
    box('bg', [fld('.fg-p')]);
    tabbed('stroke', fx.stroke, { nodes: [fx.strokeClear] });
    tabbed('shadow', fx.shadow, { nodes: [fx.shadowClear] });
    card._fxSync = () => {
      fx.sync();
      const el = selected && card.querySelector('.piece').contains(selected) ? selected : null, isTxt = !!(el && el.dataset.f);
      colorTool.classList.toggle('one', !isTxt);
      if (!isTxt) colorTool._pick(0);

    box('align', [fld('[data-ta]')], 'txt-block');
    tabbed('spacing', [['Interlineado', [fld('.lh-r')], 'txt-block'], ['Interletrado', [fld('.ls-r')], 'txt-block']], { nodes: [q('.txt-reset')], cls: 'txt-block' });
    box('zoom', [blk('.zm-r')]);
    box('pagebg', [q('.pz-p') && q('.pz-p').closest('.row')]);
    box('order', [blk('[data-ord]')]);
    tabbed('arrange', [
      ['Alinear', [blk('[data-al]')]],
      ['Tamaño', [fld('.w-n'), q('.ratio-r') && q('.ratio-r').closest('.chk')]],
      ['X / Y', [fld('.x-n')]],
      ['Giro', [fld('.rot-n')]]
    ]);
    box('font', [IGFont.panel('font')]); box('format', [IGFont.panel('format')]); box('layers', [blk('.el-list')]); box('ratio', [buildRatio(card, () => setTool(''))]); box('add', [blk('.add-grid')]); tabbed('deco', [['Biblioteca', [q('.lib')]], ['+ Nuevo', [], '', () => openDecoModal()]]);

    const st = card._dock = { sig: null, tool: '' };
    const mark = () => bar.querySelectorAll('button[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === st.tool));
    const setTool = name => {
      st.tool = name;
      side.classList.toggle('dock-open', !!name);
      side.dataset.tool = name;
      body.querySelectorAll('.tool').forEach(t => t.classList.toggle('on', t.dataset.tool === name));
      mark();
    };
    bar.addEventListener('click', e => {
      const b = e.target.closest('button[data-t]');
      if (!b) return;
      const t = b.dataset.t, click = s => { const n = q(s); if (n) n.click(); };
      if (T[t][2] === 'p') return setTool(st.tool === t ? '' : t);
      setTool('');
      if (t === 'edit') click('[data-q="edit"]');
      else if (t === 'swap') click('[data-q="photo"]');
      else if (t === 'dup') click('[data-q="dup"]');
      else if (t === 'lock') click('[data-q="lock"]');
      else if (t === 'del') click('[data-q="del"]');
      else if (t === 'close') select(null);
    });
    card._dockSync = () => {
      const c = ctxOf(card);
      if (st.sig !== c.sig) {
        st.sig = c.sig;
        bar.innerHTML = '';
        c.tools.forEach(t => {
          const b = document.createElement('button');
          b.type = 'button';
          b.dataset.t = t;

          bar.appendChild(b);
          if (t === 'close') { const sp = document.createElement('i'); sp.className = 'sep'; bar.appendChild(sp); }
        });
        setTool('');
      }
    };
  });

  const _ra = refreshAll;
  refreshAll = function () {
    _ra.apply(this, arguments);
    document.querySelectorAll('.card').forEach(c => { c._dockSync && c._dockSync(); c._fxSync && c._fxSync(); });
  };
  document.querySelectorAll('.card').forEach(c => c._dockSync && c._dockSync());

  /* Altura de la barra → espacio inferior de la página */
  const setH = () => {
    const s = document.querySelector('.card.current .side');
    document.documentElement.style.setProperty('--dock-h', (s ? s.offsetHeight : 0) + 'px');
  };
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(setH);
    document.querySelectorAll('.side').forEach(s => ro.observe(s));
  }
  setH();
})();
</script>

  html body .page{padding-bottom:calc(var(--dock-h,0px) + var(--pg-h,0px) + 12px) !important}
}
@media (min-width:901px){

<script>
(function () {
  const piece = () => document.querySelector('.piece');
  const ratio = () => document.querySelector('.card').dataset.fmt;
  const ic = d => '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + d + '"/></svg>';
  const TH = 64;
  const bar = document.createElement('div');
  bar.className = 'pg-bar';
  bar.setAttribute('aria-label', 'Páginas');
  const CKEY = 'ig.pgbar.collapsed';
  let collapsed = false;
  try { collapsed = localStorage.getItem(CKEY) === '1'; } catch (_) {}
  bar.innerHTML = '<button type="button" class="pg-toggle"></button><div class="pg-track"></div><div class="pg-menu" hidden>' +
    '<button type="button" data-a="dup">' + ic('M8 8h11v11H8zM5 15V5h10') + '<span>Duplicar página</span></button>' +
    '<button type="button" data-a="del">' + ic('M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13') + '<span>Eliminar página</span></button></div>';
  document.body.appendChild(bar);
  const track = bar.querySelector('.pg-track'), menu = bar.querySelector('.pg-menu'), toggle = bar.querySelector('.pg-toggle');
  function syncToggle() {
    bar.classList.toggle('collapsed', collapsed);
    toggle.innerHTML = ic(collapsed ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6');
    toggle.title = collapsed ? 'Mostrar miniaturas' : 'Colapsar páginas';
    toggle.setAttribute('aria-label', toggle.title);
    toggle.setAttribute('aria-expanded', String(!collapsed));
  }

  const snapFor = pg => pg === CURPG ? snapOf(piece()) : pg.stack[pg.idx];
  function fillMini(clip, snap, sc, fmt) {
    clip.innerHTML = '';
    const m = document.createElement('div');
    m.className = 'pg-mini p-' + fmt;
    m.style.cssText = 'position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;transform:scale(' + sc + ')';
    m.innerHTML = snap.html;
    m.style.background = snap.bg;
    m.querySelectorAll('.guide,.rs-box,.snap-layer').forEach(n => n.remove());
    m.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
    m.querySelectorAll('.ph-img[data-src-id]').forEach(n => { const u = IMGS[n.dataset.srcId]; if (u) n.style.backgroundImage = 'url("' + u + '")'; });
    clip.appendChild(m);
  }

  window.renderPages = function (center) {
    if (!CURPG || !PAGES.length) return;
    syncToggle();
    if (collapsed) {                                       // colapsado: solo puntitos (uno por página)
      track.innerHTML = PAGES.map((pg, i) => '<button type="button" class="pg-dot' + (pg === CURPG ? ' on' : '') + '" data-i="' + i + '" aria-label="Página ' + (i + 1) + '"' + (pg === CURPG ? ' aria-current="true"' : '') + '></button>').join('');
      const od = track.querySelector('.pg-dot.on');
      if (od) track.scrollLeft = od.offsetLeft - (track.clientWidth - od.offsetWidth) / 2;
      document.documentElement.style.setProperty('--pg-h', bar.offsetHeight + 'px');
      fitPreviews();
      return;
    }
    const fmt = ratio(), sc = TH / RATIO_H[fmt], tw = Math.round(1080 * sc), parts = [];
    PAGES.forEach((pg, i) => {
      if (i) parts.push('<div class="pg-sep"><button type="button" class="pg-add" data-at="' + i + '" aria-label="Añadir página aquí">+</button></div>');
      parts.push('<div class="pg-th' + (pg === CURPG ? ' on' : '') + '" data-i="' + i + '" style="width:' + tw + 'px;height:' + TH + 'px" role="button" aria-label="Página ' + (i + 1) + '"><div class="pg-clip"></div><span class="pg-n">' + (i + 1) + '</span><button type="button" class="pg-dots" aria-label="Opciones de la página ' + (i + 1) + '" aria-haspopup="menu"><span>' + ic('M5 12h.01M12 12h.01M19 12h.01') + '</span></button></div>');
    });
    parts.push('<button type="button" class="pg-tile pg-end">' + ic('M12 5v14M5 12h14') + '<span>Añadir</span></button>');
    const keep = track.scrollLeft;
    track.innerHTML = parts.join('');
    track.querySelectorAll('.pg-th').forEach((th, i) => fillMini(th.querySelector('.pg-clip'), snapFor(PAGES[i]), sc, fmt));
    const on = track.querySelector('.pg-th.on');
    track.scrollLeft = center && on ? on.offsetLeft - (track.clientWidth - on.offsetWidth) / 2 : keep;
    document.documentElement.style.setProperty('--pg-h', bar.offsetHeight + 'px');
    fitPreviews();
  };

  /* La miniatura de la página actual se actualiza sola al editar */
  let rt = null;
  const thumbSoon = () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      const clip = track.querySelector('.pg-th.on .pg-clip');
      if (clip && CURPG) fillMini(clip, snapOf(piece()), TH / RATIO_H[ratio()], ratio());
    }, 350);
  };
  new MutationObserver(thumbSoon).observe(piece(), { subtree: true, childList: true, attributes: true, characterData: true });

  const viewReset = p => { p.dataset.vz = 1; p.dataset.vx = 0; p.dataset.vy = 0; };
  function stash() { const h = HIST.get(piece()); CURPG.stack = h.stack; CURPG.idx = h.idx; return h; }
  function show(pg) {
    const p = piece(), h = HIST.get(p);
    CURPG = pg; h.stack = pg.stack; h.idx = pg.idx;
    select(null);
    restore(p, h.stack[h.idx]);
    viewReset(p);
    fitPreviews();
    renderPages(true);
  }
  function gotoPage(pg) {
    if (pg === CURPG) return;
    if (textEl) closeTextBar();
    flushAll();
    stash();
    show(pg);
  }
  function addPage(at, dup) {
    const p = piece();
    if (textEl) closeTextBar();
    flushAll(); select(null);
    const h = stash(), pg = { uid: 'pg' + (++pageSeq), stack: null, idx: 0 };
    PAGES.splice(at, 0, pg);
    if (dup) { pg.stack = [JSON.parse(JSON.stringify(h.stack[h.idx]))]; show(pg); }
    else {
      h.restoring = true; resetPiece(p); h.obs.takeRecords(); h.restoring = false;
      pg.stack = [snapOf(p)]; CURPG = pg; h.stack = pg.stack; h.idx = 0;
      viewReset(p); fitPreviews(); updateHistUI(); refreshAll(); renderPages(true);
    }
    markDirty();
  }
  function delPage() {
    if (PAGES.length < 2) { toast('Debe quedar al menos una página.'); return; }
    const i = PAGES.indexOf(CURPG);
    if (!confirm('¿Eliminar la página ' + (i + 1) + '?')) return;
    if (textEl) closeTextBar();
    flushAll();
    const next = PAGES[i + 1] || PAGES[i - 1];
    PAGES.splice(i, 1);
    show(next);
    markDirty();
  }

  /* Menú de la página (junto a su miniatura) */
  function openMenu(th) {
    const br = bar.getBoundingClientRect(), r = th.getBoundingClientRect();
    menu.hidden = false;
    menu.dataset.i = th.dataset.i;
    menu.style.right = 'auto';
    menu.style.left = Math.max(8, Math.min(r.left - br.left, window.innerWidth - menu.offsetWidth - 8)) + 'px';
  }

  /* Clics */
  let noClick = false;
  track.addEventListener('click', e => {
    if (noClick) return;
    const dots = e.target.closest('.pg-dots');
    if (dots) {
      const i = dots.closest('.pg-th').dataset.i;
      if (!menu.hidden && menu.dataset.i === i) { menu.hidden = true; return; }
      gotoPage(PAGES[+i]);
      openMenu(track.querySelector('.pg-th.on'));
      return;
    }
    const t = e.target.closest('.pg-th, .pg-add, .pg-end, .pg-dot');
    if (!t) return;
    menu.hidden = true;
    if (t.classList.contains('pg-th') || t.classList.contains('pg-dot')) gotoPage(PAGES[+t.dataset.i]);
    else if (t.classList.contains('pg-add')) addPage(+t.dataset.at);
    else addPage(PAGES.length);
  });
  toggle.addEventListener('click', () => {
    collapsed = !collapsed;
    menu.hidden = true;
    try { localStorage.setItem(CKEY, collapsed ? '1' : '0'); } catch (_) {}
    renderPages(true);
  });
  menu.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    menu.hidden = true;
    if (b.dataset.a === 'dup') addPage(PAGES.indexOf(CURPG) + 1, true);
    else delPage();
  });
  document.addEventListener('pointerdown', e => { if (!menu.hidden && !bar.contains(e.target)) menu.hidden = true; }, true);

  /* Arrastrar una miniatura (mantener pulsada) para cambiar el orden */
  let pd = null;
  track.addEventListener('pointerdown', e => {
    const th = e.target.closest('.pg-th');
    if (!th || e.target.closest('.pg-dots')) return;
    const i = +th.dataset.i;
    pd = { th, i, to: i, x0: e.clientX, id: e.pointerId, on: false, scroll0: track.scrollLeft };
    pd.timer = setTimeout(() => { pd.on = true; th.classList.add('drag'); try { th.setPointerCapture(pd.id); } catch (_) {} if (navigator.vibrate) navigator.vibrate(12); }, e.pointerType === 'mouse' ? 120 : 320);
  });
  track.addEventListener('pointermove', e => {
    if (!pd) return;
    if (!pd.on) { if (Math.abs(e.clientX - pd.x0) > 8) { clearTimeout(pd.timer); pd = null; } return; }   // se movió antes: es scroll
    const r = track.getBoundingClientRect();
    if (e.clientX < r.left + 40) track.scrollLeft -= 10; else if (e.clientX > r.right - 40) track.scrollLeft += 10;
    pd.th.style.transform = 'translateX(' + (e.clientX - pd.x0 + track.scrollLeft - pd.scroll0) + 'px)';
    const ths = [...track.querySelectorAll('.pg-th')];
    ths.forEach(t => t.classList.remove('drop-b', 'drop-a'));
    let to = ths.length - 1, mark = null;
    for (let k = 0; k < ths.length; k++) {
      if (k === pd.i) continue;
      const rc = ths[k].getBoundingClientRect();
      if (e.clientX < rc.left + rc.width / 2) { to = k > pd.i ? k - 1 : k; mark = [ths[k], 'drop-b']; break; }
    }
    if (!mark) { const last = ths.filter((_, k) => k !== pd.i).pop(); if (last) mark = [last, 'drop-a']; }
    if (mark) mark[0].classList.add(mark[1]);
    pd.to = to;
  });
  const endDrag = () => {
    if (!pd) return;
    clearTimeout(pd.timer);
    const d = pd; pd = null;
    if (!d.on) return;
    noClick = true; setTimeout(() => { noClick = false; }, 80);
    if (d.to !== d.i) { const [m] = PAGES.splice(d.i, 1); PAGES.splice(d.to, 0, m); markDirty(); }
    renderPages();
  };
  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);
  track.addEventListener('touchmove', e => { if (pd && pd.on) e.preventDefault(); }, { passive: false });
  track.addEventListener('contextmenu', e => e.preventDefault());

  /* El historial de la página actual sigue a initHistory (carga de proyecto / proyecto nuevo) */
  function syncPages() {
    const h = HIST.get(piece());
    if (!PAGES.length) PAGES.push({ uid: 'pg1', stack: null, idx: 0 });
    if (!CURPG || !PAGES.includes(CURPG)) CURPG = PAGES[0];
    if (h) {
      if (CURPG.stack) { h.stack = CURPG.stack; h.idx = CURPG.idx || 0; }
      else { CURPG.stack = h.stack; CURPG.idx = h.idx; }
    }
  }
  const _ih = initHistory;
  initHistory = function () { _ih(); syncPages(); renderPages(true); };
  syncPages();
  renderPages(true);
  window.addEventListener('resize', () => renderPages());
})();
</script>

<script>
/* PDF: una imagen JPEG por página (a hasta 3x) a tamaño real de 96 ppp; sin librerías. */
async function makePdf(pages, title) {
  const enc = new TextEncoder(), chunks = [], xref = [];
  let off = 0;
  const push = d => { const u = typeof d === 'string' ? enc.encode(d) : d; chunks.push(u); off += u.length; };
  const obj = (n, body) => { xref[n] = off; push(n + ' 0 obj\n' + body + '\nendobj\n'); };
  push('%PDF-1.4\n%\u00e2\u00e3\u00cf\u00d3\n');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [' + pages.map((_, i) => (3 + 3 * i) + ' 0 R').join(' ') + '] /Count ' + pages.length + ' >>');
  for (let i = 0; i < pages.length; i++) {
    const p = pages[i], jpg = new Uint8Array(await p.blob.arrayBuffer());
    const pw = (p.w * 0.75).toFixed(2), ph = (p.h * 0.75).toFixed(2), cs = 'q ' + pw + ' 0 0 ' + ph + ' 0 0 cm /Im0 Do Q';
    obj(3 + 3 * i, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pw + ' ' + ph + '] /Resources << /XObject << /Im0 ' + (5 + 3 * i) + ' 0 R >> >> /Contents ' + (4 + 3 * i) + ' 0 R >>');
    obj(4 + 3 * i, '<< /Length ' + cs.length + ' >>\nstream\n' + cs + '\nendstream');
    xref[5 + 3 * i] = off;
    push((5 + 3 * i) + ' 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + p.pxw + ' /Height ' + p.pxh + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpg.length + ' >>\nstream\n');
    push(jpg);
    push('\nendstream\nendobj\n');
  }
  const n = 3 + 3 * pages.length;
  obj(n, '<< /Title <FEFF' + [...(title || 'Documento')].map(c => c.charCodeAt(0).toString(16).padStart(4, '0')).join('') + '> /Producer (Editor de posts) >>');
  const xo = off;
  push('xref\n0 ' + (n + 1) + '\n0000000000 65535 f \n' + xref.slice(1).map(o => String(o).padStart(10, '0') + ' 00000 n \n').join(''));
  push('trailer\n<< /Size ' + (n + 1) + ' /Root 1 0 R /Info ' + n + ' 0 R >>\nstartxref\n' + xo + '\n%%EOF');
  return new Blob(chunks, { type: 'application/pdf' });
}

(function () {
  const KEY = 'ig.export.v1';
  const LV = { estandar: 1, alta: 2, maxima: 3 }, JQ = { estandar: 0.92, alta: 0.95, maxima: 0.98 };
  const E = { type: 'jpg', q: { jpg: 'estandar', pdf: 'maxima' }, pages: 'all', range: '', split: false };
  try { const o = JSON.parse(localStorage.getItem(KEY) || 'null'); if (o) { E.type = o.type || E.type; E.q = Object.assign(E.q, o.q); E.pages = o.pages || E.pages; E.range = typeof o.range === 'string' ? o.range : ''; E.split = !!o.split; } } catch (_) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(E)); } catch (_) {} };
  const $ = id => document.getElementById(id);
  const fmtNow = () => document.querySelector('.card').dataset.fmt;
  /* "1-3, 5, 7-9" → índices de página (base 0), o null si no es válido */
  function parseRange(str, n) {
    const out = new Set();
    for (const part of str.split(/[,;\s]+/).filter(Boolean)) {
      const m = /^(\d+)(?:-(\d+))?$/.exec(part);
      if (!m) return null;
      let a = +m[1], b = m[2] ? +m[2] : a;
      if (a > b) [a, b] = [b, a];
      if (a < 1 || b > n) return null;
      for (let i = a; i <= b; i++) out.add(i - 1);
    }
    return out.size ? [...out].sort((x, y) => x - y) : null;
  }
  const pagesSel = () => {
    if (E.pages === 'one') return [CURPG];
    if (E.pages === 'range') { const ix = parseRange(E.range, PAGES.length); return ix ? ix.map(i => PAGES[i]) : []; }
    return PAGES.slice();
  };

  /* Escala según calidad; limitada al área máxima de canvas de los móviles (~16,7 Mpx) */
  window.expScale = function (type) {
    if (type === 'svg') return 1;
    const cap = Math.sqrt(16.7e6 / (1080 * RATIO_H[fmtNow()]));
    return Math.max(1, Math.min(LV[E.q[type]] || 1, cap));
  };

  function sync() {
    const n = PAGES.length, multi = n > 1, t = E.type;
    if (!multi) E.pages = 'all';
    $('ex-type').value = t;
    document.querySelector('[data-ex="q"]').hidden = t === 'svg';
    document.querySelector('[data-ex="p"]').hidden = !multi;
    document.querySelector('[data-ex="range"]').hidden = !(multi && E.pages === 'range');
    const sel = pagesSel(), cnt = sel.length;
    document.querySelector('[data-ex="split"]').hidden = !(t === 'pdf' && cnt > 1);
    if (document.activeElement !== $('ex-range')) $('ex-range').value = E.range;
    $('ex-range').classList.toggle('bad', E.pages === 'range' && !cnt);
    $('ex-go').disabled = !cnt;
    $('ex-split').checked = E.split;
    $('ex-n').textContent = n;
    $('hi-res').checked = E.q.jpg !== 'estandar';
    document.querySelectorAll('#ex-q button').forEach(b => b.classList.toggle('on', b.dataset.v === E.q[t]));
    document.querySelectorAll('#ex-p button').forEach(b => b.classList.toggle('on', b.dataset.v === E.pages));
    if (!cnt) { $('ex-sum').textContent = 'Escribe un rango válido, por ejemplo 1-3, 5 (el proyecto tiene ' + n + ' páginas).'; return; }
    const sc = expScale(t), h = RATIO_H[fmtNow()];
    const size = t === 'svg' ? '1080 × ' + h + ' px' : Math.round(1080 * sc) + ' × ' + Math.round(h * sc) + ' px';
    const zip = cnt > 1 && (t !== 'pdf' || E.split);
    $('ex-sum').textContent = (cnt > 1 ? cnt + ' páginas' : '1 página') + ' · ' + size + ' · ' + (t === 'pdf' ? (zip ? 'ZIP de PDF' : 'un solo PDF') : zip ? 'ZIP' : t.toUpperCase());
  }
  $('ex-type').addEventListener('change', e => { E.type = e.target.value; save(); sync(); });
  $('ex-q').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { E.q[E.type] = b.dataset.v; save(); sync(); } });
  $('ex-p').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { E.pages = b.dataset.v; save(); sync(); } });
  $('ex-range').addEventListener('input', e => { E.range = e.target.value; save(); sync(); });
  $('ex-split').addEventListener('change', e => { E.split = e.target.checked; save(); sync(); });
  const _rp = window.renderPages;
  window.renderPages = function (c) { _rp(c); sync(); };

  async function run() {
    if (!pagesSel().length) return;
    flushAll();
    const t = E.type, fmt = fmtNow(), h = RATIO_H[fmt], sc = expScale(t), q = JQ[E.q[t]] || 0.95;
    const base = slug(PROJECT.name), pad = n => String(n).padStart(2, '0'), list = pagesSel();
    const suffix = t === 'jpg' && sc !== 1 ? '@' + (+sc.toFixed(1)) + 'x' : '';
    setBusy(true);
    try {
      await document.fonts.ready;
      const items = [];
      for (const pg of list) {
        const nm = base + '-' + pad(PAGES.indexOf(pg) + 1) + '-' + fmt, el = pageExportEl(pg);
        try {
          if (t === 'svg') items.push({ name: nm + '.svg', blob: new Blob([await buildSvg(el)], { type: 'image/svg+xml;charset=utf-8' }) });
          else items.push({ name: nm + suffix + (t === 'pdf' ? '.pdf' : '.jpg'), blob: await renderJpgBlob(el, sc, q) });
        } finally { el.remove(); }
      }
      const px = { pxw: Math.round(1080 * sc), pxh: Math.round(h * sc), w: 1080, h };
      let out;                                                   // [{name, blob}] finales
      if (t === 'pdf') {
        if (E.split || items.length === 1) {
          out = [];
          for (const it of items) out.push({ name: it.name, blob: await makePdf([{ blob: it.blob, ...px }], PROJECT.name) });
        } else out = [{ name: base + '-' + fmt + '.pdf', blob: await makePdf(items.map(it => ({ blob: it.blob, ...px })), PROJECT.name) }];
      } else out = items;
      if (out.length === 1) {
        if (t === 'jpg' && isTouch()) showResult(out[0].blob, out[0].name, null); else download(out[0].blob, out[0].name);
      } else download(await makeZip(out), base + '-' + fmt + '-' + t + '.zip');
    } catch (err) {
      alert('No se pudo exportar: ' + err.message);
    } finally {
      setBusy(false);
    }
  }
  $('ex-go').addEventListener('click', run);
  sync();
})();
</script>
