<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Piezas para Instagram</title>

<!-- Fuentes de marca (el CSS adjunto usa Fraunces e Inter pero no las carga; se agregan aquí) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Exportación JPG -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<!-- TOKENS Y CLASES DE MARCA (copiados del CSS adjunto; se omiten nav, hero, marquee, etc. que no se usan) -->
<style id="brand-css">
:root { --paper: #f7f5f0; --paper-2: #efece4; --ink: #141210; --ink-soft: #4b463f; --mustard: #f5d949; --mint: #cfe9d4; --lemon: #f4eab0; --white: #fffdf8; --radius: 9px; --shadow: 3px 3px 0 var(--ink); --shadow-sm: 3px 3px 0 var(--ink); --rainbow: linear-gradient(90deg, #f7b8d2 0%, #c9b6ee 25%, #a9d8f0 50%, #b9e8c2 72%, #f4e6a0 100%); --grad: linear-gradient(90deg, #ffb4c6 0%, #ffd7a8 22%, #fff3a0 42%, #c9f0c4 62%, #b8dcff 80%, #d7bdff 100%); }
* { box-sizing: border-box; margin: 0; padding: 0 }
h1,h2,h3,h4 { font-family: 'Fraunces', Georgia, serif; line-height: 1.1; letter-spacing: -0.01em }
a { color: inherit; text-decoration: none }
img { max-width: 100%; display: block }
.rainbow-bar { height: 6px; width: 100%; background: var(--rainbow); border-radius: 99px }
.btn { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1rem; padding: 14px 26px; border-radius: var(--radius); border: 1.5px solid var(--ink); cursor: pointer; background: var(--white); color: var(--ink); box-shadow: var(--shadow); transition: transform .08s ease, box-shadow .08s ease; }
.btn:hover { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink) }
.btn-mustard { background: var(--mustard); color: var(--ink) }
.btn-ghost { background: transparent; box-shadow: none }
.btn-ghost:hover { background: var(--paper-2); transform: none; box-shadow: none }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 600; padding: 5px 12px; border-radius: var(--radius); border: 1.5px solid var(--ink); background: var(--lemon); }
.tag-mint { background: var(--mint) }
</style>

<!-- ESTILOS DE PÁGINA Y PIEZAS -->
<style id="piece-css">
/* ---- Página (vista previa) ---- */
[hidden] { display: none !important }
html { -webkit-text-size-adjust: 100% }
button, label, .drag { -webkit-tap-highlight-color: transparent }
.t-only { display: none }
@media (pointer: coarse) { .d-only { display: none } .t-only { display: inline } }
body { font-family: 'Inter', system-ui, sans-serif; background: var(--paper); color: var(--ink); line-height: 1.6; -webkit-font-smoothing: antialiased; }
.page { max-width: 1280px; margin: 0 auto; padding: 48px 24px 96px }
.page-head h1 { font-size: clamp(2.2rem, 4vw, 3.2rem); font-weight: 600 }
.page-head p { color: var(--ink-soft); margin-top: 12px; max-width: 70ch }
.toolbar { display: flex; gap: 22px; flex-wrap: wrap; align-items: center; margin: 28px 0 56px; padding: 16px 20px; background: var(--white); border: 1.5px solid var(--ink); border-radius: var(--radius); box-shadow: var(--shadow) }
.toggle { display: inline-flex; gap: 8px; align-items: center; font-weight: 500; cursor: pointer }
.toggle input { width: 18px; height: 18px; accent-color: var(--ink) }
.card { margin-bottom: 80px }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 18px }
.card-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap }
.meta-txt { font-size: .9rem; color: var(--ink-soft); font-weight: 500 }
.card-actions { display: flex; gap: 10px; flex-wrap: wrap }
.btn-sm { padding: 10px 16px; font-size: .92rem; box-shadow: 2px 2px 0 var(--ink) }
.stage { position: relative; overflow: hidden; width: 100%; border: 1.5px solid var(--ink); border-radius: var(--radius); background: var(--paper-2) }

/* ---- Pieza (tamaño nativo 1080 px de ancho) ---- */
.piece, .pg-mini { position: relative; isolation: isolate; width: 1080px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; line-height: 1.5; transform-origin: 0 0 }
.p-4x5 { height: 1350px }
.p-3x4 { height: 1440px }
.p-1x1 { height: 1080px }
.p-9x16 { height: 1920px }

.pc-top { position: absolute; top: 0; left: 0; right: 0; height: 12px; border-radius: 0; z-index: 3 }
.pc-col { height: 100%; display: flex; flex-direction: column; gap: 28px; padding: 96px 80px 80px }
.pc-head { display: flex; justify-content: space-between; align-items: center; gap: 20px }
.pc-head .tag { font-size: 26px; padding: 10px 20px }
.pc-handle { font-size: 28px; font-weight: 600; color: var(--ink-soft) }
.pc-text { display: flex; flex-direction: column; gap: 28px; flex: 1 1 auto; min-width: 0 }
.pc-title { font-family: 'Fraunces', Georgia, serif; font-size: 96px; font-weight: 600; line-height: 1.02; letter-spacing: -0.01em }
.pc-sub { font-size: 38px; font-weight: 500; line-height: 1.3 }
.pc-body { font-size: 28px; color: var(--ink-soft); line-height: 1.45; white-space: pre-line }
.pc-foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap }
.pc-cta { display: inline-flex; align-items: center; padding: 22px 36px; font-size: 30px; font-weight: 700; background: var(--mustard); color: var(--ink); border: 1.5px solid var(--ink); border-radius: var(--radius); box-shadow: var(--shadow) }
.pc-tags { font-size: 24px; font-weight: 600; color: var(--ink-soft) }

/* Foto: el color de fondo es el placeholder; la imagen va como background-image (html2canvas no soporta object-fit) */
.photo { position: relative; flex: 0 0 auto; /*border: 1.5px solid var(--ink); border-radius: var(--radius); box-shadow: var(--shadow);*/ overflow: hidden; /*background: repeating-linear-gradient(45deg, var(--paper-2) 0 24px, var(--lemon) 24px 48px)*/ }
.photo .ph-img { position: absolute; inset: 0; background-size: cover; background-position: center; background-repeat: no-repeat; display: none }
.photo.has-img .ph-img { display: block }
.photo-ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center }
.photo-ph span { background: var(--white); border: 1.5px solid var(--ink); border-radius: var(--radius); padding: 12px 22px; font-size: 28px; font-weight: 600; color: var(--ink-soft) }
.photo.has-img .photo-ph { display: none }
.pc-sticker { position: absolute; left: 24px; bottom: 24px; z-index: 2; display: inline-flex; flex-direction: column; gap: 2px; background: var(--mustard); border: 1.5px solid var(--ink); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 20px }
.pc-sticker small { font-size: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em }
.pc-sticker b { font-family: 'Fraunces', Georgia, serif; font-size: 40px; font-weight: 700; line-height: 1.1 }

/* 4:5 */
.p-4x5 .photo[data-origin="template"] { height: 440px; width: 100% }

/* 3:4: foto a sangre arriba, texto abajo */
.p-3x4 .pc-col { padding: 0; gap: 0 }
.p-3x4 .photo[data-origin="template"] { width: 100%; height: 680px; border: 0; border-bottom: 1.5px solid var(--ink); border-radius: 0; box-shadow: none }
.p-3x4 .pc-text { padding: 56px 80px 80px; gap: 28px }
.p-3x4 .pc-title { font-size: 96px }

/* 1:1: foto izquierda, texto derecha */
.p-1x1 .pc-col { flex-direction: row; gap: 48px; padding: 64px }
.p-1x1 .photo[data-origin="template"] { width: 440px; height: auto }
.p-1x1 .pc-text { gap: 24px }
.p-1x1 .pc-title { font-size: 64px }
.p-1x1 .pc-sub { font-size: 30px }
.p-1x1 .pc-body { font-size: 26px }
.p-1x1 .pc-cta { font-size: 26px; padding: 18px 28px }
.p-1x1 .pc-sticker b { font-size: 32px }

/* 9:16: zona central segura (ver guía) */
.p-9x16 .pc-col { padding: 260px 80px 340px; gap: 26px }
.p-9x16 .photo[data-origin="template"] { height: 480px; width: 100% }
.p-9x16 .pc-title { font-size: 104px }

/* Guías de seguridad: solo en vista previa, se eliminan al exportar */
.guide { position: absolute; border: 2px dashed var(--ink); pointer-events: none; display: none; z-index: 4 }
.show-guides .guide { display: block }

/* Elementos arrastrables, editables y seleccionables (solo vista previa) */
:is(.piece, .pg-mini) .drag:not(.pc-sticker):not(.deco) { position: relative }
.drag { cursor: move; touch-action: pan-y pinch-zoom; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none }
@media (hover: hover) { .drag:hover { outline: calc(1.5px * var(--inv, 1)) dashed var(--ink); outline-offset: calc(6px * var(--inv, 1)) } }
.drag.editing { cursor: text; outline: calc(1.5px * var(--inv, 1)) solid var(--ink); outline-offset: calc(6px * var(--inv, 1)); -webkit-user-select: text; user-select: text }
.drag.selected { outline: calc(3px * var(--inv, 1)) solid var(--mustard); outline-offset: calc(4px * var(--inv, 1)) }
/* Con un elemento seleccionado la pieza no hace scroll: así el arrastre y el pellizco no pelean con la página */
.piece.has-sel:not(.is-editing) { touch-action: none }
.piece.is-editing .rs-box { display: none !important }
.deco > svg:not([width]) { width: 100%; height: auto; display: block }

/* ---- Layout con panel lateral ---- */
.card-body { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start }
.side { position: sticky; top: 24px; display: flex; flex-direction: column; gap: 16px }
.tabs { display: flex; gap: 4px; border-bottom: 1.5px solid var(--ink) }
.tab { flex: 1; font: inherit; font-size: .8rem; font-weight: 600; padding: 9px 2px; background: transparent; color: var(--ink-soft); border: 1.5px solid transparent; border-bottom: 0; border-radius: var(--radius) var(--radius) 0 0; cursor: pointer; margin-bottom: -1.5px }
.tab.on { background: var(--white); border-color: var(--ink); color: var(--ink) }
.pane { display: none; flex-direction: column; gap: 16px }
.pane.on { display: flex }
.side-block { background: var(--white); border: 1.5px solid var(--ink); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px }
.side h3 { font-size: 1.05rem; margin-bottom: 10px }
.side .sel-name { font-size: .9rem; color: var(--ink-soft); margin-bottom: 12px; font-weight: 600 }
.side .hint { font-size: .8rem; color: var(--ink-soft); margin-top: 10px }
.side .fld { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; font-size: .85rem; font-weight: 600 }
.side .row { display: flex; gap: 8px; align-items: center }
.side .row input[type="text"] { flex: 1; min-width: 0; font: inherit; font-size: .88rem; font-weight: 400; padding: 8px 10px; border: 1.5px solid var(--ink); border-radius: var(--radius); background: var(--white); color: var(--ink) }
.side .row input.invalid { border-style: dashed; background: var(--lemon) }
.side .row input[type="color"] { width: 44px; height: 36px; flex: 0 0 auto; border: 1.5px solid var(--ink); border-radius: var(--radius); padding: 2px; background: var(--white); cursor: pointer }
.side .row input[type="number"] { width: 72px; font: inherit; font-size: .88rem; padding: 6px 8px; border: 1.5px solid var(--ink); border-radius: var(--radius); background: var(--white); color: var(--ink) }
.side .row input[type="range"] { flex: 1; min-width: 0; accent-color: var(--ink) }
.side .row .mini { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 600 }
.side .row .mini input { width: 100%; min-width: 0; font: inherit; font-size: .88rem; padding: 6px 8px; border: 1.5px solid var(--ink); border-radius: var(--radius); background: var(--white); color: var(--ink) }
.side .chk { display: flex; gap: 8px; align-items: center; font-size: .85rem; font-weight: 600; margin-bottom: 12px }
.side .chk input { width: 16px; height: 16px; accent-color: var(--ink) }
.side button.btn-sm { width: 100%; justify-content: center }
.side .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.side input:disabled, .side button:disabled, .side .row input:disabled { opacity: .45; cursor: not-allowed }
.lib { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.lib-item { background: var(--paper); border: 1.5px solid var(--ink); border-radius: var(--radius); padding: 8px; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); font: inherit }
.lib-item:hover { background: var(--paper-2) }
.lib-prev { position: relative; height: 56px; display: flex; align-items: center; justify-content: center; overflow: hidden; pointer-events: none }
.lib-prev > * { max-width: 100% }

/* Elementos: lista con orden y menú */
.el-list { display: flex; flex-direction: column; gap: 6px }
.el-row { position: relative; display: flex; align-items: center; gap: 6px; padding: 6px 8px; border: 1.5px solid var(--ink); border-radius: var(--radius); background: var(--paper) }
.el-row.sub { margin-left: 22px; background: var(--white); padding: 5px 8px }
.el-row.on { background: var(--mustard) }
.el-row .nm { flex: 1; min-width: 0; font-size: .85rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer }
.el-row .ib { width: 28px; height: 28px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; padding: 0; border: 1.5px solid var(--ink); border-radius: 6px; background: var(--white); color: var(--ink); cursor: pointer; font-size: .7rem }
.el-row .ib:disabled { opacity: .35; cursor: not-allowed }
.el-menu { position: absolute; right: 6px; top: 38px; z-index: 20; display: none; flex-direction: column; min-width: 160px; padding: 4px; background: var(--white); border: 1.5px solid var(--ink); border-radius: var(--radius); box-shadow: var(--shadow) }
.el-menu.open { display: flex }
.el-menu button { text-align: left; background: none; border: 0; padding: 8px 10px; font: inherit; font-size: .88rem; color: var(--ink); cursor: pointer; border-radius: 6px }
.el-menu button:hover { background: var(--paper-2) }
.el-menu button:disabled { opacity: .4; cursor: not-allowed }

/* Tiradores de tamaño (solo vista previa) */
.rs-box { position: absolute; display: none; pointer-events: none; z-index: 9000; border: calc(2px * var(--inv, 1)) solid var(--ink); box-shadow: 0 0 0 calc(1.5px * var(--inv, 1)) var(--mustard) }
.rs-box.on { display: block }
.rs-h { --hit: 18px; --dot: 10px; position: absolute; display: flex; align-items: center; justify-content: center; width: calc(var(--hit) * var(--inv, 1)); height: calc(var(--hit) * var(--inv, 1)); margin: calc(var(--hit) * var(--inv, 1) / -2) 0 0 calc(var(--hit) * var(--inv, 1) / -2); pointer-events: auto; touch-action: none }
.rs-h::before { content: ""; box-sizing: border-box; width: calc(var(--dot) * var(--inv, 1)); height: calc(var(--dot) * var(--inv, 1)); background: var(--white); border: calc(2px * var(--inv, 1)) solid var(--ink); border-radius: calc(4px * var(--inv, 1)) }
@media (pointer: coarse) {
  .rs-h { --hit: 34px; --dot: 13px }
  .rs-h[data-h="n"], .rs-h[data-h="s"], .rs-h[data-h="e"], .rs-h[data-h="w"] { display: none }
}

/* Ícono de mover: va FUERA del elemento (arriba, centrado) para poder agarrarlo aunque el elemento sea chico y los tiradores lo tapen. Discreto: chico y translúcido; el área de toque es mayor que lo que se ve */
.rs-mv { --mv: 22px; --gap: 16px; position: absolute; left: 50%; top: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box; width: calc(var(--mv) * var(--inv, 1)); height: calc(var(--mv) * var(--inv, 1)); margin: calc((var(--mv) + var(--gap)) * var(--inv, 1) * -1) 0 0 calc(var(--mv) * var(--inv, 1) / -2); pointer-events: auto; touch-action: none; cursor: grab; background: rgba(20, 18, 16, .5); border-radius: 50%; box-shadow: 0 0 0 calc(1px * var(--inv, 1)) rgba(255, 255, 255, .6); opacity: .8; transition: opacity .12s }
.rs-mv::after { content: ""; position: absolute; inset: calc(-6px * var(--inv, 1)); border-radius: 50% }
.rs-mv:hover, .rs-mv:active { opacity: 1 }
.rs-mv:active { cursor: grabbing }
.rs-mv svg { width: 58%; height: 58%; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none }
.rs-mv.below { top: 100%; margin-top: calc(var(--gap) * var(--inv, 1)) }
.rs-mv.inside { top: 50%; margin-top: calc(var(--mv) * var(--inv, 1) / -2) }
@media (pointer: coarse) { .rs-mv { --mv: 30px; --gap: 25px } .rs-mv::after { inset: calc(-7px * var(--inv, 1)) } }

/* Menú contextual (solo vista previa) */
.ctx-menu { position: fixed; z-index: 10000; display: none; flex-direction: column; min-width: 190px; padding: 4px; background: var(--white); border: 1.5px solid var(--ink); border-radius: var(--radius); box-shadow: var(--shadow) }
.ctx-menu.open { display: flex }
.ctx-menu button { text-align: left; background: none; border: 0; padding: 9px 12px; font: inherit; font-size: .9rem; color: var(--ink); cursor: pointer; border-radius: 6px }
.ctx-menu button:hover { background: var(--paper-2) }
.ctx-menu button:disabled { opacity: .4; cursor: not-allowed }
.ctx-menu hr { border: 0; border-top: 1px solid var(--ink); margin: 4px 0 }

/* ---- Móvil: formatos, hoja inferior, avisos ---- */
.fmt-bar, .sheet-bar, .card-actions .m-edit { display: none }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 10002; display: none; align-items: center; gap: 14px; max-width: calc(100% - 24px); padding: 12px 16px; background: var(--ink); color: var(--paper); border-radius: var(--radius); font-size: .92rem; font-weight: 600; box-shadow: var(--shadow) }
.toast.on { display: flex }
.toast button { flex: 0 0 auto; min-height: 40px; padding: 8px 12px; font: inherit; font-weight: 700; color: var(--ink); background: var(--mustard); border: 1.5px solid var(--ink); border-radius: 6px; cursor: pointer }
body.has-sheet .toast { bottom: calc(150px + env(safe-area-inset-bottom, 0px)) }
#busy { position: fixed; inset: 0; z-index: 10001; display: none; align-items: center; justify-content: center; background: var(--paper); font-weight: 700; font-size: 1.05rem }
#busy.on { display: flex }
.result { position: fixed; inset: 0; z-index: 10004; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(20, 18, 16, .7) }
.result.on { display: flex }
.result-card { width: min(420px, 100%); max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 16px; background: var(--white); border: 1.5px solid var(--ink); border-radius: var(--radius); box-shadow: var(--shadow) }
.result-card h3 { font-size: 1.2rem }
.result-card img { max-width: 100%; max-height: 50vh; width: auto; height: auto; margin: 0 auto; border: 1.5px solid var(--ink); border-radius: 6px; -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto }
.result-card .hint { font-size: .85rem; color: var(--ink-soft) }
.result-card .btn { width: 100%; justify-content: center; min-height: 48px }

/* Pantallas táctiles: zonas de toque de 44 px y campos de 16 px (evita el zoom automático de iOS al enfocar) */
@media (pointer: coarse) {
  .btn-sm, .toggle { min-height: 44px }
  .toggle input, .side .chk input { width: 22px; height: 22px }
  .tab { min-height: 44px; font-size: .8rem }
  .side .row input[type="text"], .side .row input[type="number"], .side .row .mini input { font-size: 16px; min-height: 44px }
  .side .row input[type="color"] { width: 52px; height: 44px }
  .side .row input[type="range"] { min-height: 32px }
  .el-row { min-height: 52px }
  .el-row .ib { width: 44px; height: 44px }
  .el-row .nm { font-size: .92rem }
  .el-menu { top: 52px }
  .el-menu button, .ctx-menu button { min-height: 44px }
  .lib-item { min-height: 64px }
}

/* Pantallas angostas: una pieza a la vez + hoja inferior para editar */
@media (max-width: 900px) {
  .page { padding: 16px 12px calc(32px + env(safe-area-inset-bottom, 0px)) }
  body.has-sheet .page { padding-bottom: calc(170px + env(safe-area-inset-bottom, 0px)) }
  body.sheet-expanded .page { padding-bottom: 66vh }
  .page-head h1 { font-size: 1.7rem }
  .page-head p { font-size: .9rem; margin-top: 8px }
  .toolbar { margin: 14px 0; padding: 4px 14px; gap: 0 20px }
  .fmt-bar { display: flex; position: sticky; top: 0; z-index: 60; gap: 6px; margin: 0 -12px 14px; padding: 8px 12px; background: var(--paper); border-bottom: 1.5px solid var(--ink) }
  .fmt-bar button { flex: 1; min-height: 44px; font: inherit; font-size: .9rem; font-weight: 700; color: var(--ink); background: var(--white); border: 1.5px solid var(--ink); border-radius: var(--radius); cursor: pointer }
  .fmt-bar button.on { background: var(--mustard); box-shadow: 2px 2px 0 var(--ink) }
  .card { display: none; flex-direction: column; margin-bottom: 24px }
  .card.current { display: flex }
  .card-head { display: contents }
  .card-meta { order: 1; margin-bottom: 10px }
  .card-body { order: 2; display: block }
  .card-actions { order: 3; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px }
  .card-actions .btn { width: 100%; justify-content: center; min-height: 48px }
  .card-actions .m-edit { display: inline-flex }
  .card-actions .m-add { grid-column: 1 / -1; order: -1 }

  /* Hoja inferior */
  .side { position: fixed; left: 0; right: 0; top: auto; bottom: 0; z-index: 9500; display: none; gap: 0; max-height: 62vh; max-height: 62dvh; background: var(--paper); border-top: 1.5px solid var(--ink); border-radius: 14px 14px 0 0; box-shadow: 0 -3px 0 var(--ink); padding-bottom: env(safe-area-inset-bottom, 0px) }
  .side.sheet-on { display: flex }
  body.editing .side { display: none !important }
  .sheet-bar { display: block; flex: 0 0 auto; padding: 0 12px 10px }
  .sb-grab { display: block; width: 100%; height: 24px; padding: 0; background: none; border: 0; cursor: pointer }
  .sb-grab span { display: block; width: 44px; height: 5px; margin: 9px auto 0; border-radius: 99px; background: var(--ink); opacity: .35 }
  .sb-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px }
  .sb-name { flex: 1; min-width: 0; font-weight: 700; font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .sb-x { flex: 0 0 auto; width: 44px; height: 44px; margin: -8px -10px -8px 0; font-size: 1.1rem; color: var(--ink); background: none; border: 0; cursor: pointer }
  .sb-actions { display: flex; gap: 6px }
  .sb-actions button { flex: 1 1 0; min-width: 0; min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px 2px; font: inherit; font-size: .68rem; font-weight: 700; color: var(--ink); background: var(--white); border: 1.5px solid var(--ink); border-radius: var(--radius); cursor: pointer }
  .sb-actions button:disabled { opacity: .4; cursor: not-allowed }
  .sb-actions svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
  .side:not(.sheet-open) .tabs, .side:not(.sheet-open) .pane { display: none !important }
  .side .tabs { flex: 0 0 auto; margin: 0 12px }
  .side .pane { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 12px }
  .side-block { box-shadow: none }
}

/* ---- Barra de texto (táctil): el texto se edita acá, no dentro de la pieza ---- */
.text-bar { position: fixed; left: 0; right: 0; top: 0; z-index: 10003; display: none; gap: 10px; align-items: flex-end; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; background: var(--paper); border-bottom: 1.5px solid var(--ink); box-shadow: 0 3px 0 var(--ink) }
.text-bar.on { display: flex }
.text-bar textarea { flex: 1; min-width: 0; min-height: 44px; max-height: 30vh; resize: none; font: inherit; font-size: 16px; line-height: 1.4; padding: 10px 12px; color: var(--ink); background: var(--white); border: 1.5px solid var(--ink); border-radius: var(--radius) }
.text-bar .btn { flex: 0 0 auto; min-height: 44px }

/* ---- Deshacer / rehacer ---- */
.btn svg.hi, .fmt-bar .hb svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: 2px 2px 0 var(--ink) }
.fmt-bar .hb { flex: 0 0 44px; padding: 0; display: flex; align-items: center; justify-content: center }
.fmt-bar .hb svg { width: 22px; height: 22px }
.fmt-bar .hb:disabled { opacity: .35; box-shadow: none; cursor: not-allowed }
.fmt-bar .fmt-sep { flex: 0 0 1.5px; background: var(--ink); opacity: .25; margin: 4px 2px }
@media (max-width: 900px) { .card-actions .h-undo, .card-actions .h-redo { display: none } }

/* ---- Guías de alineación (solo vista previa) ---- */
.snap-layer { position: absolute; inset: 0; z-index: 9100; pointer-events: none }
.sg { position: absolute; background: #e81111 }
.sg.v { width: calc(1.5px * var(--inv, 1)); margin-left: calc(-0.75px * var(--inv, 1)) }
.sg.h { height: calc(1.5px * var(--inv, 1)); margin-top: calc(-0.75px * var(--inv, 1)) }

/* Los textos respetan los saltos de línea que se escriben con Enter */
:is(.piece, .pg-mini) [data-f] { white-space: pre-line }

/* ---- Proyecto: barra, estado y diálogo ---- */
.projbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 24px 0 0 }
.proj-name { flex: 1 1 240px; min-width: 0; font: inherit; font-size: 16px; font-weight: 600; padding: 10px 12px; color: var(--ink); background: var(--white); border: 1.5px solid var(--ink); border-radius: var(--radius) }
.save-status { font-size: .85rem; font-weight: 600; color: var(--ink-soft) }
.save-status.warn { color: var(--ink); background: var(--lemon); padding: 2px 8px; border: 1.5px solid var(--ink); border-radius: var(--radius) }
.save-status.err { color: #e81111 }
.dlg { position: fixed; inset: 0; z-index: 10005; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(20, 18, 16, .7) }
.dlg.on { display: flex }
.dlg-card { width: min(560px, 100%); max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 16px; background: var(--white); border: 1.5px solid var(--ink); border-radius: var(--radius); box-shadow: var(--shadow) }
.dlg-head { display: flex; justify-content: space-between; align-items: center; gap: 12px }
.dlg-foot { display: flex; flex-wrap: wrap; gap: 8px }
.proj-list { display: flex; flex-direction: column; gap: 8px }
.proj-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 10px; background: var(--paper); border: 1.5px solid var(--ink); border-radius: var(--radius) }
.proj-row.cur { background: var(--lemon) }
.proj-info { display: flex; flex-direction: column; min-width: 0 }
.proj-info small { color: var(--ink-soft) }
.proj-acts { display: flex; gap: 6px; flex-wrap: wrap }
.dlg .hint { font-size: .85rem; color: var(--ink-soft) }

/* ---- Texto: botones de alineación ---- */
.seg { display: flex; gap: 6px }
.seg-b { flex: 1; min-height: 40px; display: flex; align-items: center; justify-content: center; padding: 0; color: var(--ink); background: var(--white); border: 1.5px solid var(--ink); border-radius: var(--radius); cursor: pointer }
.seg-b svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round }
.seg-b.on { background: var(--mustard); box-shadow: 2px 2px 0 var(--ink) }
.seg-b:disabled { opacity: .4; cursor: not-allowed }
@media (pointer: coarse) { .seg-b { min-height: 48px } }

/* ---- Añadir elementos ---- */
.add-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.add-item { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 10px; font: inherit; font-size: .85rem; font-weight: 600; text-align: left; color: var(--ink); background: var(--white); border: 1.5px solid var(--ink); border-radius: var(--radius); box-shadow: 2px 2px 0 var(--ink); cursor: pointer }
.add-item svg { width: 22px; height: 22px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.add-item .gl { flex: 0 0 22px; width: 22px; text-align: center; font-family: 'Fraunces', Georgia, serif; font-size: 1.15rem; font-weight: 700; line-height: 1 }
.add-item:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink) }

/* ---- Fotos: los tiradores de los lados ajustan el marco (también en táctil) ---- */
.rs-box.is-photo .rs-h[data-h="n"], .rs-box.is-photo .rs-h[data-h="s"], .rs-box.is-photo .rs-h[data-h="e"], .rs-box.is-photo .rs-h[data-h="w"] { display: flex }

/* ---- Exportación ---- */
#export-host { position: fixed; inset: 0; background: rgba(20, 18, 16, .55); display: none; z-index: 9999; overflow: auto }
#export-host.on { display: block }
#export-host .piece { position: absolute; left: 0; top: 0 }

/* ================= REDISEÑO DE MAQUETACIÓN (solo UI) ================= */
.page { padding-top: 20px }
.appbar { position: sticky; top: 0; z-index: 70; display: flex; align-items: center; gap: 4px; padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px; background: var(--paper); border-bottom: 1.5px solid var(--ink) }
.appbar .sp { flex: 1 }
.ab-btn { width: 44px; height: 44px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; padding: 0; color: var(--ink); background: transparent; border: 1.5px solid transparent; border-radius: var(--radius); cursor: pointer }
.ab-btn:hover { background: var(--paper-2) }

.proj-menu { position: absolute; right: 12px; top: calc(100% + 6px); z-index: 80; display: none; flex-direction: column; gap: 16px; width: min(340px, calc(100vw - 24px)); max-height: calc(100vh - 90px); max-height: calc(100dvh - 90px); overflow-y: auto; padding: 14px; background: var(--white); border: 1.5px solid var(--ink); border-radius: var(--radius); box-shadow: var(--shadow) }

.proj-menu .btn { width: 100%; justify-content: center }
.proj-menu .fmt-bar { display: flex; position: static; gap: 6px; margin: 0; padding: 0; border: 0; background: none }
.proj-menu .fmt-bar button { flex: 1; min-height: 40px; font: inherit; font-weight: 700; color: var(--ink); background: var(--white); border: 1.5px solid var(--ink); border-radius: var(--radius); cursor: pointer }
.proj-menu .fmt-bar button.on { background: var(--mustard); box-shadow: 2px 2px 0 var(--ink) }

/* Una pieza a la vez en todos los tamaños; acciones: + Añadir · Subir foto · Ajustes */
.card { display: none; margin-bottom: 24px }
.card.current { display: block }
.card .card-head { display: block; margin: 0 0 14px }
.card .card-meta, .card .card-actions .h-undo, .card .card-actions .h-redo, .card .card-actions [data-jpg], .card .card-actions [data-svg] { display: none }
.card .card-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; max-width: 560px; margin: 0 }
.card .card-actions .btn { width: 100%; justify-content: center; min-height: 44px; white-space: nowrap }
.card .card-actions .m-add { order: 1; grid-column: auto }
.card .card-actions > label.btn { order: 2 }
.card .card-actions .m-edit { order: 3; display: inline-flex }

/* Proyectos: menú lateral (el diálogo existente, convertido en panel) */
.dlg { padding: 0; justify-content: flex-start; align-items: stretch; background: rgba(20, 18, 16, .5) }
.dlg-card { width: min(340px, 86vw); height: 100%; max-height: none; border-width: 0 1.5px 0 0; border-radius: 0; box-shadow: none; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)) }
.dlg.on .dlg-card { animation: drawer-in .2s ease }
@keyframes drawer-in { from { transform: translateX(-100%) } }
.dlg .proj-list { flex: 1 1 auto; overflow-y: auto }
.dlg .dlg-foot .btn { flex: 1 1 100% }

/* ================= TEMA DE LA INTERFAZ (herramienta) =================
   Los tokens del diseño (:root --paper, --mustard, --ink, Fraunces…) quedan intactos y
   solo los usan las piezas. La interfaz usa --ui-* y remapea los nombres heredados
   únicamente dentro de sus contenedores. */
:root {
  --ui-bg: #111215; --ui-surface: #1a1c21; --ui-raised: #23262d; --ui-line: #343842;
  --ui-text: #e9ebef; --ui-muted: #9aa1ae; --ui-accent: #7280ff; --ui-accent-soft: #2a2f55;
  --ui-radius: 10px; --ui-pop: 0 10px 30px rgba(0, 0, 0, .45);
}
@media (prefers-color-scheme: light) {
  :root {
    --ui-bg: #eceef2; --ui-surface: #ffffff; --ui-raised: #f3f4f7; --ui-line: #d8dbe2;
    --ui-text: #15171c; --ui-muted: #5d6573; --ui-accent: #4352d9; --ui-accent-soft: #e3e6ff;
    --ui-pop: 0 10px 30px rgba(20, 24, 40, .18);
  }
}
body { background: var(--ui-bg); color: var(--ui-text) }
.appbar, .proj-menu, .side, .dlg, .toast, .text-bar, .result, #busy, .card-actions {
  --paper: var(--ui-surface); --paper-2: var(--ui-raised); --white: var(--ui-raised);
  --ink: var(--ui-text); --ink-soft: var(--ui-muted);
  --mustard: var(--ui-accent); --lemon: var(--ui-accent-soft);
  --radius: var(--ui-radius); --shadow: none; --shadow-sm: none;
  color-scheme: dark; font-family: 'Inter', system-ui, sans-serif;
}
@media (prefers-color-scheme: light) { .appbar, .proj-menu, .side, .dlg, .toast, .text-bar, .result, #busy, .card-actions { color-scheme: light } }
:is(.appbar, .proj-menu, .side, .dlg, .toast, .text-bar, .result, #busy, .card-actions) * { border-color: var(--ui-line) }
:is(.appbar, .proj-menu, .side, .dlg, .toast, .text-bar, .result, #busy, .card-actions) :is(button, .btn, .add-item, .seg-b, .tab) { box-shadow: none; transform: none; font-weight: 600 }
:is(.appbar, .proj-menu, .side, .dlg, .toast, .text-bar, .result, #busy, .card-actions) .btn:hover { background: var(--ui-raised); transform: none; box-shadow: none }
:is(.appbar, .proj-menu, .side, .dlg, .toast, .text-bar, .result, #busy, .card-actions) .btn-mustard, :is(.appbar, .proj-menu, .side, .dlg, .toast, .text-bar, .result, #busy, .card-actions) .btn-mustard:hover { background: var(--ui-accent); border-color: var(--ui-accent); color: #fff }
:is(.appbar, .proj-menu, .side, .dlg, .toast, .text-bar, .result, #busy, .card-actions) .btn-ghost { border-color: transparent }
:is(.appbar, .proj-menu, .side, .dlg, .toast, .text-bar, .result, #busy, .card-actions) :is(h1, h2, h3) { font-family: inherit; font-weight: 650; letter-spacing: 0 }
:is(.appbar, .proj-menu, .side, .dlg, .toast, .text-bar, .result, #busy, .card-actions) .side h3 { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--ui-muted) }
:is(.appbar, .proj-menu, .side, .dlg, .toast, .text-bar, .result, #busy, .card-actions) .toggle input { accent-color: var(--ui-accent) }
:is(.appbar, .proj-menu, .side, .dlg, .toast, .text-bar, .result, #busy, .card-actions) :focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 2px }
:is(.appbar, .proj-menu, .side, .dlg, .toast, .text-bar, .result, #busy, .card-actions) .tab.on { border-color: var(--ui-line); border-bottom-color: var(--ui-surface); background: var(--ui-surface) }
:is(.appbar, .proj-menu, .side, .dlg, .toast, .text-bar, .result, #busy, .card-actions) :is(.seg-b.on, .fmt-bar button.on, .el-row.on) { background: var(--ui-accent-soft); border-color: var(--ui-accent); color: var(--ui-text); box-shadow: none }
.side-block, .proj-menu, .dlg-card, .result-card { box-shadow: none }
.proj-menu { box-shadow: var(--ui-pop) }
.appbar { background: var(--ui-surface); border-bottom: 1px solid var(--ui-line) }
.ab-btn[aria-expanded="true"] { background: var(--ui-accent-soft); border-color: var(--ui-accent) }
.stage { background: var(--ui-surface); border: 1px solid var(--ui-line); border-radius: var(--ui-radius) }
.toast { background: var(--ui-text); color: var(--ui-bg); box-shadow: var(--ui-pop) }
.toast button { background: var(--ui-accent); color: #fff; border-color: transparent }

/* ================= COMPACTACIÓN DE ESPACIADO ================= */

/* ================= BARRA INFERIOR CONTEXTUAL (reemplaza el panel) ================= */
.card-body { display: block }
.card .card-head { display: none }
.side { position: fixed; left: 0; right: 0; top: auto; bottom: 0; z-index: 9500; display: none; flex-direction: column; gap: 0; max-height: none; padding: 0 0 env(safe-area-inset-bottom, 0px); background: var(--ui-surface); border: 0; border-top: 1px solid var(--ui-line); border-radius: 0; box-shadow: 0 -6px 20px rgba(0, 0, 0, .22) }

.dock { display: flex; flex-direction: column; width: 100%; max-width: 760px; margin: 0 auto }

.subtabs button.on { color: var(--ui-accent); background: var(--ui-accent-soft); border-color: var(--ui-accent) }
.sub { display: none }
.sub.on { display: block }
.dock-tools { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding: 4px 6px }
.dock-tools::-webkit-scrollbar { display: none }
.dock-tools button { flex: 0 0 auto; min-width: 60px; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px 6px; font: inherit; font-size: .66rem; font-weight: 600; white-space: nowrap; color: var(--ui-muted); background: transparent; border: 0; border-radius: var(--ui-radius); cursor: pointer }

.toast, body.has-sheet .toast { bottom: calc(var(--dock-h, 72px) + 12px) }

/* ---- Principio: cada panel = una sola fila (scroll horizontal si no cabe) ---- */

<script>
/* Tipografía con Google Fonts (API CSS2): lista + búsqueda, carga bajo demanda, formato (negrita, cursiva…) */
window.IGFont = (function () {
  const F = [['Inter','Sans'],['Poppins','Sans'],['Montserrat','Sans'],['Roboto','Sans'],['Open Sans','Sans'],['Lato','Sans'],['Nunito','Sans'],['Raleway','Sans'],['Work Sans','Sans'],['DM Sans','Sans'],['Manrope','Sans'],['Outfit','Sans'],['Plus Jakarta Sans','Sans'],['Rubik','Sans'],['Barlow','Sans'],['Space Grotesk','Sans'],['Sora','Sans'],['Urbanist','Sans'],
    ['Fraunces','Serif'],['Playfair Display','Serif'],['Merriweather','Serif'],['Lora','Serif'],['DM Serif Display','Serif'],['Cormorant Garamond','Serif'],['Libre Baskerville','Serif'],['EB Garamond','Serif'],['Bitter','Serif'],['Crimson Text','Serif'],['Abril Fatface','Serif'],
    ['Bebas Neue','Display'],['Anton','Display'],['Oswald','Display'],['Lobster','Display'],['Righteous','Display'],['Archivo Black','Display'],['Alfa Slab One','Display'],['Bungee','Display'],['Fredoka','Display'],['Baloo 2','Display'],['Chewy','Display'],['Permanent Marker','Display'],['Monoton','Display'],['Rubik Mono One','Display'],['Staatliches','Display'],['Unbounded','Display'],
    ['Pacifico','Manuscrita'],['Dancing Script','Manuscrita'],['Caveat','Manuscrita'],['Satisfy','Manuscrita'],['Great Vibes','Manuscrita'],['Shadows Into Light','Manuscrita'],['Indie Flower','Manuscrita'],['Amatic SC','Manuscrita'],['Sacramento','Manuscrita'],['Kalam','Manuscrita'],['Courgette','Manuscrita'],
    ['Space Mono','Mono'],['JetBrains Mono','Mono'],['IBM Plex Mono','Mono'],['Roboto Mono','Mono'],['Fira Code','Mono'],['Courier Prime','Mono']];
  const CATS = ['Todas','Sans','Serif','Display','Manuscrita','Mono'];
  const FB = { Sans: 'sans-serif', Serif: 'serif', Display: 'sans-serif', Manuscrita: 'cursive', Mono: 'monospace' };
  const cat = n => (F.find(f => f[0] === n) || [0, 'Sans'])[1];
  const stack = n => "'" + n + "', " + FB[cat(n)];
  const cssFam = el => (getComputedStyle(el).fontFamily || '').split(',')[0].replace(/["']/g, '').trim();
  const famOf = el => (el.style.fontFamily || '').split(',')[0].replace(/["']/g, '').trim();
  const esc = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const title = t => t.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
  const sel = () => (typeof selected !== 'undefined' && selected && selected.dataset && selected.dataset.f) ? selected : null;
  const after = () => { try { updateBox(); } catch (_) {} try { fitPreviews(); } catch (_) {} };
  const inst = [];
  const sync = () => inst.forEach(f => f());

  /* Carga de la familia completa (con cursiva y negrita si existen). Devuelve 0/1/2 (variantes) o -1 si no existe. */
  const loaded = {};
  function ensure(name) {
    if (!name || !/^[A-Za-z0-9 ]{1,60}$/.test(name)) return Promise.resolve(-1);
    if (loaded[name]) return loaded[name];
    const fam = 'family=' + name.trim().replace(/ /g, '+');
    const tries = [fam + ':ital,wght@0,400;0,700;1,400;1,700', fam + ':wght@400;700', fam];
    return (loaded[name] = (async () => {
      for (let i = 0; i < tries.length; i++) {
        const ok = await new Promise(res => {
          const l = document.createElement('link');
          l.rel = 'stylesheet'; l.dataset.igfont = name;
          l.href = 'https://fonts.googleapis.com/css2?' + tries[i] + '&display=swap';
          l.onload = () => res(true);
          l.onerror = () => { l.remove(); res(false); };
          document.head.appendChild(l);
        });
        if (ok) {
          try { fontCssText = null; } catch (_) {}      // la exportación vuelve a leer las hojas de Google Fonts
          try { await document.fonts.load('16px "' + name + '"'); } catch (_) {}
          return i;
        }
      }
      delete loaded[name];
      return -1;
    })());
  }

  /* Vistas previas: el nombre de cada fuente escrito en su propia fuente (solo las letras necesarias; familia renombrada "pv …") */
  let pv = false;
  function previews() {
    if (pv) return;
    pv = true;
    const names = F.map(f => f[0]), txt = [...new Set(names.join('').split(''))].join('');
    for (let i = 0; i < names.length; i += 15) {
      const u = 'https://fonts.googleapis.com/css2?' + names.slice(i, i + 15).map(n => 'family=' + n.replace(/ /g, '+')).join('&') + '&text=' + encodeURIComponent(txt) + '&display=swap';
      fetch(u).then(r => r.ok ? r.text() : '').then(css => {
        if (!css) return;
        const st = document.createElement('style');
        st.textContent = css.replace(/font-family:\s*'([^']+)'/g, "font-family:'pv $1'");
        document.head.appendChild(st);
      }).catch(() => {});
    }
  }
  document.addEventListener('click', e => { if (e.target.closest && e.target.closest('[data-t="font"]')) previews(); });

  const FM = [
    ['bold', 'Negrita', '<path d="M7 5h6a3.5 3.5 0 0 1 0 7H7zM7 12h7a3.5 3.5 0 0 1 0 7H7z"/>'],
    ['italic', 'Cursiva', '<path d="M10 5h8M6 19h8M14 5l-4 14"/>'],
    ['underline', 'Subrayado', '<path d="M7 4v7a5 5 0 0 0 10 0V4M5 20h14"/>'],
    ['strike', 'Tachado', '<path d="M4 12h16M16 7.5C15.5 5.7 14 5 12 5c-2.2 0-4 1-4 3M8.3 16.2c.5 1.9 2.1 2.8 4.3 2.8 2.2 0 4-1 4-3"/>'],
    ['upper', 'Mayúsculas', '<path d="M4 7V5h10v2M9 5v14M17 11V9h5v2M19.5 9v10"/>']
  ];
  const flags = el => {
    const cs = getComputedStyle(el), dl = cs.textDecorationLine || cs.textDecoration || '';
    return { bold: parseInt(cs.fontWeight, 10) >= 600, italic: cs.fontStyle === 'italic', underline: /underline/.test(dl), strike: /line-through/.test(dl), upper: cs.textTransform === 'uppercase' };
  };

  function panel(kind) {
    const d = document.createElement('div');
    if (kind === 'format') {
      d.className = 'seg ff-fmt';
      d.innerHTML = FM.map(f => '<button type="button" class="seg-b has-t" data-fm="' + f[0] + '" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true">' + f[2] + '</svg><span class="ib-t">' + f[1] + '</span></button>').join('');
      const mark = () => { const el = sel(), fl = el ? flags(el) : {}; d.querySelectorAll('[data-fm]').forEach(b => { const on = !!fl[b.dataset.fm]; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }); };
      d.addEventListener('click', e => {
        const b = e.target.closest('[data-fm]'), el = sel();
        if (!b || !el) return;
        const k = b.dataset.fm, fl = flags(el), on = !fl[k], z = el.style;
        if (k === 'bold') z.fontWeight = on ? '700' : '400';
        else if (k === 'italic') z.fontStyle = on ? 'italic' : 'normal';
        else if (k === 'upper') z.textTransform = on ? 'uppercase' : 'none';
        else {
          const u = k === 'underline' ? on : fl.underline, l = k === 'strike' ? on : fl.strike;
          z.textDecoration = [u && 'underline', l && 'line-through'].filter(Boolean).join(' ') || 'none';
        }
        after(); sync();
      });
      inst.push(mark); mark();
      return d;
    }
    let q = '', c = 'Todas';
    d.className = 'ff-wrap';
    d.innerHTML = '<div class="ff-head"><input class="ff-q" type="search" placeholder="Buscar en Google Fonts…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Buscar fuente">' +
      '<div class="subtabs">' + CATS.map(x => '<button type="button" data-c="' + x + '">' + x + '</button>').join('') + '</div></div><div class="ff-list" role="listbox" aria-label="Fuentes"></div>';
    const list = d.querySelector('.ff-list');
    const row = (n, label, sub, ext) => '<button type="button" role="option" class="ff-i" data-ff="' + esc(n) + '"' + (ext ? ' data-ext="1"' : '') + '><span class="ff-n"' +
      (n && !ext ? ' style="font-family:\'pv ' + esc(n) + '\',\'' + esc(n) + '\',' + FB[cat(n)] + '"' : '') + '>' + esc(label) + '</span>' + (ext ? '<small>' + sub + '</small>' : '') + '</button>';
    let extra = '';
    const mark = () => {
      const el = sel(), cur = el ? cssFam(el) : '', want = cur && !F.some(f => f[0] === cur) ? cur : '';
      if (want !== extra) return render();      // la fuente en uso no está en la lista: se muestra arriba, seleccionada
      list.querySelectorAll('.ff-i').forEach(b => { const on = !b.dataset.ext && b.dataset.ff === cur; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
      d.querySelectorAll('[data-c]').forEach(b => b.classList.toggle('on', b.dataset.c === c));
    };
    const render = () => {
      const k = q.trim().toLowerCase(), rows = F.filter(f => (c === 'Todas' || f[1] === c) && f[0].toLowerCase().includes(k));
      const el = sel(), cur = el ? cssFam(el) : '';
      extra = cur && !F.some(f => f[0] === cur) ? cur : '';
      let h = extra && !k && c === 'Todas' ? row(extra, extra, '') : '';
      h += rows.map(f => row(f[0], f[0], f[1])).join('');
      if (k && /^[A-Za-z0-9 ]{1,60}$/.test(q.trim()) && !F.some(f => f[0].toLowerCase() === k)) h += row(title(q.trim()), 'Usar «' + title(q.trim()) + '» de Google Fonts', 'Buscar', true);
      list.innerHTML = h || '<p class="ff-empty">Sin resultados</p>';
      mark();
    };
    d.querySelector('.ff-q').addEventListener('input', e => { q = e.target.value; render(); });
    d.addEventListener('click', e => {
      const t = e.target.closest('[data-c]');
      if (t) { c = t.dataset.c; return render(); }
      const b = e.target.closest('.ff-i'), el = sel();
      if (!b || !el) return;
      const n = b.dataset.ff;
      el.style.fontFamily = n ? stack(n) : '';
      if (n) ensure(n).then(r => { if (r < 0) { el.style.fontFamily = ''; let sm = b.querySelector('small'); if (!sm) { sm = document.createElement('small'); b.appendChild(sm); } sm.textContent = 'No encontrada'; } after(); sync(); });
      after(); sync();
    });
    inst.push(mark); render();
    return d;
  }
  return { panel, sync, ensure, stack };
})();

<script>
/* ============================================================
   CONTENIDO: editá estos valores. Son placeholders, no datos reales.
   ============================================================ */
const CONTENT = {
  eyebrow:   'Categoría',
  title:     'Título principal de la pieza',
  subtitle:  'Subtítulo que complementa el título en una o dos líneas.',
  body:      'Texto de cuerpo breve. Reemplazalo por tu contenido final.',
  cta:       'Llamado a la acción →',
  handle:    '@tuhandle',
  hashtags:  '#hashtag1 #hashtag2',
  datoLabel: 'Dato',
  datoValor: '[DATO]'
};

/* Tamaños nativos de cada pieza */
const FORMATS = {
  'post-4x5':  { w: 1080, h: 1350 },
  'post-3x4':  { w: 1080, h: 1440 },
  'post-1x1':  { w: 1080, h: 1080 },
  'post-9x16': { w: 1080, h: 1920 }
};

/* Detección de dispositivo */
const mqNarrow = window.matchMedia('(max-width: 900px)');
const mqCoarse = window.matchMedia('(pointer: coarse)');
const isNarrow = () => mqNarrow.matches;
const isTouch = () => mqCoarse.matches;
const onMq = (mq, fn) => (mq.addEventListener ? mq.addEventListener('change', fn) : mq.addListener(fn));

/* Nombres legibles para los textos */
const LABELS = {
  eyebrow: 'Etiqueta', handle: 'Handle', title: 'Título', subtitle: 'Subtítulo',
  body: 'Texto', cta: 'Botón / CTA', hashtags: 'Hashtags', datoLabel: 'Dato', datoValor: 'Dato'
};

/* Rellena los textos */
function fillContent() {
  document.querySelectorAll('[data-f]').forEach(el => {
    el.textContent = CONTENT[el.dataset.f] ?? '';
  });
}

/* Escala cada pieza para que quepa en pantalla (solo vista previa) */
/* Alto disponible para ver la página completa entre la barra superior, el carrusel y la barra inferior */
function availH() {
  const ab = document.querySelector('.appbar');
  const pg = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--pg-h')) || 0;
  return Math.max(240, window.innerHeight - (ab ? ab.offsetHeight : 56) - pg - (isNarrow() ? 76 : 0) - 32);
}

function fitPreviews() {
  const narrow = isNarrow();
  const maxH = window.innerHeight * 0.85;
  document.querySelectorAll('.card').forEach(card => {
    const stage = card.querySelector('.stage');
    if (!stage.clientWidth) return;                         // tarjeta oculta (móvil: una a la vez)
    const piece = stage.querySelector('.piece');
    const h = piece.offsetHeight;
    // En móvil se ajusta solo al ancho: el alto de la ventana cambia al scrollear (barras del navegador)
    const s0 = Math.min(1, stage.clientWidth / 1080, availH() / h);
    const z = Math.max(1, parseFloat(piece.dataset.vz) || 1), s = s0 * z;      // z = zoom de la vista (pellizco / Shift+rueda)
    const sw = stage.clientWidth, sh = h * s0, W = 1080 * s, H = h * s, ml = Math.max(0, (sw - W) / 2);
    const tx = z > 1 ? Math.min(0, Math.max(parseFloat(piece.dataset.vx) || 0, Math.min(0, sw - W - ml))) : 0;
    const ty = z > 1 ? Math.min(0, Math.max(parseFloat(piece.dataset.vy) || 0, Math.min(0, sh - H))) : 0;
    piece.dataset.vx = tx; piece.dataset.vy = ty;
    piece.style.transform = z > 1 ? `translate(${tx}px, ${ty}px) scale(${s})` : `scale(${s})`;
    piece.style.marginLeft = ml + 'px';
    piece.style.setProperty('--inv', (1 / s).toFixed(3));   // compensa la escala en tiradores y contornos
    piece.dataset.scale = s;
    stage.style.height = sh + 'px';                          // el alto de la tarjeta no cambia con el zoom
  });
  refreshPhotos();
}

/* Carga de fotos: se aplica a la pieza indicada */
document.querySelectorAll('input[type="file"][data-target]').forEach(input => {
  input.addEventListener('change', e => {
    const file = e.target.files[0];
    input.value = '';
    if (!file) return;

});

/* Guías de seguridad */
document.getElementById('show-guides').addEventListener('change', e => {
  document.body.classList.toggle('show-guides', e.target.checked);
});

/* ---------- Exportación ---------- */

/* Clona la pieza sin transformación de vista previa, sin guías ni controles */
function cloneForExport(id) {
  const clone = (typeof id === 'string' ? document.getElementById(id) : id).cloneNode(true);
  clone.removeAttribute('id');
  ['position', 'left', 'top', 'visibility'].forEach(k => clone.style.removeProperty(k));
  clone.style.transform = 'none';
  clone.style.marginLeft = '0';
  clone.style.removeProperty('--inv');
  clone.classList.remove('has-sel', 'is-editing');
  clone.querySelectorAll('.guide, .rs-box, .snap-layer').forEach(g => g.remove());
  clone.querySelectorAll('.drag, .editing, .selected').forEach(n => n.classList.remove('drag', 'editing', 'selected'));
  clone.querySelectorAll('[contenteditable]').forEach(n => n.removeAttribute('contenteditable'));
  return clone;
}

function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ---------- Exportación: la imagen la pinta el navegador ----------
   html2canvas redibuja el HTML "a mano" y calcula mal la línea base del texto y las sombras
   (el texto quedaba más abajo y la sombra del CTA tapaba el botón). Ahora la pieza se serializa
   a un SVG con <foreignObject>, con las fuentes incrustadas, y es el propio navegador quien la
   pinta en un canvas: el resultado coincide con lo que se ve en pantalla.
   html2canvas queda solo como respaldo si el navegador no permite este camino. */

let fontCssText = null;
const fontDataCache = {};

function rangeCovers(ur, chars) {
  return ur.split(',').some(tok => {
    const t = tok.trim().replace(/^U\+/i, '');
    let lo, hi;
    if (t.includes('?')) { lo = parseInt(t.replace(/\?/g, '0'), 16); hi = parseInt(t.replace(/\?/g, 'F'), 16); }
    else if (t.includes('-')) { const [a, b] = t.split('-'); lo = parseInt(a, 16); hi = parseInt(b, 16); }
    else lo = hi = parseInt(t, 16);
    for (const c of chars) if (c >= lo && c <= hi) return true;
    return false;
  });
}

async function toDataUrl(url) {
  if (fontDataCache[url]) return fontDataCache[url];
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const blob = await r.blob();
  const data = await new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = () => rej(fr.error);
    fr.readAsDataURL(blob);
  });
  return (fontDataCache[url] = data);
}

/* @font-face de Google Fonts con los archivos incrustados (solo los subconjuntos que usan los textos) */
async function embeddedFontCss(text) {
  try {
    if (fontCssText === null) {
      const links = [...document.querySelectorAll('link[rel="stylesheet"][href*="fonts.googleapis.com"]')];
      const parts = [];
      for (const l of links) {
        const r = await fetch(l.href);
        if (r.ok) parts.push(await r.text());
      }
      fontCssText = parts.join('\n');
    }
  } catch (_) { return ''; }          // sin conexión: se usan las fuentes de respaldo
  const chars = new Set([...text].map(c => c.codePointAt(0)));
  const out = [];
  for (const b of fontCssText.match(/@font-face\s*\{[^}]*\}/g) || []) {
    const ur = (b.match(/unicode-range:\s*([^;]+);/) || [])[1];
    if (ur && !rangeCovers(ur, chars)) continue;
    const m = b.match(/url\((['"]?)([^)'"]+)\1\)/);
    if (!m) continue;
    try { out.push(b.replace(m[0], `url(${await toDataUrl(m[2])})`)); } catch (_) { /* se omite ese subconjunto */ }
  }
  return out.join('\n');
}

function pageCss() {
  return (document.getElementById('brand-css').textContent + document.getElementById('piece-css').textContent)
    .replace(/:root/g, '.export-root');
}

async function buildSvg(id) {
  const { w, h } = fmtOf(id);
  const clone = cloneForExport(id);
  const fonts = await embeddedFontCss(clone.textContent);
  const markup = new XMLSerializer().serializeToString(clone);
  const css = (fonts + '\n' + pageCss()).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">` +
    `<foreignObject x="0" y="0" width="${w}" height="${h}">` +
    `<div xmlns="http://www.w3.org/1999/xhtml" class="export-root" style="width:${w}px;height:${h}px;overflow:hidden;">` +
    `<style>${css}</style>${markup}` +
    `</div></foreignObject></svg>`;
}

async function renderViaSvg(id, scale, q = 0.95) {
  const { w, h } = fmtOf(id);
  const paper = getComputedStyle(document.documentElement).getPropertyValue('--paper').trim() || '#f7f5f0';
  const svg = await buildSvg(id);
  // Importante: data URL y no blob URL. Con un blob URL el navegador marca el canvas como "contaminado"
  // y no deja leerlo; con data URL sí.
  const url = await new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = () => rej(fr.error);
    fr.readAsDataURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }));
  });
  {
    const img = new Image();
    await new Promise((res, rej) => {
      img.onload = res;
      img.onerror = () => rej(new Error('El navegador no pudo cargar la imagen SVG'));
      img.src = url;
    });
    try { await img.decode(); } catch (_) { /* no crítico */ }
    const cv = document.createElement('canvas');
    cv.width = Math.round(w * scale);
    cv.height = Math.round(h * scale);
    const ctx = cv.getContext('2d');
    const paint = () => {
      ctx.fillStyle = paper;
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
    };
    paint();                                          // la primera pasada deja listas las fuentes incrustadas
    await new Promise(r => setTimeout(r, 120));
    paint();
    // Comprobaciones: que el canvas no esté "tainted" (getImageData lanzaría un error) ni vacío
    const sm = document.createElement('canvas');
    sm.width = 40; sm.height = 50;
    const sctx = sm.getContext('2d');
    sctx.drawImage(cv, 0, 0, 40, 50);
    const d = sctx.getImageData(0, 0, 40, 50).data;
    let varied = false;
    for (let i = 4; i < d.length; i += 4) {
      if (d[i] !== d[0] || d[i + 1] !== d[1] || d[i + 2] !== d[2]) { varied = true; break; }
    }
    if (!varied) throw new Error('La imagen salió vacía');
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', q));
    if (!blob) throw new Error('No se pudo codificar el JPG');
    return blob;
  }
}

async function renderViaHtml2Canvas(id, scale, q = 0.95) {
  if (typeof html2canvas === 'undefined') throw new Error('html2canvas no está disponible');
  const { w, h } = fmtOf(id);
  const paper = getComputedStyle(document.documentElement).getPropertyValue('--paper').trim() || '#f7f5f0';
  const host = document.getElementById('export-host');
  const clone = cloneForExport(id);
  host.appendChild(clone);
  host.classList.add('on');
  try {
    const canvas = await html2canvas(clone, {
      scale, width: w, height: h, windowWidth: w, windowHeight: h,
      backgroundColor: paper, useCORS: true, logging: false
    });
    return await new Promise(r => canvas.toBlob(r, 'image/jpeg', q));
  } finally {
    clone.remove();
    host.classList.remove('on');
  }
}

async function exportJPG(id) {
  const scale = expScale('jpg');
  setBusy(true);
  try {
    await document.fonts.ready;
    let blob, fallback = false;
    try {
      blob = await renderViaSvg(id, scale);
    } catch (err) {
      console.warn('Exportación nativa no disponible, se usa el método alternativo:', err);
      fallback = true;
      blob = await renderViaHtml2Canvas(id, scale);
    }
    if (!blob) throw new Error('No se generó la imagen');
    const name = `${exportBase(id)}${scale === 2 ? '@2x' : ''}.jpg`;
    const note = 'Se usó un método alternativo de exportación: el texto o las sombras pueden verse levemente distintos.';
    if (isTouch()) showResult(blob, name, fallback ? note : null);
    else {
      download(blob, name);
      if (fallback) toast(note);
    }
  } catch (err) {
    alert('No se pudo generar el JPG: ' + err.message);
  } finally {
    setBusy(false);
  }
}

/* SVG: la pieza va dentro de un <foreignObject>, con sus estilos y las fuentes incrustadas.
   Limitación: el texto sigue siendo texto HTML (no trazos vectoriales); abrirlo fuera del
   navegador (Illustrator, Figma) puede verse distinto. */
async function exportSVG(id) {
  setBusy(true);
  try {
    const svg = await buildSvg(id);
    download(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }), `${exportBase(id)}.svg`);
  } catch (err) {
    alert('No se pudo generar el SVG: ' + err.message);
  } finally {
    setBusy(false);
  }
}

function fmtOf(id) {
  return typeof id === 'string' ? FORMATS[id] : { w: 1080, h: RATIO_H[document.querySelector('.card').dataset.fmt] };
}

/* Página fuera de pantalla (a partir de su instantánea) lista para exportar */
function pageExportEl(pg) {
  const live = pg === CURPG, snap = live ? snapOf(document.querySelector('.piece')) : pg.stack[pg.idx];
  const el = document.createElement('div');
  el.className = 'piece p-' + document.querySelector('.card').dataset.fmt;
  el.style.cssText = 'position:fixed;left:-20000px;top:0;visibility:hidden';
  el.innerHTML = snap.html;
  el.style.background = snap.bg;
  el.querySelectorAll('.ph-img[data-src-id]').forEach(n => { const u = IMGS[n.dataset.srcId]; if (u) n.style.backgroundImage = 'url("' + u + '")'; });
  document.body.appendChild(el);
  return el;
}

async function renderJpgBlob(src, scale, q) {
  try { return await renderViaSvg(src, scale, q); }
  catch (err) { console.warn('Exportación nativa no disponible, se usa el método alternativo:', err); return await renderViaHtml2Canvas(src, scale, q); }
}

/* ZIP sin compresión (los JPG ya están comprimidos): CRC-32 + cabeceras locales y directorio central */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = u8 => { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
async function makeZip(files) {
  const enc = new TextEncoder(), parts = [], cd = [];
  let off = 0, cdSize = 0;
  const dt = new Date(), time = (dt.getHours() << 11) | (dt.getMinutes() << 5) | (dt.getSeconds() >> 1);
  const date = ((dt.getFullYear() - 1980) << 9) | ((dt.getMonth() + 1) << 5) | dt.getDate();
  for (const f of files) {
    const data = new Uint8Array(await f.blob.arrayBuffer()), name = enc.encode(f.name), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true);
    parts.push(lh.buffer, name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true); ch.setUint32(42, off, true);
    cd.push(ch.buffer, name);
    cdSize += 46 + name.length;
    off += 30 + name.length + data.length;
  }
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...cd, end.buffer], { type: 'application/zip' });
}

async function exportAll(kind) {
  flushAll();
  const scale = expScale('jpg');
  const fmt = document.querySelector('.card').dataset.fmt, base = slug(PROJECT.name), pad = n => String(n).padStart(2, '0');
  setBusy(true);
  try {
    await document.fonts.ready;
    const files = [];
    for (let i = 0; i < PAGES.length; i++) {
      const el = pageExportEl(PAGES[i]), nm = base + '-' + pad(i + 1) + '-' + fmt;
      try {
        if (kind === 'svg') files.push({ name: nm + '.svg', blob: new Blob([await buildSvg(el)], { type: 'image/svg+xml;charset=utf-8' }) });
        else files.push({ name: nm + (scale === 2 ? '@2x' : '') + '.jpg', blob: await renderJpgBlob(el, scale) });
      } finally { el.remove(); }
    }
    download(await makeZip(files), base + '-' + fmt + '-' + kind + '.zip');
  } catch (err) {
    alert('No se pudo generar el ZIP: ' + err.message);
  } finally {
    setBusy(false);
  }
}
document.querySelectorAll('[data-dl-all]').forEach(b => b.addEventListener('click', () => exportAll(b.dataset.dlAll)));

document.querySelectorAll('[data-jpg]').forEach(btn =>
  btn.addEventListener('click', () => exportJPG(btn.dataset.jpg)));
document.querySelectorAll('[data-svg]').forEach(btn =>
  btn.addEventListener('click', () => exportSVG(btn.dataset.svg)));

/* ---------- Helpers de geometría y estado ---------- */
let selected = null;
let dragState = null;
let tapC = null, gesture = null, lastPtr = 'mouse', dtEdit = null;
const touches = new Map();

function scaleOf(piece) { return parseFloat(piece.dataset.scale) || 1; }
function isLocked(el) { return !!el && el.dataset.locked === '1'; }
function zOf(el) { return parseFloat(el.style.zIndex) || 0; }

/* Aplica traslación y giro juntos (translate y rotate guardados en data-*) */
function applyT(el) {
  const dx = parseFloat(el.dataset.dx) || 0;
  const dy = parseFloat(el.dataset.dy) || 0;
  const rot = parseFloat(el.dataset.rot) || 0;
  el.style.transform = (dx || dy || rot) ? `translate(${dx}px, ${dy}px) rotate(${rot}deg)` : '';
}

function moveBy(el, ddx, ddy) {
  el.dataset.dx = (parseFloat(el.dataset.dx) || 0) + ddx;
  el.dataset.dy = (parseFloat(el.dataset.dy) || 0) + ddy;
  applyT(el);
}

/* Caja del elemento en píxeles de la pieza (sin escala de vista previa) */
function rectIn(el) {
  const piece = el.closest('.piece');
  const s = scaleOf(piece);
  const pr = piece.getBoundingClientRect();
  const r = el.getBoundingClientRect();
  return { x: (r.left - pr.left) / s, y: (r.top - pr.top) / s, w: r.width / s, h: r.height / s };
}

/* Elementos de primer nivel de una pieza (el sticker va dentro de su foto), ordenados por z ascendente */
function topLevel(piece) {
  return [...piece.querySelectorAll('.drag')]
    .filter(d => !d.parentElement.closest('.drag'))
    .sort((a, b) => zOf(a) - zOf(b));
}

function nextZ(piece) {
  return Math.max(10, ...topLevel(piece).map(zOf)) + 10;
}

function select(el) {
  const owner = textEl && textEl.closest('.drag');
  if (owner && owner !== el) closeTextBar();
  if (selected) selected.classList.remove('selected');
  selected = el || null;
  if (selected) selected.classList.add('selected');
  refreshAll();
}

function refreshAll() {
  updateBox();
  document.querySelectorAll('.card').forEach(refreshPanel);
  updateSheet();
}

/* ---------- Arrastre y edición ---------- */

/* Asigna z-index inicial en orden de DOM y marca los elementos como arrastrables */
function initDraggableIn(piece) {
  let z = 10;
  piece.querySelectorAll('.photo, .pc-sticker, [data-f]').forEach(el => {
    if (el.closest('.pc-sticker') && !el.classList.contains('pc-sticker')) return;
    el.classList.add('drag');
    el.dataset.dx = 0;
    el.dataset.dy = 0;
    el.dataset.rot = 0;
    el.dataset.locked = '0';
    el.dataset.origin = 'template';   // elemento de la plantilla (los añadidos por el usuario son "user")
    el.dataset.uid = newUid();
    el.style.zIndex = z;
    z += 10;
  });
}
function initDraggable() { document.querySelectorAll('.piece').forEach(initDraggableIn); }

document.addEventListener('pointerdown', e => {
  lastPtr = e.pointerType || 'mouse';
  const pieceEl = e.target.closest('.piece');
  const el = e.target.closest('.drag');
  const editingThis = !!el && el.classList.contains('editing');
  if (e.pointerType === 'touch') {
    // Táctil: con algo seleccionado la pieza no hace scroll, así que se arrastra directo.
    // Sin selección, un toque solo selecciona (al soltar) para no robarle el scroll a la página.
    const armed = !!pieceEl && pieceEl.classList.contains('has-sel') && !pieceEl.classList.contains('is-editing');
    if (!el || !armed) {
      if (pieceEl && !editingThis) tapC = { el: el || null, id: e.pointerId, x: e.clientX, y: e.clientY };
      return;
    }
  }
  if (pieceEl && !editingThis) select(el);
  if (!el || editingThis || isLocked(el) || gesture) return;
  startDrag(el, e);
  e.preventDefault();
});

/* Inicia el arrastre de un elemento (lo usan el propio elemento y el ícono de mover) */
function startDrag(el, e) {
  dragState = {
    el,
    s: scaleOf(el.closest('.piece')),
    startX: e.clientX, startY: e.clientY,
    baseX: parseFloat(el.dataset.dx) || 0,
    baseY: parseFloat(el.dataset.dy) || 0,
    piece: el.closest('.piece'),
    r0: rectIn(el),                                  // caja del elemento al empezar (coordenadas de la pieza)
    targets: snapOn() ? snapTargets(el) : null,      // cajas de todo lo demás contra lo que se alinea
    hasGuides: false
  };
}

document.addEventListener('pointermove', e => {
  if (!dragState) return;
  const { el, s, startX, startY, baseX, baseY } = dragState;
  let dx = baseX + (e.clientX - startX) / s;
  let dy = baseY + (e.clientY - startY) / s;
  if (dragState.targets && !e.altKey) {
    const r0 = dragState.r0;
    const moved = { x: r0.x + dx - baseX, y: r0.y + dy - baseY, w: r0.w, h: r0.h };
    const res = snapRect(moved, dragState.targets, (isTouch() ? SNAP_TOUCH : SNAP_FINE) / s);
    dx += res.sx;                                    // el imán corrige la posición...
    dy += res.sy;
    drawGuides(dragState.piece, res.guides);         // ...y se dibujan las líneas coincidentes
    const has = res.guides.x.length + res.guides.y.length > 0;
    if (has && !dragState.hasGuides && navigator.vibrate) navigator.vibrate(6);   // toque háptico al "pegarse" (si el dispositivo lo permite)
    dragState.hasGuides = has;
  } else {
    clearGuides(dragState.piece);
  }
  el.dataset.dx = dx;
  el.dataset.dy = dy;
  applyT(el);
});

document.addEventListener('pointerup', () => {
  if (dragState) { clearGuides(dragState.piece); refreshAll(); }
  dragState = null;
});

/* Doble clic: activar edición del texto (si no está bloqueado) */
document.addEventListener('dblclick', e => {
  if (isTouch()) return;   // en táctil el doble toque abre la barra de texto (ver startEdit)
  const el = e.target.closest('[data-f]');
  if (el && el.closest('.piece')) startEdit(el);
});

document.addEventListener('focusin', e => {
  const el = e.target;
  if (el.classList && el.classList.contains('editing')) {
    document.body.classList.add('editing');
    const p = el.closest('.piece');
    if (p) p.classList.add('is-editing');
    updateSheet();
  }
});

document.addEventListener('focusout', e => {
  const el = e.target;
  if (el.classList && el.classList.contains('editing')) {
    el.contentEditable = 'false';
    el.classList.remove('editing');
    document.body.classList.remove('editing');
    const p = el.closest('.piece');
    if (p) p.classList.remove('is-editing');
    refreshAll();
    if (p) commitNow(p);                  // el texto editado es una entrada de historial
    setTimeout(fitPreviews, 300);
  }
}, true);

document.addEventListener('input', e => {
  if (e.target.classList && e.target.classList.contains('editing')) updateBox();
});

document.addEventListener('keydown', e => {
  const el = e.target;
  if (!el.classList || !el.classList.contains('editing')) return;
  if (e.key === 'Escape' || (e.key === 'Enter' && !el.classList.contains('pc-body'))) {
    e.preventDefault();
    el.blur();
  }
});

document.addEventListener('paste', e => {
  const el = e.target;
  if (!el.classList || !el.classList.contains('editing')) return;
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData('text/plain');
  document.execCommand('insertText', false, text);
});

document.getElementById('reset-pos').addEventListener('click', () => {
  document.querySelectorAll('.drag').forEach(el => {
    el.dataset.dx = 0;
    el.dataset.dy = 0;
    el.dataset.rot = 0;
    applyT(el);
  });
  refreshAll();
});

/* Quita <script> y atributos on* antes de agregar código personalizado */
function sanitize(html) {
  return String(html)
    .replace(/<script[\s\S]*?<\/script>/gi, '')
    .replace(/<\/?(iframe|object|embed|link|meta|base|form)\b[^>]*>/gi, '')
    .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '')
    .replace(/(href|src|xlink:href)\s*=\s*(["'])\s*javascript:[^"']*\2/gi, '$1=$2$2');
}

/* ---------- Color: hex, rgb(), rgba() ---------- */
function toHex6(c) {
  if (!c) return null;
  c = c.trim();
  let m = c.match(/^#([0-9a-f]{6})$/i);
  if (m) return '#' + m[1].toLowerCase();
  m = c.match(/^#([0-9a-f]{3})$/i);
  if (m) return '#' + [...m[1]].map(x => x + x).join('').toLowerCase();
  const n = c.match(/[\d.]+/g);
  if (c.startsWith('rgb') && n && n.length >= 3) {
    return '#' + n.slice(0, 3).map(v => Math.round(+v).toString(16).padStart(2, '0')).join('');
  }
  return null;
}

function bindColor(textEl, pickEl, prop, getTarget) {
  textEl.addEventListener('input', () => {
    const v = textEl.value.trim();
    if (!v && textEl.dataset.clr) {   // vacío = quitar el fondo
      textEl.classList.remove('invalid');
      const t0 = getTarget(); if (t0) t0.style[prop] = '';
      return;
    }
    if (!v || /url\(/i.test(v) || !CSS.supports(prop === 'background' ? 'background' : 'color', v)) {
      textEl.classList.toggle('invalid', !!v);
      return;
    }
    textEl.classList.remove('invalid');
    const t = getTarget();
    if (!t) return;
    t.style[prop] = v;
    const hex = toHex6(v);
    if (hex) pickEl.value = hex;
  });
  pickEl.addEventListener('input', () => {
    textEl.value = pickEl.value;
    textEl.classList.remove('invalid');
    const t = getTarget();
    if (t) t.style[prop] = pickEl.value;
  });
}

/* Nombre visible de un elemento */
function elName(el) {
  if (el.classList.contains('photo')) return 'Foto';
  if (el.classList.contains('pc-sticker')) return 'Sticker de dato';
  if (el.classList.contains('deco')) return 'Decorativo';
  if (el.dataset.f) {
    const txt = el.textContent.replace(/\s+/g, ' ').trim().slice(0, 22);
    return (LABELS[el.dataset.f] || 'Texto') + (txt ? ': ' + txt : '');
  }
  return 'Elemento';
}

/* Lista de elementos (con sticker anidado bajo su foto) */
function renderList(card) {
  const piece = card.querySelector('.piece');
  const list = card.querySelector('.el-list');
  const items = topLevel(piece).reverse(); // arriba = al frente
  list.innerHTML = '';
  items.forEach((el, idx) => {
    list.appendChild(makeRow(el, false, idx === 0, idx === items.length - 1));
    const sticker = Array.from(el.children).find(c => c.classList.contains('pc-sticker'));
    if (sticker) list.appendChild(makeRow(sticker, true));
  });
}

function makeRow(el, sub, isTop, isBottom) {
  const row = document.createElement('div');
  row.className = 'el-row' + (sub ? ' sub' : '') + (el === selected ? ' on' : '');
  const locked = isLocked(el);
  const name = document.createElement('span');
  name.className = 'nm';
  name.textContent = elName(el) + (locked ? ' · bloqueado' : '');
  name.addEventListener('click', () => select(el));
  row._el = el;
  if (!sub) {
    const g = document.createElement('span');
    g.className = 'grip';
    g.setAttribute('aria-hidden', 'true');
    g.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';
    row.appendChild(g);
  }
  row.appendChild(name);

  if (!sub) {
    row.insertAdjacentHTML('beforeend', `
      <button class="ib up" title="Adelante" ${isTop ? 'disabled' : ''}>▲</button>
      <button class="ib down" title="Atrás" ${isBottom ? 'disabled' : ''}>▼</button>
      <button class="ib more" title="Más opciones" aria-label="Más opciones">

        <button class="m-lock">${locked ? 'Desbloquear' : 'Bloquear'}</button>
        <button class="m-del" ${locked ? 'disabled' : ''}>Eliminar</button>
      </div>`);

    row.querySelector('.up').addEventListener('click', () => { orderOp(el, 'up'); refreshAll(); });
    row.querySelector('.down').addEventListener('click', () => { orderOp(el, 'down'); refreshAll(); });
    const menu = row.querySelector('.el-menu');
    row.querySelector('.more').addEventListener('click', e => {
      e.stopPropagation();
      const open = menu.classList.contains('open');
      document.querySelectorAll('.el-menu.open').forEach(m => m.classList.remove('open'));

    });

}
